name: Mailbox parity

# Drift-enforcement lock for the c11 mailbox primitive (C11-13 Stage 2).
# Push and PR events stay cheap: this workflow only compiles the Python parity
# harness. Native Mailbox* and StdinHandler* coverage runs in the hourly
# `c11-logic` lane in `ci-hourly.yml`.
#
# Out of scope (follow-up): launching a real c11 app on a virtual display and
# running the Python parity test against its socket. The host-driven UI test
# harness was removed in C11-99 Area D (the `test-e2e.yml` workflow had been
# bit-rotted against a renamed scheme); the byte-level lock this workflow owns
# is too narrow to justify rebuilding the ffmpeg + TCC harness on every push.

on:
  push:
    paths:
      - "tests_v2/test_mailbox_parity.py"
      - "tests/test_mailbox_hook_drain_cli.py"
      - "Resources/bin/codex"
      - "Sources/Mailbox/**"
      - "CLI/c11.swift"
      - "spec/**"
      - "c11Tests/Mailbox*.swift"
      - "c11Tests/StdinHandler*.swift"
      - ".github/workflows/mailbox-parity.yml"
  pull_request:
    paths:
      - "tests_v2/test_mailbox_parity.py"
      - "tests/test_mailbox_hook_drain_cli.py"
      - "Resources/bin/codex"
      - "Sources/Mailbox/**"
      - "CLI/c11.swift"
      - "spec/**"
      - "c11Tests/Mailbox*.swift"
      - "c11Tests/StdinHandler*.swift"
      - ".github/workflows/mailbox-parity.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile parity test (syntax check)
        run: python3 -m py_compile tests_v2/test_mailbox_parity.py tests/test_mailbox_hook_drain_cli.py
