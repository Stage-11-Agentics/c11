name: Build GhosttyKit

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ghosttykit:
    # This workflow has no pull_request trigger. Keep the guard adjacent to the
    # paid runner so a future trigger cannot silently make fork PRs run on Atlas.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, atlas]
    timeout-minutes: 45
    env:
      C11_ATLAS_BUILD_SLUG: c11-build-ghosttykit
      C11_ATLAS_SLOTS_DIR: /tmp/c11-atlas-build-slots
      C11_BUILD_LOCK_TIMEOUT: '5400'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Get ghostty SHA
        id: ghostty-sha
        run: |
          SHA=$(git -C ghostty rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Ghostty SHA: $SHA"

      - name: Check if xcframework release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="xcframework-${{ steps.ghostty-sha.outputs.sha }}"
          if gh release view "$TAG" --repo Stage-11-Agentics/c11 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG not found, will build"
          fi

      - name: Select Xcode
        if: steps.check-release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            XCODE_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | head -n 1 || true)"
            if [ -n "$XCODE_APP" ]; then
              XCODE_DIR="$XCODE_APP/Contents/Developer"
            else
              echo "No Xcode.app found under /Applications" >&2
              exit 1
            fi
          fi
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          xcodebuild -version

      - name: Ensure process-scoped Zig
        if: steps.check-release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          ZIG_DIR="$(./scripts/ensure-zig.sh)"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          export PATH="$ZIG_DIR:$PATH"
          zig version

      - name: Build GhosttyKit.xcframework
        if: steps.check-release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          cd ghostty
          "$GITHUB_WORKSPACE/scripts/ci-atlas-run.sh" zig build \
            -Demit-xcframework=true -Demit-macos-app=false \
            -Dxcframework-target=universal -Doptimize=ReleaseFast

      - name: Package xcframework
        if: steps.check-release.outputs.exists == 'false'
        run: |
          set -euo pipefail
          rm -rf GhosttyKit.xcframework
          cp -R ghostty/macos/GhosttyKit.xcframework GhosttyKit.xcframework
          tar czf GhosttyKit.xcframework.tar.gz GhosttyKit.xcframework

      - name: Upload xcframework release
        if: steps.check-release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="xcframework-${{ steps.ghostty-sha.outputs.sha }}"
          # Must never become the repo's "latest" release: Sparkle's feed URL is
          # releases/latest/download/appcast.xml, and a build-artifact release
          # holding the latest slot 404s that path for every shipped client.
          gh release create "$TAG" \
            --repo Stage-11-Agentics/c11 \
            --title "GhosttyKit xcframework (${{ steps.ghostty-sha.outputs.sha }})" \
            --notes "Pre-built GhosttyKit.xcframework for commit ${{ steps.ghostty-sha.outputs.sha }}" \
            --prerelease \
            --latest=false \
            GhosttyKit.xcframework.tar.gz
          echo "Published release $TAG"

      - name: Pin checksum in ghosttykit-checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ steps.ghostty-sha.outputs.sha }}"
          CHECKSUMS_FILE="scripts/ghosttykit-checksums.txt"
          if grep -q "^$SHA " "$CHECKSUMS_FILE"; then
            echo "Checksum for $SHA already present, skipping"
            exit 0
          fi
          TAG="xcframework-$SHA"
          ARCHIVE="GhosttyKit.xcframework.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then
            gh release download "$TAG" --repo Stage-11-Agentics/c11 --pattern "$ARCHIVE"
          fi
          CHECKSUM="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          echo "$SHA $CHECKSUM" >> "$CHECKSUMS_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CHECKSUMS_FILE"
          git commit -m "ci: pin GhosttyKit checksum for ghostty $SHA"
          git push
