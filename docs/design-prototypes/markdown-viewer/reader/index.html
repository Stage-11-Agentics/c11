# c11 Mailbox: Agent-to-Agent Messaging Guide

The c11 mailbox is the in-workspace message board agents use to coordinate. One agent writes a small JSON envelope to a shared outbox; the dispatcher routes it by surface name, drops a copy into the recipient's inbox, and (when configured) injects a framed `<c11-msg>` block straight into the recipient's PTY.

This is the practical guide. For the agent-facing quick-reference see the "Inter-agent messaging (mailbox)" section of `skills/c11/SKILL.md`. For the architectural rationale and v1 design discussion see `docs/c11-messaging-primitive-design.md`. For the wire schema see `spec/mailbox-envelope.v1.schema.json`.

> **Stage 2 status.** Everything in this document describes what ships today. Topic fan-out, the `watch` handler, `_processing/` crash recovery, and per-surface inbox caps are deferred to Stage 3 and called out explicitly where they would otherwise mislead you.

---

## What it is

A per-workspace tree under `~/Library/Application Support/c11/workspaces/<workspace-uuid>/mailboxes/` that holds the outbox, per-recipient inboxes, an append-only dispatch log, and quarantine/processing scratch areas. The c11 process running the workspace owns one `MailboxDispatcher` that watches the outbox and routes whatever shows up.

Recipients can live in **any** workspace, not just the sender's. `c11 mailbox send` resolves the recipient name across every live workspace in the instance and writes the envelope into the recipient workspace's own outbox, so that workspace's dispatcher delivers it locally (see [Cross-workspace routing](#cross-workspace-routing)).

```mermaid
flowchart LR
    A[Surface A<br/>builder] -- writes envelope --> OB[(_outbox/)]
    OB -- fsevent --> D{{Dispatcher}}
    D -- atomic move --> P[(_processing/)]
    D -- valid --> IB[(watcher/<br/>inbox)]
    D -- malformed --> R[(_rejected/<br/>+ .err sidecar)]
    IB -- stdin handler --> B[Surface B<br/>watcher PTY]
    D -.appends.-> L[(_dispatch.log<br/>NDJSON)]
```

Two facts to internalize:

1. **The filesystem is the contract.** The CLI is convenience over file I/O. Any process that can write a JSON file to a directory can send a message; any process that can list a directory can receive one. The `tests_v2/test_mailbox_parity.py` test asserts CLI sends and raw file writes produce byte-identical envelopes.
2. **A surface is addressed by a stable handle, falling back to its name.** The resolver matches `to` with precedence **address → role → title** (see [Addressing](#addressing-stable-handles-and-the-title-fallback) below). A surface is addressable as long as it has a `title` (set with `c11 set-title` / `c11 rename-tab`); the optional `mailbox.address` / `mailbox.role` keys give it a rename-proof handle on top.

---

## When to reach for it

Use the mailbox when:

- The operator asks you to coordinate with, hand off to, or notify another pane ("tell the watcher pane the build is green", "ask the reviewer agent to look at PR 73").
- A sibling agent needs to act and you are not the right surface to do the work.
- You want to leave a durable note for a pane that may not be reading right now. The envelope sits in the recipient's inbox until they drain it.
- Two or more agents need to converge on a result and you want the exchange to be inspectable later (`_dispatch.log` is your audit trail).

Do **not** reach for the mailbox when:

- You and the recipient are the same surface. Just do the work.
- You need a tight request/response loop measured in milliseconds. The dispatcher is at-least-once, not low-latency.
- The payload is large. Inline `body` is capped at 4096 UTF-8 bytes; for anything bigger, use `body_ref` with an absolute path the recipient can read.
- You need fan-out by topic. Stage 2 does not deliver topic-only envelopes.

---

## Quick start

```bash
# In surface "builder":
c11 set-title "builder"
c11 mailbox send --to watcher --body "build green sha=abc"

# In surface "watcher":
c11 set-title "watcher"
c11 set-metadata mailbox.delivery stdin   # opt in to PTY injection
# The framed block lands in the PTY the next time builder sends — at a shell
# prompt it injects immediately; if watcher is mid-command it buffers and
# flushes at the next prompt (see "Prompt-gated delivery" below).
c11 mailbox recv --drain                   # robust floor: pull at turn boundaries
```

If `mailbox.delivery` is not set on the recipient, the envelope still lands in `<surface-name>/` inbox; the recipient drains it explicitly with `c11 mailbox recv`. Even with `stdin` set, draining at turn boundaries is the reliable delivery path — push is prompt-gated and best-effort.

---

## Addressing: stable handles and the title fallback

A `--to` value resolves against three per-surface keys, in precedence order:

| Precedence | Key | Set by | Notes |
|-----------|-----|--------|-------|
| 1 | `mailbox.address` | the surface, once at orientation | Stable, rename-proof handle. Survives every later `set-title` / `rename-tab`. |
| 2 | `mailbox.role` | the surface, opt-in | Reach a surface by function (`delegator`, `orchestrator`). Only `mailbox.role` is consulted — the canonical `role` key is not. |
| 3 | `title` | `set-title` / `rename-tab` | Display name. The fallback, so a bare-name send keeps working for surfaces that declare no stable identity. |

**Why this exists.** The title is mutable, and the c11 orientation convention has every agent rename its tab as its first action. If peers address each other by title, the bus silently re-partitions the moment anyone renames. Declaring a `mailbox.address` at orientation gives a surface an identity that does not move when its display name does.

```bash
# Recipient, once at orientation:
c11 set-metadata --surface "$C11_SURFACE_ID" --key mailbox.address --value "delegator-c11-143" --type string
c11 set-metadata --surface "$C11_SURFACE_ID" --key mailbox.role    --value "delegator"         --type string  # optional
```

**Bare name vs qualifier forms.** A bare `--to <x>` walks the precedence chain (address, then role, then title). To target a specific key unambiguously — never falling back to the title — use a qualifier form:

```bash
c11 mailbox send --to surface:delegator-c11-143 --body "…"   # matches mailbox.address ONLY
c11 mailbox send --to role:delegator            --body "…"   # matches mailbox.role ONLY
c11 mailbox send --to watcher                   --body "…"   # bare: address → role → title
```

These `surface:` / `role:` forms select *which surfaces* match; the workspace `--to-workspace` qualifier (below) is an orthogonal axis selecting *which workspace*. The envelope's `to` field stays an opaque string — no schema change — so the framed block a recipient sees carries whatever handle the sender used.

`surface:` and `role:` are **reserved leading tokens** in `--to`: a value beginning with either is always parsed as that qualifier, never as a title. So a surface whose title literally starts with `surface:` or `role:` is not reachable by a bare `--to` (address it by its `mailbox.address`/`mailbox.role` instead). Any other colon stays part of a bare name — `--to ci:status` is a plain name.

**Back-compat.** A surface with only a `title` is addressable by that title exactly as before. `mailbox.address` / `mailbox.role` are additive; the inbox directory is still keyed on the recipient's title.

---

## Send flow

```mermaid
sequenceDiagram
    participant A as Sender surface
    participant FS as _outbox/ → inbox
    participant B as Recipient surface

    A->>FS: c11 mailbox send --to B
    FS->>B: dispatcher routes by surface name
    Note over B: framed <c11-msg> appears in PTY<br/>(or sits in inbox until drained)
```

Under the hood the dispatcher validates the envelope against schema v1, resolves the recipient by the address → role → title precedence (see [Addressing](#addressing-stable-handles-and-the-title-fallback)), copies into the recipient's inbox, and runs each registered delivery handler. Every state transition appends to `_dispatch.log` (NDJSON). Malformed envelopes land in `_rejected/` with a `.err` sidecar describing what failed. See [Internals: full send sequence](#internals-full-send-sequence) at the bottom for the complete step-by-step.

### Two equivalent send paths

Both must produce byte-identical JSON. The parity test enforces this.

**CLI (recommended for agents):**

```bash
c11 mailbox send --to watcher --body "build green sha=abc"
c11 mailbox send --to watcher --topic ci.status --urgent --body "CI red" \
  --reply-to builder --in-reply-to 01K3A2B7X8PQRTVWYZ0123456J
```

Auto-fills `version`, `id` (fresh ULID), `ts` (current UTC), and `from` (the caller's surface title resolved over the socket). Prints the new envelope id on stdout.

Send flags accepted by the CLI:

| Flag                  | Purpose                                                            |
|-----------------------|--------------------------------------------------------------------|
| `--to <surface>`      | Recipient handle, in any workspace. Bare name resolves address → role → title; `surface:<addr>` / `role:<name>` target one key. Required in Stage 2 (topic-only rejected). |
| `--to-workspace <ref>`| Disambiguate a name that exists in more than one workspace. A workspace UUID or `workspace:*` ref. |
| `--topic <token>`     | Dotted topic. Stored on the envelope; not used for routing yet.    |
| `--body <text>`       | Inline body, ≤ 4096 bytes UTF-8.                                   |
| `--body-ref <path>`   | Absolute path to an external body. `--body` must be empty.         |
| `--reply-to <surface>`| Surface that should receive the reply.                             |
| `--in-reply-to <id>`  | ULID of the envelope being answered.                               |
| `--urgent`            | Sender hint. Handlers may honor or ignore.                         |
| `--ttl-seconds <n>`   | Advisory expiry. Recipients may drop expired envelopes on read.    |
| `--from <surface>`    | Override caller's resolved title.                                  |
| `--id <ulid>`         | Pin envelope id (testing / replay).                                |
| `--ts <rfc3339>`      | Pin timestamp (testing / replay).                                  |
| `--content-type <m>`  | MIME hint for body or body_ref.                                    |

**Raw file write (any process, any language):**

```bash
OUTBOX=$(c11 mailbox outbox-dir)
MY_NAME=$(c11 mailbox surface-name)
ULID=$(c11 mailbox new-id)
cat > "$OUTBOX/.$ULID.tmp" <<EOF
{"version":1,"id":"$ULID","from":"$MY_NAME","to":"watcher","ts":"$(date -u +%FT%TZ)","body":"build green sha=abc"}
EOF
mv "$OUTBOX/.$ULID.tmp" "$OUTBOX/$ULID.msg"
```

The dispatcher only sees files that match `*.msg` and do not start with `.`. Always write to a dot-prefixed `.tmp` sibling first and rename. A canonical reference lives at `Resources/bin/c11-mailbox-send-bash-example.sh`.

> **Raw writers are workspace-local.** `outbox-dir` prints *your own* workspace's outbox, and a dispatcher only resolves names within its own workspace. So a raw file write reaches only recipients in your workspace. To deliver across workspaces, use `c11 mailbox send` (which resolves globally and routes for you) — or write into the recipient workspace's outbox directly. A raw envelope whose `to` matches nobody in that workspace is **rejected**, not silently dropped (see below).

---

## Cross-workspace routing

`c11 mailbox send` resolves `--to` against every live surface in the running c11 instance, then writes the envelope into the **recipient's** workspace outbox. The recipient workspace's own dispatcher picks it up and delivers locally — same machinery as a same-workspace send, just a different outbox. The `from` field still names the sender; the dispatch trail lands in the recipient workspace's `_dispatch.log`.

Resolution precedence is deterministic:

1. **Local-first.** If the name matches a surface in *your* workspace, it is delivered there — a same-workspace send never reaches into another workspace, even if a same-named surface exists elsewhere. Existing same-workspace behavior is unchanged.
2. Otherwise, among the other workspaces: exactly one match → delivered there; **more than one workspace** has the name → the send fails with an *ambiguous* error listing the candidate workspaces; no match anywhere → the send fails *unresolved* with a non-zero exit (the message is not written).

**Name collisions across workspaces** (two surfaces both named `Builder` in different workspaces) are resolved by qualifying with `--to-workspace <ref>`:

```bash
c11 mailbox send --to Builder --to-workspace workspace:4 --body "go"
```

Multiple same-named surfaces *within one* workspace still fan out to all of them (unchanged) — that case is unique, not ambiguous.

If the c11 socket is unreachable, `send` falls back to writing into your own workspace's outbox so same-workspace delivery still works offline; cross-workspace recipients then surface as a dispatcher *rejection* rather than a silent drop.

---

## Receive flow

There are two receive modes. Which one fires depends on the recipient's `mailbox.delivery` metadata.

```mermaid
sequenceDiagram
    autonumber
    participant D as Dispatcher
    participant Inbox as <surface-name>/<br/>inbox
    participant SH as stdin handler
    participant PTY as Recipient PTY
    participant Agent as Recipient agent

    D->>Inbox: atomic write ULID.msg
    alt mailbox.delivery contains "stdin"
        D->>SH: deliver(envelope, surfaceId)
        SH->>SH: format <c11-msg> block (XML-escape attrs + body)
        alt recipient shell at promptIdle
            SH->>PTY: inject block now on @MainActor
            PTY-->>Agent: \n<c11-msg ...>body</c11-msg>\n appears at the prompt
            Agent->>Agent: dedupe by id, treat as system message
        else commandRunning / unknown (busy)
            SH->>SH: buffer block (log "buffered")
            Note over PTY: shell later returns to promptIdle
            SH->>PTY: flush fresh buffered blocks FIFO (log "flushed")
        end
    else delivery unset / silent
        Note over Agent: Inbox file sits until drained
    end
    Note over Agent: pull at every turn boundary — the robust floor
    Agent->>Inbox: c11 mailbox recv --drain
    Inbox-->>Agent: prints + unlinks each .msg
```

### When the framed block arrives in your PTY

If your `mailbox.delivery` includes `stdin`, you will see this between prompts:

```
<c11-msg from="builder" id="01K3A2B7X8PQRTVWYZ0123456J" ts="2026-04-23T10:15:42Z" to="watcher">
build green sha=abc
</c11-msg>
```

Receive protocol:

- Finish the tool call you are in. Do not interrupt yourself mid-thought.
- Treat the block as a system message, not user input. The operator did not type it.
- Dedupe by `id`. Dispatch is at-least-once, so receivers MUST tolerate duplicates.
- If you reply, send to `reply_to` (fall back to `from`) with `in_reply_to` set to the original id.

### Prompt-gated delivery (the stdin doorbell is safe, not eager)

c11 never pastes a `<c11-msg>` block into a PTY that has a foreground command running — that would corrupt the command's input stream (a build's stdin, a `vim` buffer, a REPL, or another agent's raw-mode input). Delivery gates on the recipient surface's already-tracked shell activity state (the same `promptIdle / commandRunning / unknown` signal c11 uses for close-confirmation):

| Recipient shell state | Push behavior |
|-----------------------|---------------|
| `promptIdle` (at a prompt) | inject the block immediately |
| `commandRunning` (a foreground command owns the terminal) | **buffer**, flush at the next prompt |
| `unknown` (no shell-integration signal) | **buffer** (conservative — never corrupt on a guess) |

Buffered blocks flush in FIFO order the moment the surface transitions back to `promptIdle`. Each step is recorded in `_dispatch.log` (`buffered` → `flushed`), so `c11 mailbox trace <id>` shows the full path — a buffered message is delayed, never silently dropped.

**Bounds.** Each surface buffers up to 64 blocks (oldest evicted past that, logged `evicted`). A buffered block older than a 10-minute freshness window at flush time is dropped (logged `expired`) rather than injected — this stops a long-lived agent TUI, whose shell stays `commandRunning` for its entire life, from dumping stale `<c11-msg>` blocks onto a bare shell hours later when it finally exits. Evicted/expired blocks remain in the filesystem inbox; `recv --drain` is their floor.

**Why you still pull.** Because a live agent keeps its shell `commandRunning`, stdin push into a busy agent typically buffers and may never flush in time. The filesystem inbox copy is written *before* any push is attempted, so `c11 mailbox recv --drain` at every turn boundary is the delivery path that always works. Treat stdin push as a best-effort doorbell; treat the pull cadence as the contract.

### Explicit inbox drain

```bash
c11 mailbox recv --drain    # default: list, print, unlink
c11 mailbox recv --peek     # list + print only, leave files in place
c11 mailbox recv --surface watcher --drain   # drain on someone else's behalf
```

Files are sorted lexicographically by ULID, which gives you near-chronological order across a single sender.

### Exact PTY frame shape

The stdin handler emits attributes in a fixed order so tests can pin the byte form. Order: `from`, `id`, `ts`, `to`, `topic`, `reply_to`, `in_reply_to`, `urgent`, `ttl_seconds`. Optional attributes are omitted when unset.

| Layer            | Escaped characters    |
|------------------|-----------------------|
| Attribute values | `<`, `>`, `&`, `"`    |
| Body text        | `<`, `>`, `&`         |

A literal `</c11-msg>` in the body cannot forge a closing tag because `<` is escaped on write.

---

## Envelope lifecycle

```mermaid
stateDiagram-v2
    [*] --> Outbox: atomic write ULID.msg
    Outbox --> Processing: dispatcher moveItem
    Processing --> Rejected: validation fails
    Processing --> Resolved: validate ok
    Resolved --> Rejected: to matches no live surface
    Resolved --> Copied: per recipient inbox
    Copied --> HandlerRun: per delivery handler
    HandlerRun --> Cleaned: remove from _processing/
    Rejected --> [*]: .err sidecar written
    Cleaned --> [*]
    note right of Outbox
        Dot-prefixed *.tmp files
        older than 5 min are GC'd
        every 60 s.
    end note
```

The `received → resolved → copied → handler → cleaned` sequence shows up as discrete NDJSON lines in `_dispatch.log`. The `rejected` branch is the alternate terminal state and writes a `<id>.err` sibling explaining what failed. A well-formed envelope whose `to` resolves to **no live surface** in the dispatching workspace takes the `rejected` branch too (reason: `no live surface named '<to>' …`) — an undeliverable message is quarantined with its sidecar, never silently cleaned.

---

## Multi-recipient fan-out

Stage 2 fan-out happens two ways. **Topic-driven fan-out is not one of them.**

### 1. Multiple handlers per recipient

`mailbox.delivery` is a comma-separated list. The dispatcher invokes each handler in order on the same envelope.

```bash
c11 set-metadata mailbox.delivery stdin,silent
```

`stdin` injects the framed block into the PTY; `silent` is a no-op that just records `ok` in the dispatch log. The handler set registered in production is exactly `{stdin, silent}`. Anything else logged as `eio` with reason "unknown handler".

### 2. Multiple surfaces sharing the same name

If two live surfaces both have `title = "watcher"`, the resolver returns both. The dispatcher copies the envelope into each surface's inbox and runs each surface's handler chain.

```mermaid
flowchart TB
    S[builder sends to:watcher] --> D{Dispatcher}
    D --> R[Resolver]
    R --> M{name == 'watcher'?}
    M -- match --> W1[surface w1<br/>title=watcher<br/>delivery=stdin]
    M -- match --> W2[surface w2<br/>title=watcher<br/>delivery=stdin,silent]
    W1 --> I1[(w1 inbox)]
    W2 --> I2[(w2 inbox)]
    W1 --> H1[stdin handler]
    W2 --> H2a[stdin handler]
    W2 --> H2b[silent handler]
```

Same-name fan-out is tolerated rather than designed-for. The resolver's doc comment notes "in practice 0 or 1; we tolerate duplicates by returning a list." Use it deliberately if you want broadcast to a named pool, and expect ordering across the recipients to be unspecified.

### Topic fan-out (Stage 3)

`c11 mailbox send --topic ci.status` without `--to` is **rejected at the CLI** with `topics_not_implemented`. A topic-only envelope written via raw file would be accepted by the validator but resolve to zero recipients (the `resolved` log line records an empty list). Always pair `--topic` with `--to <surface>` until Stage 3 wires `mailbox.subscribe` globs into the resolver.

---

## Envelope schema (v1, locked)

| Field          | Type    | Required | Constraint                                                    |
|----------------|---------|----------|---------------------------------------------------------------|
| `version`      | integer | yes      | Must be `1` (literal integer, not string).                    |
| `id`           | string  | yes      | Crockford base32 ULID, 26 chars (no I/L/O/U).                 |
| `from`         | string  | yes      | Sender surface name. Non-empty, ≤ 256 bytes.                  |
| `ts`           | string  | yes      | RFC3339 UTC with `Z` suffix. Sender-attested, NOT ordering.   |
| `body`         | string  | yes      | UTF-8 ≤ 4096 bytes. Must be `""` when `body_ref` is set.      |
| `to`           | string  | one of   | Recipient surface name. ≤ 256 bytes.                          |
| `topic`        | string  | one of   | Dotted token `^[A-Za-z0-9_][A-Za-z0-9_.\-]*$`. ≤ 256 bytes.   |
| `reply_to`     | string  | no       | Surface name to reply to. Non-empty, ≤ 256 bytes.             |
| `in_reply_to`  | string  | no       | ULID of the envelope being replied to.                        |
| `urgent`       | boolean | no       | Sender hint.                                                  |
| `ttl_seconds`  | integer | no       | ≥ 1. Advisory; recipients may drop expired envelopes on read. |
| `body_ref`     | string  | no       | Absolute path (must start with `/`).                          |
| `content_type` | string  | no       | MIME hint, ≤ 128 bytes.                                       |
| `ext`          | object  | no       | Forward-compat escape hatch. Any keys allowed under `ext`.    |

`additionalProperties: false` at the top level. Any unknown key triggers `unknownTopLevelKey` rejection. Use `ext` for forward-compat experimentation.

---

## Dispatch log: `_dispatch.log`

Newline-delimited JSON, one event per line, append-only. Every event carries an ISO8601 UTC `ts` (with fractional seconds) plus the fields listed below.

| Event       | Fields                                                              |
|-------------|---------------------------------------------------------------------|
| `received`  | `id`, `from`, `to?`, `topic?`                                       |
| `resolved`  | `id`, `recipients[]` (surface names; can be empty)                  |
| `copied`    | `id`, `recipient`                                                   |
| `handler`   | `id`, `recipient`, `handler`, `outcome`, `bytes?`, `elapsed_ms?`    |
| `rejected`  | `id?`, `reason`                                                     |
| `cleaned`   | `id`                                                                |
| `gc`        | `temp_files_removed`                                                |
| `replayed`  | `id` (declared in the event enum; not emitted in Stage 2)           |

Handler outcomes: `ok`, `timeout`, `eio`, `closed`, plus the C11-144 stdin delivery-safety lifecycle `buffered`, `flushed`, `expired`, `evicted` (all emitted as `handler` events with `handler = "stdin"`, so a buffered message's full path is traceable). (`epipe` was declared in early drafts and removed in P0 #6 because nothing emits it.) `timeout` is a reporting bound, not a runtime cancellation: the dispatcher logs after 2 s and moves on, but the handler closure may still be running.

| stdin outcome | Meaning |
|---------------|---------|
| `buffered`    | recipient shell was busy; block queued to flush at the next prompt |
| `flushed`     | a previously-buffered block was injected once the shell went idle |
| `expired`     | a buffered block aged past the freshness window; dropped (inbox floor holds it) |
| `evicted`     | a buffered block dropped because the per-surface cap was exceeded (inbox floor holds it) |

```bash
c11 mailbox tail                              # follow log as it grows
c11 mailbox trace 01K3A2B7X8PQRTVWYZ0123456J  # filter for one envelope id
```

---

## Patterns

### Request / reply

```bash
# builder
REQ_ID=$(c11 mailbox send --to reviewer --body "review sha=abc")

# reviewer (after work)
c11 mailbox send --to builder --in-reply-to "$REQ_ID" --body "lgtm"
```

Setting `--reply-to` is only necessary when the reply should land somewhere other than the original sender's surface.

### Durable handoff

A surface that may not exist yet still gets its inbox created on first delivery. Send to `archivist`; when an archivist surface is later created with `title = archivist`, it can drain the queued envelopes:

```bash
c11 mailbox recv --drain
```

Inboxes survive c11 restarts; envelopes sitting in the outbox at restart are picked up by the dispatcher's initial scan.

### Fire-and-forget notification

Set the recipient's `mailbox.delivery` to `silent` if you want a logged delivery without PTY noise. The envelope is copied to the inbox and the silent handler logs `ok`. Useful for status broadcasts where the recipient polls or analyzes asynchronously.

### Larger payloads

Inline `body` is capped at 4096 bytes. For bigger content, write the bytes elsewhere and reference them:

```bash
c11 mailbox send --to reviewer --body-ref /tmp/diff.patch --body ""
```

The dispatcher stores `body_ref` on the envelope and routes normally. Reading the external body is the recipient's responsibility in Stage 2; nothing dereferences it for you.

---

## Anti-patterns

- **Tight loops over the mailbox.** It is at-least-once with fsevent latency and a 2 s outer handler timeout. Use it for coordination, not for hot RPC.
- **Assuming order across senders.** `ts` is sender-attested, not an ordering field. Lexicographic ULID order roughly tracks per-sender wall clock, but two senders racing the outbox can interleave arbitrarily.
- **Putting huge payloads inline.** Anything past 4096 UTF-8 bytes is rejected at the CLI (and would be rejected by the validator). Use `body_ref` and let the recipient open the file.
- **Sending topic-only envelopes via raw file.** They will be accepted by the validator and silently resolve to zero recipients. The CLI rejects this for you; the raw path does not.
- **Editing files in `_processing/` or `_rejected/`.** The dispatcher owns those directories. `_processing/` is mid-flight scratch; `_rejected/` is forensic state plus a `.err` sidecar.
- **Treating absent `mailbox.delivery` as "no message".** If the recipient never set `mailbox.delivery`, envelopes still land in their inbox. They just do not get pushed into the PTY. Drain explicitly or set `mailbox.delivery=stdin`.

---

## Debug & introspect

```bash
c11 mailbox outbox-dir                         # absolute path of caller's outbox
c11 mailbox inbox-dir                          # absolute path of caller's inbox
c11 mailbox inbox-dir --surface watcher        # someone else's inbox
c11 mailbox surface-name                       # caller's resolved title
c11 mailbox new-id                             # fresh ULID for raw-file writers
c11 mailbox tail                               # follow _dispatch.log
c11 mailbox trace <id>                         # all log lines for <id>, across every workspace
ls "$(c11 mailbox outbox-dir)/../_rejected"    # what bounced and why
```

A rejected envelope leaves both `<id>.msg` and `<id>.err` in `_rejected/`. The `.err` file is the validator's error description (`unknown top-level key 'foo'`, `body too large`, etc.). Schema rules live in `Sources/Mailbox/MailboxEnvelope.swift` and the matching JSON Schema at `spec/mailbox-envelope.v1.schema.json`.

---

## Stage 2 limits and the Stage 3 roadmap

What does not work yet (and how the system fails when you try):

| Limitation                              | What you see today                                                       |
|-----------------------------------------|--------------------------------------------------------------------------|
| Topic subscribe / fan-out               | CLI rejects `--topic` without `--to`. Raw-file topic-only resolves to 0. |
| `c11 mailbox watch` handler             | CLI throws "watch not implemented in Stage 2; use tail."                 |
| `_processing/` crash recovery           | Envelopes stranded mid-dispatch by a c11 crash stay in `_processing/`.   |
| Per-surface inbox caps                  | None. A slow drainer can accumulate envelopes without limit.             |
| `body_ref` read-through                 | Schema accepts it, dispatcher stores it; recipient must read the file.   |
| Real PTY write-error propagation        | `stdin` handler returns `ok` whenever `sendText` returns. EIO not surfaced.|
| `c11 mailbox configure` convenience     | Use `c11 set-metadata mailbox.delivery stdin` directly.                  |

What is steady-state durable today:

- Envelopes sitting in `_outbox/` when c11 restarts are picked up by the dispatcher's initial scan.
- The atomic `.tmp → .msg` rename means a writer crash leaves a dot-prefixed temp file that the GC sweep deletes 5 minutes later.
- Inbox copies are atomic writes; a dispatcher crash mid-copy leaves either nothing or the full file.

## Internals: full send sequence

For maintainers and people debugging a stuck envelope. Not needed to use the mailbox — the three-box diagram in [Send flow](#send-flow) is the user contract.

```mermaid
sequenceDiagram
    autonumber
    participant Sender as Sender agent
    participant CLI as c11 mailbox send
    participant FS as _outbox/
    participant W as Outbox watcher
    participant D as Dispatcher
    participant Proc as _processing/
    participant V as Envelope validator
    participant Res as Surface resolver
    participant Inbox as recipient inbox
    participant H as Handlers (stdin/silent)
    participant Log as _dispatch.log

    Sender->>CLI: --to watcher --body "..."
    CLI->>CLI: resolve caller via CMUX_SURFACE_ID + surface.get_metadata
    CLI->>CLI: build + validate envelope (schema v1)
    CLI->>FS: write .ULID.tmp, then rename to ULID.msg (atomic)
    FS-->>W: fsevent (or initial scan on dispatcher start)
    W->>D: new .msg URL
    D->>Proc: atomic move .msg -> _processing/
    D->>V: validate bytes
    alt valid
        V-->>D: envelope
        D->>Log: received {id, from, to, topic}
        D->>Res: surfacesWithMailboxMetadata()
        Res-->>D: list of live surfaces filtered by name == to
        D->>Log: resolved {id, recipients[]}
        loop per recipient
            D->>Inbox: atomic write envelope copy
            D->>Log: copied {id, recipient}
        end
        loop per recipient, per handler in mailbox.delivery
            D->>H: invoke (2 s outer timeout)
            H-->>D: ok | timeout | closed | eio
            D->>Log: handler {id, recipient, handler, outcome, bytes?, elapsed_ms?}
        end
        D->>Proc: remove .msg
        D->>Log: cleaned {id}
    else invalid
        D->>FS: move to _rejected/<id>.msg + write .err sidecar
        D->>Log: rejected {id?, reason}
    end
```

`Envelope validator` and `Surface resolver` are methods on the dispatcher, drawn here as separate participants for clarity. `_dispatch.log` is a side effect of every state transition rather than a true peer. `_processing/` is the dispatcher's claim zone — file moves here while in flight, removed on success, currently leaks on c11 crash (Stage 3 ships the recovery sweep).

# Agent-Browser Port Spec

Last updated: February 13, 2026  
Source inventory snapshot: `vercel-labs/agent-browser` @ `03a8cb9`

This document tracks implemented behavior and remaining parity gaps for the cmux browser port.

## Goals

1. Provide an LLM-friendly browser automation API in cmux with stable handles.
2. Keep v1 CLI/socket behavior working while v2 reaches full parity.
3. Port `agent-browser` command surface (where meaningful for `WKWebView`).
4. Ensure move/reorder operations preserve `surface_id` identity.
5. Rebuild/port tests so both v1 and v2 suites pass before deprecating v1.

## Concepts (Canonical Terms)

1. `window`: native macOS window.
2. `workspace`: sidebar entry within a window (often called "tab" in UI).
3. `pane`: split region inside a workspace.
4. `surface`: tab within a pane (terminal or browser). This is the primary automation target.
5. `panel`: internal implementation term; CLI/API should prefer `surface`.

Terminology decision:
- Public v2 API and new CLI docs should standardize on `surface` and `pane`.
- Keep `--panel` as compatibility alias in CLI until v1 is retired.

## Self-Identify Requirement

`system.identify` is the canonical "where am I?" call for agents and should remain first-class.

Required response fields for agent workflows:
1. `focused.window_id`
2. `focused.workspace_id`
3. `focused.pane_id`
4. `focused.surface_id`
5. `caller` validation result when caller context is supplied

Recommended extension for browser workflows:
1. `focused.surface_type`
2. `focused.browser.url`
3. `focused.browser.title`
4. `focused.browser.loading`

Required capabilities:
1. reorder surfaces within a pane
2. move surfaces between panes in same workspace
3. move surfaces across workspaces
4. move surfaces across windows
5. reorder workspaces within window

Proposed methods:
1. `surface.move` with `surface_id` + destination (`pane_id` or `workspace_id`/`window_id`) + placement (`before_surface_id|after_surface_id|start|end`)
2. `surface.reorder` with `surface_id` + sibling anchor (`before_surface_id|after_surface_id`)
3. `workspace.reorder` with `workspace_id` + anchor (`before_workspace_id|after_workspace_id`)

Hard invariant:
1. `surface_id` must remain unchanged after all move/reorder operations.

## Decision Log (Locked - February 12, 2026)

1. `cmux browser tab ...` maps to browser `surface` tabs only (no separate workspace-level tab meaning inside `browser` namespace).
2. Default browser placement without explicit target is caller-relative: reuse the nearest right sibling pane; if none exists, split right from the caller pane.
3. Deeply nested layouts use local split ancestry: choose the nearest right sibling leaf in the caller's subtree path and avoid reshuffling unrelated panes.
4. Network parity target is full parity (not block-only phase).
5. Output shape is cmux-native overall, but `browser.snapshot` and selector `not_found` diagnostics intentionally mirror agent-browser semantics for agent usability.
6. ID model accepts UUIDs and short refs.
7. Short ref format uses full words and colon: `surface:N`, `pane:N`, `workspace:N`, `window:N`.
8. Short refs are global per daemon, monotonic, and never reused until daemon restart.
9. Plain-text CLI output defaults to short refs.
10. JSON output defaults to short refs (UUIDs available via `--id-format uuids|both`).
11. CLI supports `--id-format refs|uuids|both` for output shaping.
12. Browser create/move commands should expose enough placement/result metadata for agents to make deterministic follow-up decisions.
13. Reuse behavior is implicit by default (caller-relative right-pane reuse); explicit handles can still force deterministic targeting.
14. `browser fill` accepts empty text and treats it as a clear operation.
15. Mutating browser actions can opt into post-action verification snapshots via `snapshot_after` (`--snapshot-after` in CLI), returning `post_action_snapshot` (+ refs/title/url).

# C11-184 — Flagged and suppressed agents: executable implementation plan

## Goal and binding inputs

Ship two orthogonal, persisted modifiers over the existing four-state agent lifecycle:

- `flag`: a required one-line reason declaring that human action is needed.
- `suppressed`: an operator/agent choice that removes routine attention signalling while preserving notification history.

The implementation is governed by:

1. `docs/c11-flagged-agent-plan.md` (binding feature spec).
2. `docs/c11-attention-model-skill-section.md` (exact staged skill copy).
3. `docs/c11-mark-vocabulary.md` and shipped dependency C11-183 at `29102376f`.
4. The repository `AGENTS.md` threading, localization, testing, tagged-build, skill-sync, and submodule rules.

Base gate: implementation must start from `09782511b` (or a descendant containing `29102376f`). Do not rebuild or redesign the C11-183 lifecycle vocabulary.

## Decisions from the seam audit

The spec wins where the current base is only forward scaffolding:

- C11-183 already added `flagged` / `suppressed` fields and a `presentedState` projection to `WorkspacePulseAgent`, plus partial flagged drawing in the sidebar renderer. Those fields are not wired to metadata.
- The shipped sidebar mark currently animates flagged working with the normal stepped fill and leaves flagged idle/cold static. The binding spec instead requires **breathe for every flagged non-waiting state** and the core-only 0.4 s violet/white square wave for flagged waiting. Replace the scaffolding behavior.
- The shipped Bonsplit mark supports host-injected color/motion internally, but a tab carries only `activityState`; c11 cannot yet send a per-surface modifier, violet tint, alarm alternate color, or explicit flag motion to the surface-tab renderer. Extend the generic Bonsplit host-presentation seam rather than adding c11-specific `flagged` semantics to Bonsplit.
- `WorkspaceContentView` currently folds Static marks, Reduce Motion, app/workspace activity into one Bonsplit animation permission. That cannot express “Static marks disables base motion, but flag motion still runs; Reduce Motion disables both.” Split the generic host policy into base-motion and explicit/attention-motion eligibility.
- `TerminalNotificationStore` has only raw unread indexes, emits `waiting.entered` from raw per-tab counts, and decides external delivery without consulting attention metadata. It needs distinct raw-history and signal-eligible indexes.
- `SurfaceMetadataStore` has no typed attention snapshot or enumeration by flag age. Oldest-first `flag.list` and the flag phase of Option-V need a bounded typed index/query using the metadata source timestamp as the raise time.
- The spec’s “true state” wording means the raw derived lifecycle remains available internally, while every human-facing projection for an unflagged suppressed surface presents waiting as idle. A suppressed+flagged surface exposes the true lifecycle and the flag wins.
- The current Waiting Agent footer is app/window-global through the shared notification store. The Flagged Agents row follows that existing scope; this does not add the explicitly out-of-scope cross-workspace dashboard/aggregation surface.

## Architecture and data flow

### Canonical truth and typed projection

Add canonical metadata keys:

- `MetadataKey.flag = "flag"`: non-empty, trimmed, single-line string; cap at 256 characters.
- `MetadataKey.suppressed = "suppressed"`: strict JSON Boolean.

Both are written at `.explicit`, survive the existing session snapshot/autosave path, and remain visible through `get-metadata`. `flag` absence means lowered. `suppressed == true` means suppressed; absent/false means ordinary.

Build one typed attention seam (new `Sources/AttentionModel.swift`, or an equivalently isolated file if review finds a better existing home):

- `SurfaceAttentionSnapshot`: workspace id, surface id, optional flag reason, flag raise timestamp, suppressed Boolean.
- Pure presentation reducer:
  - raw `waiting` + suppressed + not flagged -> presented `idle`;
  - otherwise raw lifecycle is unchanged;
  - flag color/motion overrides suppression;
  - suppression never deletes raw notification history.
- A main-actor observable index/coordinator that mirrors the canonical store for active surfaces, provides `flaggedCount`, oldest-first active flags, signal eligibility, and per-surface snapshots.
- One serialized `SurfaceAttentionService` (name may vary, responsibility may not) owns the complete commit boundary: canonical metadata write/clear, original active-epoch timestamp, typed projection/index refresh, signal-index refresh, event emission, and optional direct system delivery. A mutating socket response is sent only after that whole commit is observable. Do not make `TabItemView` or a keystroke path query the metadata store.
- The generic `surface.set_metadata` / `surface.clear_metadata` routes may not bypass that boundary. Route writes, keyed clears, replace/clear-all operations touching `flag` or `suppressed` through the service (or reject those keys there with a precise protocol error and require the flag family). Snapshot restore, launch stamping, detach/transfer, close, and prune also enter through explicit service hooks. Add adversarial coverage for every bypass.
- Metadata remains authoritative; the observable index is a bounded render/query cache, not a second persistence system.

Mutation semantics:

1. `raise(reason)` validates before mutation, writes the canonical reason, records/reuses the original active-epoch timestamp, publishes the active flag, emits `flag.raised {reason}`, refreshes render/signal projections, then delivers the separate direct flag system notification even when the surface is suppressed. This one direct-delivery branch is the operator's Phase 3 decision; routine waiting-derived delivery remains suppressed independently. An active-to-active reason revision preserves that original timestamp, emits one new `flag.raised` event and one updated direct notification, but never creates a second queue entry. Only an explicit lower followed by a new raise starts a new epoch and moves the flag to the back.
2. `lower(by)` clears `flag`, publishes the transition, emits `flag.lowered {by}`, and never marks notification history read.
3. `suppress(by)` writes `true`, refreshes signal eligibility immediately (including an already-unread notification), emits `flag.suppressed {by}`, and cancels/removes any pending routine external notification for that surface without deleting its in-app record.
4. `unsuppress(by)` clears or writes false consistently, refreshes signal eligibility immediately, and emits `flag.unsuppressed {by}`. An existing unread record becomes signal-eligible again and may create the correct 0->1 waiting edge; it does not manufacture a second record.
5. Repeating an identical mutation is idempotent: no duplicate event, system notification, queue-age reset, or revision churn. Relaunch/restore preserves the active epoch for both identical and revised reasons.

The `by` vocabulary is exactly `operator | agent`. Banner dismissal is always `operator`; agent CLI lower/suppress/unsuppress defaults to `agent`, with an explicit socket field for trusted operator-originated actions. Launch-time modifiers are operator-originated.

### Attention signalling versus notification history

Refactor `TerminalNotificationStore.NotificationIndexes` to retain both views:

- Raw unread/history indexes: every unread record, including suppressed surfaces.
- Signal-eligible unread indexes: surface-less notifications plus surface notifications for which `!(suppressed && !flagged)`.

Use signal-eligible indexes for:

- Waiting Agent badge/count and lit state.
- Workspace waiting demand and exact-surface waiting projection.
- `waiting.entered` / `waiting.left` 0<->1 edges.
- Option-V waiting fallback.
- menu-bar/unread affordances that would otherwise leak a suppressed completion as a signal.

Keep raw indexes for the notifications list/history and explicit reads. The list must still show the suppressed notification record and permit marking/removing it.

At `addNotification`:

- Always create/update the in-app record.
- Always settle liveness to idle as today.
- Do not deliver the normal system notification when the target surface is suppressed, regardless of flag state; the feature spec explicitly says suppressed surfaces deliver no system notification.
- A raised flag’s system notification is a separate direct delivery path and never inserts a `TerminalNotification`.

When attention metadata changes while notifications already exist, rebuild only signal eligibility and emit the real edge transition. Avoid rewriting `notifications` merely to force `didSet`.

### Lifecycle and rendering

Extend `SurfaceTabActivityResolver` (or introduce a sibling pure reducer) to consume the typed attention snapshot:

- Agent, no exact unread: `working` / `idle` / `cold` as today.
- Exact unread, ordinary: `waiting`.
- Exact unread, suppressed and unflagged: `idle`.
- Exact unread, suppressed and flagged: `waiting`.

Populate `WorkspacePulseAgent.flagged` and `.suppressed` from the precomputed attention snapshot in the parent sidebar census. Add `WorkspacePulseSummary.flaggedCount`; dominant attention precedence is flagged > waiting > working > idle > cold without adding a `WorkspacePulseState` case. Counts and row ordering use `presentedState`.

For the two mark renderers:

- Lifecycle stays encoded by the C11-183 shape.
- Flag applies flat violet (`#9D8AD9` starting value, dialled in the tagged build).
- Suppression has no tint, dim, badge, or label.
- Unflagged suppressed working is a static full grid.
- Flagged waiting: steady violet frame; 4 pt core alternates violet/white on a hard 0.4 s square wave; no base dip or breathe.
- Flagged working/idle/cold: whole-mark slow opacity breathe; no stepped fill/dip concurrently.
- Reduce Motion renders every combination statically.
- Static marks disables only base stepped fill/dip. It does not disable flag breathe/flash.
- All motion is leaf-isolated, opacity/color only, uses the one shared clock and stable surface-id phase offset, and unsubscribes off-screen, in collapsed/unselected workspaces, or while the app is inactive.

Keep Bonsplit generic:

- Add a public, optional per-tab activity-presentation value (color override, explicit motion channel, alternate core color), or equivalent generic host-injection fields.
- Add a generic `breathe` motion sampler/channel.
- Separate generic base-motion permission from explicit-motion permission so c11 can apply Static marks and Reduce Motion correctly.
- Carry the optional presentation through `Tab`, `TabItem`, controller create/update, transfer, and decode-with-default paths.
- Do not name flag/suppression in Bonsplit public types. This extension is a reasonable upstream candidate because it is generic host-controlled mark presentation; flag it in the PR rather than opening an upstream PR during this task.

### Flag navigation

Extract a pure attention-jump selector:

1. Active flags ordered by original raise timestamp ascending (oldest first), stable tie-break by workspace/surface UUID.
2. Skip stale/unopenable surfaces and try the next flag.
3. If no flag opens, choose the latest signal-eligible unread notification (existing newest-first stack behavior).

`jumpToLatestUnread()` may be renamed internally to reflect the broader semantics, but all existing call sites and the Option-V binding stay one action. The Flagged Agents row invokes this exact selector. Opening a flagged surface passes no notification id and does not lower the flag. The banner X/agent command is the only lower path.

### In-surface banner and system notification

Mount a distinct `NSHostingView<SurfaceFlagBanner>` from `GhosttySurfaceScrollView`, following the existing `SurfaceSearchOverlay` ownership and z-order pattern:

- top edge, below the surface title bar, floating over terminal pixels;
- no layout participation and therefore no PTY resize;
- flag glyph, single-line/truncated reason, localized accessibility label/help, localized dismiss control;
- X calls `lower(by: .operator)` and restores terminal focus without synthesizing terminal input;
- update/remove the host only on attention transitions; do not touch `TerminalSurface.forceRefresh()` or `WindowTerminalHostView.hitTest()`.

Define z-order explicitly against find, pane-interaction, keyboard-copy, notification-ring, and flash overlays so both the banner and find field remain operable.

Use the existing notification authorization/sound/custom-command machinery for direct flag delivery:

- title = current surface title/fallback;
- body = flag reason;
- `userInfo` contains workspace/surface ids so click focuses the surface;
- no `TerminalNotificationStore` record and no waiting count;
- one explicit direct-delivery branch where flag raise pierces suppression; routine
  notification-store delivery remains suppressed independently;
- repeated identical raise is not redelivered.

- Metadata:
  - valid reason/Boolean accepted at explicit tier;
  - blank, whitespace-only, multiline, non-string, over-cap reason rejected atomically;
  - non-Boolean suppression rejected;
  - restore preserves reason, suppression, source, and original raise timestamp;
  - repeated identical raise preserves queue age/revision.
- Modifier reducer:
  - every lifecycle × flag × suppression combination;

  - idempotent calls produce no duplicate event.

  - suppressed unread remains in raw list and can be read/removed;

  - unsuppressing an unread surface emits the correct waiting-entered edge;

  - oldest flag wins over newer flag and every unread;
  - stale/unopenable flag is skipped;
  - no flag falls back to latest signal-eligible unread;
  - suppressed unread is skipped;
  - opening a flag neither lowers it nor marks unrelated history read.

  - missing reason -> `invalid_params`;
  - missing/empty surface ref rejected;
  - `--flag` + `--suppressed` accepted together and stamped before command delivery;
  - `flag.list` is deterministic oldest-first and contains refs/reason/timestamp/suppression;
  - mutators do not focus/raise the app.
- Rendering policy:
  - flagged working/idle/cold select breathe;
  - flagged waiting selects binary flash only;
  - Static marks disables base motion only;
  - Reduce Motion disables all;
  - suppressed unflagged working is static;
  - hidden/background marks unsubscribe from the single clock.

- **Raw/signal index drift:** one pure index builder with explicit eligibility input; transition tests for suppress/unsuppress over existing unread records.

# c11 Markdown Surfaces

Use this skill to display markdown files in a c11 markdown surface — a first-class surface type that lives alongside terminal and browser surfaces in the same workspace, driven from the same `c11` CLI. The binary is `c11`.

Rich rendering (headings, code blocks, tables, lists, Mermaid) with live file watching — the panel auto-updates when the file changes on disk.

## Core Workflow

1. Write your plan or notes to a `.md` file.
2. Open it in a markdown panel.
3. The panel auto-updates when the file changes on disk.

```bash
# Open a markdown file as a split panel next to the current terminal
c11 markdown open plan.md

# Absolute path
c11 markdown open /path/to/PLAN.md

# Target a specific workspace
c11 markdown open design.md --workspace workspace:2
```

## When to Use

- Displaying an agent plan or task list alongside the terminal
- Showing documentation, changelogs, or READMEs while working
- Reviewing notes that update in real-time (e.g., a plan file being written by another process)

## Producing artifacts the operator will return to

When you are creating **more than one** markdown artifact across a session — a map, a proposal, an audit, a status report — present them as **one navigable surface**, not multiple disconnected top-level tabs. The hyperengineer is already running many agents in many tabs; your session should not become another navigation problem for them to solve when they come back from lunch.

Two patterns, in priority order:

### Default: one consolidated file with sections

Write to a single `/tmp/<task>-trail.md` and append as the work progresses. The operator scrolls one document instead of switching tabs; the most current section sits on top so it is what they see first when they tab over.

```bash
# At the start of a multi-artifact piece of work, open the trail file once
c11 new-pane --type markdown --file /tmp/voice-trail.md
# → OK surface:35 pane:9 workspace:1

# Then write to that file as the work evolves — live-reload renders it.
# When new sections supersede earlier ones, put the new section at the top
# so the operator's first read is current truth, not stale context.
```

This is the right default unless the operator explicitly asks for separate files.

### When you need multiple distinct files: tabs of the *same* pane

If the artifacts genuinely need to be separate files (different audiences, different lifetimes, downstream tooling reads them as units), add the second and subsequent ones as **tabs of the existing markdown pane**, not as new top-level panes:

```bash
# Capture the pane ref from the first open
c11 new-pane --type markdown --file /tmp/voice-map.md
# → OK surface:35 pane:9 workspace:1

# Add subsequent files as tabs of pane:9 — NOT new top-level tabs
c11 new-surface --type markdown --file /tmp/voice-wave-1.md --pane pane:9
c11 new-surface --type markdown --file /tmp/voice-audit.md --pane pane:9
```

The operator sees one markdown pane in the sidebar; the artifacts navigate as tabs of that pane. This is materially different from three `c11 new-pane` calls, which produce three sibling top-level tabs the operator has to context-switch between.

### Always: title + description per surface

Whether it is one consolidated file or a tabbed pane, set `c11 set-title` and `c11 set-description` on every markdown surface immediately after opening it. The operator should know what they are looking at without opening it. See the top-level c11 skill's "Title and description" section for the conventions.

### Close stale artifacts at session-end

If an early-session map document is superseded by a final audit, close the early surface (`c11 close-surface --surface <ref>`) so the operator's primary view shows the current truth. Leaving five surfaces open across a session because they were once useful is unkind to the next look.

## Live File Watching

The panel automatically re-renders when the file changes on disk. This works with:

- Direct writes (`echo "..." >> plan.md`)
- Editor saves (vim, nano, VS Code)
- Atomic file replacement (write to temp, rename over original)
- Agent-generated plan files that are updated progressively

If the file is deleted, the panel shows a "file unavailable" state. During atomic replace, the panel attempts automatic reconnection within its short retry window. If the file returns later, close and reopen the panel.

## Agent Integration

### Opening a plan file

Write your plan to a file, then open it:

```bash
cat > plan.md << 'EOF'
# Task Plan

## Steps
1. Analyze the codebase
2. Implement the feature
3. Write tests
4. Verify the build
EOF

c11 markdown open plan.md
```

### Updating a plan in real-time

The panel live-reloads, so simply overwrite the file as work progresses:

```bash
# The markdown panel updates automatically when the file changes
echo "## Step 1: Complete" >> plan.md
```

### Recommended AGENTS.md instruction

Add this to your project's `AGENTS.md` to instruct coding agents to use the markdown viewer:

```markdown
## Plan Display

When creating a plan or task list, write it to a `.md` file and open it in c11:

    c11 markdown open plan.md

The panel renders markdown with rich formatting and auto-updates when the file changes.
```

## Routing

```bash
# Open in the caller's workspace (default — uses C11_WORKSPACE_ID)
c11 markdown open plan.md

# Open in a specific workspace
c11 markdown open plan.md --workspace workspace:2

# Open splitting from a specific surface
c11 markdown open plan.md --surface surface:5

# Open in a specific window
c11 markdown open plan.md --window window:1
```

| Reference | When to Use |
|-----------|-------------|
| [references/commands.md](references/commands.md) | Full command syntax and options |
| [references/live-reload.md](references/live-reload.md) | File watching behavior, atomic writes, edge cases |

## Rendering Support

The markdown panel renders:

- Headings (h1-h6) with dividers on h1/h2
- Fenced code blocks with monospaced font
- Inline code with highlighted background
- Tables with alternating row colors
- Ordered and unordered lists (nested)
- Blockquotes with left border
- Bold, italic, strikethrough
- Links (clickable)
- Horizontal rules
- Images (inline)

Supports both light and dark mode.

# c11 pitfalls — reader specimen

The fixtures carry no GitHub callouts and no footnotes, so this page assembles real rules from c11's `CLAUDE.md` into the shapes the renderer has to handle: all five callout kinds, footnotes, a task list, a table, a small diagram.

## Screen lock blocks terminal creation

> [!WARNING]
> No c11 on this machine can open a terminal while the Mac's screen is locked. Every new terminal surface stays unattached, and the ghostty log shows `embedded_window: error initializing surface err=error.OutOfMemory`.

RAM, file descriptors, process and thread counts, Metal, and IOSurface all look healthy from a shell, so do not spend time ruling them out.[^lock] With the screen locked, WindowServer refuses the GPU-backed surface the renderer needs and ghostty reports the refusal as an allocation failure.

> [!TIP]
> Unlock the screen. Surface creation resumes at once and queued `send` payloads flush on attach. If a delegator's tagged-build validation hits this, park it and ask the operator to unlock.

## Modals on agent-reachable paths

`NSAlert.runModal()` spins a nested run loop on main and blocks every terminal, pane, and agent until a human dismisses it. Socket commands run their work through `v2MainSync`, so the modal loop ends up inside a `DispatchQueue.main.sync`.[^modal]

> [!CAUTION]
> A `runModal()` on any path an agent can reach wedges the whole app. The browser insecure-HTTP prompt once held main for up to 6.8 hours.

> [!NOTE]
> It is fine for an alert the operator just triggered from a menu or button. For browser modals use `browserPresentModalAlert` in `Sources/Panels/BrowserPanel.swift`, which sheets onto a usable window and applies a safe default when there is none.

## Long-lived threads drain a pool per iteration

A `Thread`'s root pool only drains when the thread exits, so every autoreleased object its Foundation calls leave behind stays alive until then, and `leaks` won't flag it because the pool still references it all.[^pool]

```swift
while running {
    autoreleasepool {
        let data = try? JSONSerialization.data(withJSONObject: payload)
        handle(data)
    }
}
```

> [!IMPORTANT]
> c11's long-lived threads are the socket accept loop, each per-connection `handleClient` thread, and the hang-monitor watchdog. Any new one needs the same drain.

## One build per machine

| Entry point | Lock | Bypass | Notes |
|---|---|---|---|
| `scripts/reload.sh` | `/tmp/c11-build.lock` via `with-build-lock.sh` | `C11_BUILD_LOCK=0` | Reports the lock owner every 30 s, takes over a lock whose owner died, gives up with exit 75 after 90 minutes. |
| `scripts/test-unit-local.sh` | same | same | Exports a per-PID `C11_SOCKET_PATH` so the XCTest host never binds the operator's socket. |
| bare `xcodebuild` | none | n/a | Never call it bare. Two concurrent builds each spawn a swift-frontend per core and the load average goes into the hundreds. |

  const lines = S.doc.src.split("\n"); const nx = sectionEnd(i);
  let at = nx ? nx.line - 1 : lines.length; while (at > h.line && !lines[at - 1].trim()) at--;
  const stamp = new Date().toTimeString().slice(0, 5);
  const add = ["", `*${S.doc.writer}, ${stamp}: appended to “${h.text}”.*`];
  const a = captureAnchor(); if (a && !a.atTop && a.line > at) a.line += add.length;
  lines.splice(at, 0, ...add); S.doc.src = lines.join("\n");
  await renderDoc({ anchor: a });
  log(`printf '…' >> ${S.doc.path.split("/").pop()}`, `file changed · live reload held ${T()} at line ${visibleInfo().lines.first}`, "ok");
}
