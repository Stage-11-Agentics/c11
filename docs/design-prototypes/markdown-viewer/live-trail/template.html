<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>c11 markdown · live-trail (prototype)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@4.0.0/dist/markdown-it-footnote.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<style>
/* ════ tokens ═══════════════════════════════════════════════════════
   chrome = c11 void language (docs/design-prototypes/c11-reskin).
   prose  = IBM Plex Sans; chrome + code = JetBrains Mono.
   gold is the change signal: an unseen write. nothing else is gold
   inside the surface except the focused-pane ring and agent notes.  */
:root, :root[data-theme="dark"] {
  --void:#050505; --chrome:#0a0a0a; --chrome2:#1f1f22; --chrome3:#2d2d32;
  --rule:#333333; --rule-soft:rgba(232,232,232,.075); --tab-active:#232327;
  --ink:#e8e8e8; --ink-2:rgba(232,232,232,.78); --ink-3:rgba(232,232,232,.6); --ink-4:rgba(232,232,232,.4);
  --paper:#0e0f11; --prose:#d9d9d5; --prose-2:rgba(217,217,213,.68); --head:#f3f3f0;
  --code-bg:#131518; --code-rule:#25272c; --icode:#1a1c20;
  --gold:#c9a84c; --gold-ink:#d9bb63; --gold-faint:rgba(201,168,76,.24); --gold-ghost:rgba(201,168,76,.09);
  --add-bg:rgba(111,174,138,.10); --add-rule:#6fae8a; --del-bg:rgba(214,120,110,.10); --del-ink:#e0948b; --ins-bg:rgba(111,174,138,.24);
  --run:#79AEE8; --idle:#78B59E; --seen:#7a7e88;
  --thead:#15171a; --shadow:0 10px 30px rgba(0,0,0,.55);
  --k-key:#b9a7e6; --k-str:#a3cc9c; --k-num:#e3b67c; --k-com:rgba(232,232,232,.38); --k-fn:#8fbbea; --k-attr:#d8bb7e; --k-bi:#82c6c4; --k-meta:#8a93a3;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --void:#e4e2dc; --chrome:#f3f2ed; --chrome2:#e7e5de; --chrome3:#d9d6cd;
  --rule:#cfccc2; --rule-soft:rgba(20,20,20,.08); --tab-active:#fbfaf6;
  --ink:#16171a; --ink-2:rgba(22,23,26,.8); --ink-3:rgba(22,23,26,.62); --ink-4:rgba(22,23,26,.42);
  --paper:#fbfaf6; --prose:#24262b; --prose-2:rgba(36,38,43,.66); --head:#0f1013;
  --code-bg:#f2f0e9; --code-rule:#e0ddd3; --icode:#eeebe3;
  --gold:#9b7920; --gold-ink:#84661a; --gold-faint:rgba(155,121,32,.26); --gold-ghost:rgba(155,121,32,.085);
  --add-bg:rgba(46,125,82,.085); --add-rule:#3d8a5f; --del-bg:rgba(176,64,52,.075); --del-ink:#a4443a; --ins-bg:rgba(46,125,82,.17);
  --run:#2f6fb5; --idle:#3f8a6c; --seen:#a19f95;
  --thead:#f0eee7; --shadow:0 10px 26px rgba(50,42,20,.16);
  --k-key:#6a4cb3; --k-str:#3b7638; --k-num:#9a5a10; --k-com:rgba(22,23,26,.45); --k-fn:#2a5ca6; --k-attr:#86621a; --k-bi:#1d7473; --k-meta:#6b7280;
  color-scheme:light;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:var(--void); color:var(--ink); font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  font-size:12px; font-weight:400; display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.tnum { font-variant-numeric:tabular-nums; }

/* ════ prototype chrome (outside the c11 frame) ═════════════════════ */
#proto { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:9px 16px;
  border-bottom:1px dashed var(--gold-faint); background:var(--void); font-size:11px; color:var(--ink-3); }
.badge { color:var(--gold); border:1px solid var(--gold-faint); border-radius:4px; padding:3px 9px;
  letter-spacing:.14em; font-size:10px; font-weight:500; }
.ptitle { color:var(--ink-2); letter-spacing:.02em; }
.pgroup { display:flex; align-items:center; gap:6px; }
.pgroup > label { color:var(--ink-4); }
.seg { display:inline-flex; border:1px solid var(--rule); border-radius:5px; overflow:hidden; }
.seg button { height:22px; padding:0 8px; white-space:nowrap; color:var(--ink-3); text-align:center; }
.seg button + button { border-left:1px solid var(--rule); }
.seg button:hover { color:var(--ink); background:var(--chrome2); }
.seg button.on { color:var(--ink); background:var(--chrome3); }
.pbtn { height:24px; padding:0 9px; white-space:nowrap; border:1px solid var(--rule); border-radius:5px; color:var(--ink-2); }
.pbtn:hover { background:var(--chrome2); color:var(--ink); }
.pbtn:active { background:var(--chrome3); }
select.psel { font:inherit; color:var(--ink-2); background:var(--chrome); border:1px solid var(--rule); border-radius:5px; height:24px; padding:0 6px; }
#simclock { color:var(--ink-4); width:21ch; }

#stage { flex:1; min-height:0; display:flex; justify-content:center; gap:16px; padding:16px; position:relative; }

/* ════ c11 frame ═══════════════════════════════════════════════════ */
.frame { --w:820px; width:var(--w); flex:none; height:100%; display:flex; flex-direction:column; background:var(--chrome);
  border:1px solid var(--rule); border-radius:8px; overflow:hidden; position:relative; transition:box-shadow .15s; }
.frame.focused { box-shadow:0 0 0 1.5px var(--gold); }
.tabbar { height:40px; flex:none; display:flex; align-items:stretch; border-bottom:1px solid var(--rule); user-select:none; }
.tab { display:flex; align-items:center; gap:8px; padding:0 6px 0 12px; border-right:1px solid rgba(51,51,51,.55);
  font-size:12.5px; color:var(--ink-3); flex:0 1 220px; min-width:0; white-space:nowrap; position:relative; cursor:default; }
.tab.active { flex:0 0 auto; max-width:62%; background:var(--tab-active); color:var(--ink); font-weight:600; }
.tab.active::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--gold); }
.tab .ttl { overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.tab .tx { width:20px; height:20px; display:flex; align-items:center; justify-content:center; color:var(--ink-4); font-size:13px; flex:none; font-weight:400; }
.tab .glyph { color:var(--ink-4); font-weight:400; flex:none; width:12px; text-align:center; }
.tchip { flex:none; min-width:22px; height:17px; padding:0 5px; border-radius:9px; background:var(--gold-faint); color:var(--gold-ink);
  font-size:10.5px; font-weight:500; display:inline-flex; align-items:center; justify-content:center; }
.tchip.zero { visibility:hidden; }
.pmark { flex:none; display:inline-block; }
.pmark.run { width:11px; height:11px; border-radius:50%; border:1.5px solid rgba(121,174,232,.35); border-top-color:var(--run); animation:spin 2.4s linear infinite; }
.pmark.idle { width:9px; height:9px; border-radius:2px; background:var(--idle); opacity:.85; }
@keyframes spin { to { transform:rotate(360deg); } }
.tabbar .spacer { flex:1 1 0; min-width:8px; }
.countcell { flex:none; display:flex; align-items:center; gap:6px; padding:0 12px; color:var(--ink-3); font-size:12px; border-left:1px solid var(--rule); }
.descbar { height:26px; flex:none; display:flex; align-items:center; gap:10px; padding:0 12px; border-bottom:1px solid var(--rule);
  font-size:11.5px; color:var(--ink-3); }
.descbar .desc { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.descbar .desc b { color:var(--ink-2); font-weight:500; }
.descbar .looked { flex:none; width:17ch; text-align:right; color:var(--ink-4); }

.surface { flex:1; min-height:0; display:flex; flex-direction:column; background:var(--paper); container-type:inline-size; }
.strip { height:32px; flex:none; display:flex; align-items:center; gap:10px; padding:0 8px 0 12px; border-bottom:1px solid var(--rule);
  background:var(--chrome); font-size:11px; }
.writer { flex:1; min-width:0; display:flex; align-items:center; gap:8px; color:var(--ink-3); white-space:nowrap; }
.writer .wtext { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.writer .wtext b { color:var(--ink-2); font-weight:500; }
.wdot { flex:none; width:6px; height:6px; border-radius:50%; background:var(--seen); opacity:.6; }
.wdot.writing { background:var(--run); opacity:1; animation:breathe 1.6s ease-in-out infinite; }
.wdot.settled { background:transparent; box-shadow:inset 0 0 0 1px var(--ink-4); }
@keyframes breathe { 50% { opacity:.3; } }
.tools { flex:none; display:flex; align-items:center; gap:6px; }
.tbtn { height:22px; border:1px solid var(--rule); border-radius:5px; color:var(--ink-3); text-align:center; }
.tbtn:hover { color:var(--ink); background:var(--chrome2); }
.tbtn.on { color:var(--ink); background:var(--chrome3); border-color:var(--ink-4); }
#diffBtn { width:44px; } #srcBtn { width:58px; } #findBtn { width:44px; }
#modeSeg button { width:50px; padding:0; }

.viewport { flex:1; min-height:0; position:relative; }
.scroller { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; overflow-anchor:none; scrollbar-width:none; }
.scroller::-webkit-scrollbar { display:none; }
.content { position:relative; padding:0 34px 0 46px; min-height:100%; }
.marks { position:absolute; inset:0; pointer-events:none; z-index:2; }

/* ════ prose ═══════════════════════════════════════════════════════ */
.doc { max-width:74ch; margin:0 auto; padding:26px 0 140px; font-family:"IBM Plex Sans",-apple-system,system-ui,sans-serif;
  font-size:15.5px; line-height:1.62; color:var(--prose); }
.doc > * + * { margin-top:.85em; }
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6 { color:var(--head); font-weight:600; display:flex; align-items:baseline; gap:10px; line-height:1.3; scroll-margin-top:16px; }
.doc h1 { font-size:25px; letter-spacing:-.012em; margin-bottom:.4em; }
.doc h2 { font-size:19.5px; letter-spacing:-.006em; margin-top:2.1em; padding-top:.9em; border-top:1px solid var(--rule-soft); }
.doc h3 { font-size:16.5px; margin-top:1.7em; }
.doc h4 { font-size:15px; margin-top:1.4em; }
.doc h5,.doc h6 { font-size:13px; text-transform:lowercase; letter-spacing:.04em; color:var(--prose-2); }
.htext { flex:1; min-width:0; }
.hanchor { flex:none; font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:400; color:var(--ink-4); text-decoration:none; opacity:0; width:1ch; }
.doc :is(h1,h2,h3,h4,h5,h6):hover .hanchor { opacity:1; }
.fresh { flex:none; width:9ch; text-align:right; font-family:"JetBrains Mono",monospace; font-size:10.5px; font-weight:400;
  color:var(--ink-4); letter-spacing:0; font-variant-numeric:tabular-nums; opacity:.55; transition:opacity .4s, color .4s; }
.fresh.recent { opacity:.95; }
.fresh.hot { color:var(--gold-ink); opacity:1; }
.fresh.calm { opacity:0; }
.doc :is(h2,h3):hover .fresh.calm { opacity:.6; }
.doc p { overflow-wrap:break-word; }
.doc a { color:var(--head); text-decoration:underline; text-decoration-color:var(--ink-4); text-underline-offset:2px; }
.doc a:hover { text-decoration-color:var(--head); }
.doc strong { color:var(--head); font-weight:600; }
.doc code { font-family:"JetBrains Mono",monospace; font-size:.84em; background:var(--icode); border:1px solid var(--rule-soft);
  padding:.08em .38em; border-radius:4px; overflow-wrap:anywhere; }
.doc ul,.doc ol { padding-left:1.45em; }
.doc li + li { margin-top:.3em; }
.doc li > ul,.doc li > ol { margin-top:.3em; }
.doc li::marker { color:var(--ink-4); }
.doc li.task { list-style:none; position:relative; }
.doc li.task > .cb { position:absolute; left:-1.45em; top:.36em; }
.cb { width:13px; height:13px; border-radius:3px; border:1.5px solid var(--ink-4); display:inline-block; transition:background .3s, border-color .3s; }
.cb.done { background:var(--ink-3); border-color:var(--ink-3); background-image:linear-gradient(transparent,transparent);
  -webkit-mask:none; position:relative; }
.cb.done::after { content:""; position:absolute; left:3.2px; top:.6px; width:3.5px; height:7px; border:solid var(--paper); border-width:0 1.8px 1.8px 0; transform:rotate(45deg); }
.doc li.task.done { color:var(--prose-2); }
.doc blockquote { border-left:2px solid var(--rule); padding:.1em 0 .1em 14px; color:var(--prose-2); }
.doc blockquote.callout { border-left-color:var(--ink-3); background:var(--rule-soft); padding:10px 14px; border-radius:0 6px 6px 0; }
.callout-title { display:block; font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.06em; color:var(--ink-2); margin-bottom:4px; }
.doc hr { border:0; border-top:1px solid var(--rule); margin:2em 0; }
.tbl { overflow-x:auto; border:1px solid var(--rule); border-radius:6px; scrollbar-width:thin; }
.tbl table { border-collapse:collapse; font-size:13px; line-height:1.45; min-width:100%; }
.tbl th { background:var(--thead); text-align:left; font-weight:600; color:var(--head); font-size:12.5px; }
.tbl th,.tbl td { padding:7px 11px; vertical-align:top; min-width:10ch; max-width:44ch; border-top:1px solid var(--rule-soft); }
.tbl tr:first-child th { border-top:0; }
.tbl td + td,.tbl th + th { border-left:1px solid var(--rule-soft); }
.code,.mmd,.fm { border:1px solid var(--code-rule); border-radius:6px; background:var(--code-bg); overflow:hidden; }
.blk-head { display:flex; align-items:center; justify-content:space-between; gap:8px; height:26px; padding:0 6px 0 11px;
  border-bottom:1px solid var(--code-rule); font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-4); letter-spacing:.04em; }
.blk-tools { display:flex; gap:4px; }
.mini { width:56px; height:19px; border-radius:4px; color:var(--ink-3); font-size:10.5px; border:1px solid transparent; }
.mini:hover { border-color:var(--rule); color:var(--ink); background:var(--chrome2); }
.code pre { margin:0; padding:11px 14px 12px; overflow-x:auto; font-family:"JetBrains Mono",monospace; font-size:12.5px; line-height:1.58; color:var(--prose); scrollbar-width:thin; }
.code pre code { background:none; border:0; padding:0; font-size:inherit; overflow-wrap:normal; }
.mmd-body { padding:16px 12px; overflow-x:auto; text-align:center; min-height:64px; scrollbar-width:thin; }
.mmd-body svg { max-width:100%; height:auto; }
.mmd.natural .mmd-body svg { max-width:none; }
.mmd.stale .mmd-body { opacity:.42; }
.mmd-wait { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-4); padding:18px 0; }
.mmd-src { text-align:left; margin-top:8px; font-family:"JetBrains Mono",monospace; font-size:12px; line-height:1.55; color:var(--prose-2); white-space:pre; overflow-x:auto; }
.mmd-err { font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--del-ink); text-align:left; }
.fm dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; padding:10px 14px; font-family:"JetBrains Mono",monospace; font-size:12px; }
.fm dt { color:var(--ink-4); } .fm dd { color:var(--prose-2); overflow-wrap:anywhere; }
.footnotes { font-size:13.5px; color:var(--prose-2); }

/* highlight.js → theme tokens */
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-doctag { color:var(--k-key); }
.hljs-string,.hljs-regexp,.hljs-addition { color:var(--k-str); }
.hljs-number,.hljs-symbol,.hljs-bullet { color:var(--k-num); }
.hljs-comment,.hljs-quote { color:var(--k-com); font-style:italic; }
.hljs-title,.hljs-section,.hljs-function .hljs-title,.hljs-title.function_ { color:var(--k-fn); }
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable,.hljs-property { color:var(--k-attr); }
.hljs-built_in,.hljs-type,.hljs-title.class_ { color:var(--k-bi); }
.hljs-meta,.hljs-params,.hljs-subst { color:var(--k-meta); }
.hljs-deletion { color:var(--del-ink); }

/* ════ change marks ════════════════════════════════════════════════ */
.mk { position:absolute; width:3px; border-radius:1.5px; pointer-events:auto; cursor:pointer; transition:opacity .6s, background-color .6s, width .3s; }
.mk::after { content:""; position:absolute; inset:-3px -7px; }
.mk.unseen { background:var(--gold); }
.mk.unseen.mod { background:repeating-linear-gradient(to bottom, var(--gold) 0 6px, transparent 6px 8px); }
.mk.seen { background:var(--seen); width:2px; }
.mk.tomb { width:0; height:0 !important; border-radius:0; background:none !important; border-left:7px solid var(--gold); border-top:5px solid transparent; border-bottom:5px solid transparent; }
.mk.tomb.seen { border-left-color:var(--seen); border-left-width:5px; }
.mk.point { width:9px; height:9px !important; transform:rotate(45deg); border-radius:1px; background:var(--gold); margin-left:-3px; }
.mk:hover { filter:brightness(1.25); }
.mk.flash { animation:mkflash 1.2s ease-out; }
@keyframes mkflash { 0%,40% { box-shadow:0 0 0 3px var(--gold-faint); } 100% { box-shadow:0 0 0 0 transparent; } }
.jumpflash { animation:jf 1.6s ease-out; }
@keyframes jf { 0% { background-color:var(--gold-ghost); } 100% { background-color:transparent; } }
/* inline diff */
.d-add,.d-mod,.d-check { background:var(--add-bg); border-radius:3px; box-shadow:-8px 0 0 var(--add-bg), 8px 0 0 var(--add-bg); }
tr.d-add,tr.d-mod { box-shadow:none; }
.doc ins { background:var(--ins-bg); text-decoration:none; border-radius:2px; padding:0 1px; }
.doc del + ins, .doc ins + del { margin-left:3px; }
.doc del { background:var(--del-bg); color:var(--del-ink); text-decoration:line-through; text-decoration-color:var(--del-ink); border-radius:2px; padding:0 1px; }
.diffx { font-family:"JetBrains Mono",monospace; font-size:12px; line-height:1.55; color:var(--del-ink); background:var(--del-bg);
  border-radius:4px; padding:7px 11px 8px; list-style:none; white-space:pre-wrap; overflow-wrap:anywhere; }
.diffx .wh { display:block; color:var(--ink-4); font-size:10.5px; letter-spacing:.05em; margin-bottom:3px; }
.diffx .dl { display:block; text-decoration:line-through; text-decoration-color:rgba(214,120,110,.55); }
li.diffx { margin-left:-1.45em; }
tr.diffx td { background:var(--del-bg); border-radius:0; }
/* agent note (c11 markdown point) */
.pnote { border-left:2px solid var(--gold); background:var(--gold-ghost); border-radius:0 6px 6px 0; padding:9px 12px 10px; }
.pn-h { display:flex; align-items:center; gap:10px; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--gold-ink); letter-spacing:.04em; }
.pn-h .pn-who { color:var(--ink-4); flex:1; }
.pn-b { margin-top:4px; font-size:14.5px; color:var(--head); }
.pn-ack { height:21px; width:62px; border:1px solid var(--gold-faint); border-radius:5px; color:var(--gold-ink); font-family:"JetBrains Mono",monospace; font-size:10.5px; }
.pn-ack:hover { background:var(--gold-faint); }
.pnote.seen { border-left-color:var(--seen); background:var(--rule-soft); }
.pnote.seen .pn-h { color:var(--ink-3); }

/* ════ source view ═════════════════════════════════════════════════ */
.src { font-family:"JetBrains Mono",monospace; font-size:12.5px; line-height:1.62; padding:16px 0 140px; color:var(--prose); }
.sl { display:flex; min-height:1.62em; }
.sl .ln { flex:none; width:4.5ch; text-align:right; padding-right:14px; color:var(--ink-4); user-select:none; font-variant-numeric:tabular-nums; }
.sl .tx { flex:1; min-width:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.sl.d-add,.sl.d-mod,.sl.d-check { box-shadow:none; border-radius:0; }
.sl.del { background:var(--del-bg); color:var(--del-ink); }
.sl.del .tx { text-decoration:line-through; text-decoration-color:rgba(214,120,110,.5); }
.sx-h { color:var(--head); font-weight:600; } .sx-m { color:var(--ink-4); } .sx-c { color:var(--k-str); } .sx-f { color:var(--k-meta); } .sx-b { color:var(--head); font-weight:500; }

/* ════ overlays: rail, pill, find, point chip ═══════════════════════ */
.rail { position:absolute; top:6px; bottom:6px; right:3px; width:9px; z-index:4; cursor:pointer; }
.rail .rv { position:absolute; left:0; right:0; border:1px solid var(--ink-4); border-radius:2px; background:var(--rule-soft); min-height:8px; }
.rail .rt { position:absolute; left:1.5px; right:1.5px; height:3px; border-radius:1px; }
.rt.unseen { background:var(--gold); } .rt.seen { background:var(--seen); opacity:.55; } .rt.find { background:var(--ink-2); height:2px; left:3px; right:3px; opacity:.7; }
.rt.point { width:7px; height:7px; left:1px; transform:rotate(45deg); background:var(--gold); }
.pill { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:6; display:flex; align-items:center; height:32px;
  background:var(--chrome); border:1px solid var(--rule); border-radius:8px; box-shadow:var(--shadow); font-size:11.5px; white-space:nowrap;
  transition:opacity .25s, transform .25s; }
.pill.hide { opacity:0; pointer-events:none; transform:translate(-50%, 6px); }
.pill .pmain { display:flex; align-items:center; gap:7px; padding:0 12px; height:100%; color:var(--ink-2); }
.pill .pdia { width:7px; height:7px; background:var(--gold); transform:rotate(45deg); border-radius:1px; flex:none; }
.pill .pcount { color:var(--gold-ink); font-weight:600; min-width:2ch; text-align:right; }
.pill .plabel { width:24ch; }
.pill .pdir { color:var(--ink-4); width:9ch; }
.pill button { height:100%; width:32px; border-left:1px solid var(--rule); color:var(--ink-3); }
.pill button:hover { background:var(--chrome2); color:var(--ink); }

@keyframes pillpulse { 0% { box-shadow:0 0 0 0 var(--gold-faint), var(--shadow); } 30% { box-shadow:0 0 0 5px var(--gold-faint), var(--shadow); } 100% { box-shadow:0 0 0 0 transparent, var(--shadow); } }
.findbar { position:absolute; top:8px; right:18px; z-index:7; width:330px; max-width:calc(100% - 36px); height:32px; display:flex; align-items:center;
  background:var(--chrome); border:1px solid var(--rule); border-radius:7px; box-shadow:var(--shadow); }
.findbar input { flex:1; min-width:0; height:100%; background:none; border:0; outline:0; color:var(--ink); font:inherit; font-size:12px; padding:0 10px; }
.findbar .fcount { flex:none; width:9ch; text-align:right; color:var(--ink-4); padding-right:8px; }
.findbar button { flex:none; width:30px; height:100%; border-left:1px solid var(--rule); color:var(--ink-3); }
.findbar button:hover { color:var(--ink); background:var(--chrome2); }
.findbar:focus-within { border-color:var(--gold-faint); }

::highlight(findcur) { background-color:#c9a84c; color:#0a0a0a; }
.pointchip { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:6; max-width:calc(100% - 60px); height:28px; display:flex; align-items:center; gap:8px;
  padding:0 4px 0 11px; background:var(--chrome); border:1px solid var(--gold-faint); border-radius:7px; box-shadow:var(--shadow); font-size:11px; color:var(--ink-2); white-space:nowrap; }

.pointchip .ptx { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pointchip button { height:20px; padding:0 9px; border:1px solid var(--rule); border-radius:5px; color:var(--ink-2); flex:none; }
.pointchip button:hover { background:var(--chrome2); }
[hidden] { display:none !important; }

/* narrow pane */
@container (max-width: 640px) {
  .content { padding:0 22px 0 32px; }
  .doc { font-size:15px; padding-top:20px; }
  .doc h1 { font-size:22px; } .doc h2 { font-size:18px; } .doc h3 { font-size:15.5px; }
  .pill .plabel { width:auto; } .pill .plabel .long { display:none; }
  .fresh { width:8ch; }
}

/* ════ agent cli drawer (prototype chrome) ══════════════════════════ */
#drawer { flex:none; width:390px; height:100%; display:flex; flex-direction:column; background:var(--chrome); border:1px dashed var(--gold-faint); border-radius:8px; overflow:hidden; }
#drawer.overlay { position:absolute; right:16px; top:16px; bottom:16px; height:auto; z-index:20; box-shadow:var(--shadow); }

.cmd code .fl { color:var(--k-attr); } .cmd code .st { color:var(--k-str); }
.cmd p { color:var(--ink-4); font-size:10.5px; line-height:1.5; margin-top:3px; }
.cmd .row { display:flex; align-items:flex-start; gap:8px; }
.cmd .row code { flex:1; min-width:0; }
.run { flex:none; width:46px; height:22px; border:1px solid var(--gold-faint); border-radius:5px; color:var(--gold-ink); font-size:10.5px; }
.run:hover { background:var(--gold-faint); }
.dout { flex:1 1 45%; min-height:120px; overflow-y:auto; border-top:1px solid var(--rule); background:var(--void); padding:10px 12px; font-size:11px; line-height:1.5; color:var(--ink-3); white-space:pre-wrap; overflow-wrap:anywhere; scrollbar-width:thin; }
.dout .pr { color:var(--ink); } .dout .ok { color:var(--add-rule); } .dout .er { color:var(--del-ink); }
.keys { flex:none; border-top:1px solid var(--rule); padding:7px 12px; color:var(--ink-4); font-size:10.5px; line-height:1.6; }

</style>
</head>
<body>

  </aside>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const SEC = 1000, MIN = 60 * SEC;
const FADE = 15 * MIN;            // seen marks fade out over this sim span
const DWELL = 2500;               // real ms on screen in a focused pane = seen
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nb = s => s.trim() !== '';
const splitLines = s => s.replace(/\n$/, '').split('\n');

const docEl = $('#doc'), srcEl = $('#src'), scroller = $('#scroller'), content = $('#content'), marksEl = $('#marks'), railEl = $('#rail');

/* ═════════ state ═════════ */
const S = {
  doc:null, src:'', lines:[], meta:[], hunks:new Map(), tombs:[], seq:0,
  now:Date.now(), lastLook:0, lastWrite:0, lastWriteLine:0, focus:'here', mode:'hold', diff:false, source:false,
  playing:true, speed:10, step:0, nextAt:Infinity, dwell:true, pointer:null, waiters:[], theme:'dark', width:820, seenLog:[],
};

/* ═════════ markdown-it: the renderer the real build would bundle ═════════ */
function slugify(s) { return s.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-'); }
function makeMd(html) {
  const md = window.markdownit({ html, linkify:true, typographer:false });
  md.linkify.set({ fuzzyLink:false });
  if (window.markdownitFootnote) md.use(window.markdownitFootnote);
  // YAML front matter → small key/value block (keeps line numbers intact)
  md.block.ruler.before('table', 'front_matter', (state, start, end, silent) => {
    if (start !== 0) return false;
    const lt = l => state.src.slice(state.bMarks[l] + state.tShift[l], state.eMarks[l]);
    if (lt(0) !== '---') return false;
    let l = 1; while (l < end && lt(l) !== '---') l++;
    if (l >= end) return false;
    if (silent) return true;
    const t = state.push('front_matter', '', 0); t.map = [0, l + 1]; t.block = true; t.content = state.getLines(1, l, 0, false);
    state.line = l + 1; return true;
  });
  md.renderer.rules.front_matter = (tk, i) => {
    const t = tk[i]; const rows = t.content.split('\n').filter(nb).map(r => { const k = r.indexOf(':'); return k < 0 ? `<dt></dt><dd>${esc(r)}</dd>` : `<dt>${esc(r.slice(0, k))}</dt><dd>${esc(r.slice(k + 1).trim())}</dd>`; }).join('');
    return `<div class="fm" data-ls="${t.map[0]}" data-le="${t.map[1]}"><div class="blk-head"><span>front matter</span></div><dl>${rows}</dl></div>`;
  };
  md.core.ruler.after('inline', 'live_trail', state => {
    const toks = state.tokens; const seen = new Map();
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t.map && (t.nesting === 1 || t.type === 'hr' || t.type === 'code_block')) { t.attrSet('data-ls', t.map[0]); t.attrSet('data-le', t.map[1]); }
      if (t.type === 'heading_open') {
        let s = slugify(toks[i + 1].content); const n = seen.get(s) || 0; seen.set(s, n + 1); if (n) s += '-' + n; t.attrSet('id', s);
      }
      // task lists
      if (t.type === 'inline' && i > 1 && toks[i - 1].type === 'paragraph_open' && toks[i - 2].type === 'list_item_open') {
        const m = /^\[([ xX])\]\s+/.exec(t.content); const first = t.children[0];
        if (m && first && first.type === 'text') {
          const done = m[1] !== ' ';
          first.content = first.content.replace(/^\[([ xX])\]\s+/, '');
          const h = new state.Token('html_inline', '', 0); h.content = `<span class="cb${done ? ' done' : ''}"></span>`; t.children.unshift(h);
          toks[i - 2].attrJoin('class', 'task' + (done ? ' done' : ''));
        }
      }
      // GitHub callouts  > [!NOTE]
      if (t.type === 'blockquote_open' && toks[i + 2] && toks[i + 2].type === 'inline') {
        const m = /^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i.exec(toks[i + 2].content); const first = toks[i + 2].children[0];
        if (m && first && first.type === 'text') {
          first.content = first.content.replace(m[0], ''); t.attrJoin('class', 'callout callout-' + m[1].toLowerCase());
          const h = new state.Token('html_inline', '', 0); h.content = `<span class="callout-title">${m[1].toLowerCase()}</span>`; toks[i + 2].children.unshift(h);
        }
      }
    }
  });
  md.renderer.rules.heading_open = (tk, i, o, e, slf) => slf.renderToken(tk, i, o) + '<span class="htext">';
  md.renderer.rules.heading_close = (tk, i) => { const id = tk[i - 2].attrGet('id'); return `</span><a class="hanchor" href="#${esc(id)}" aria-label="link to section">#</a><span class="fresh"></span></${tk[i].tag}>`; };
  md.renderer.rules.table_open = (tk, i, o, e, slf) => `<div class="tbl"${slf.renderAttrs(tk[i])}><table>`;
  md.renderer.rules.table_close = () => '</table></div>';
  md.renderer.rules.fence = (tk, i) => {
    const t = tk[i]; const lang = (t.info || '').trim().split(/\s+/)[0].toLowerCase(); const a = `data-ls="${t.map[0]}" data-le="${t.map[1]}"`;
    if (lang === 'mermaid') return `<div class="mmd" ${a} data-code="${esc(t.content)}"><div class="blk-head"><span>mermaid</span><span class="blk-tools"><button class="mini" data-act="fit">1:1</button><button class="mini" data-act="copy">copy</button></span></div><div class="mmd-body"><div class="mmd-wait">rendering diagram</div></div></div>`;
    let body; try { body = lang && hljs.getLanguage(lang) ? hljs.highlight(t.content, { language:lang, ignoreIllegals:true }).value : esc(t.content); } catch (_) { body = esc(t.content); }
    return `<div class="code" ${a}><div class="blk-head"><span>${esc(lang || 'text')}</span><button class="mini" data-act="copy">copy</button></div><pre><code class="hljs">${body}</code></pre></div>`;
  };
  return md;
}
const md = makeMd(false);
const mdInline = makeMd(true);   // only for word-diff markup (<ins>/<del>)

/* ═════════ diff primitives ═════════ */
function lcsOps(A, B) {   // A, B arrays; returns [{op,i,j}]
  const n = A.length, m = B.length; const ops = [];
  let s = 0; while (s < n && s < m && A[s] === B[s]) { ops.push({ op:'eq', i:s, j:s }); s++; }
  let e = 0; while (e < n - s && e < m - s && A[n - 1 - e] === B[m - 1 - e]) e++;
  const a = A.slice(s, n - e), b = B.slice(s, m - e); const N = a.length, M = b.length;
  const dp = []; for (let i = 0; i <= N; i++) dp.push(new Int32Array(M + 1));
  for (let i = N - 1; i >= 0; i--) for (let j = M - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0;
  while (i < N || j < M) {
    if (i < N && j < M && a[i] === b[j]) { ops.push({ op:'eq', i:s + i, j:s + j }); i++; j++; }
    else if (j >= M || (i < N && dp[i + 1][j] >= dp[i][j + 1])) { ops.push({ op:'del', i:s + i }); i++; }
    else { ops.push({ op:'ins', j:s + j }); j++; }
  }
  for (let k = 0; k < e; k++) ops.push({ op:'eq', i:n - e + k, j:m - e + k });
  return ops;
}
const normCheck = s => s.replace(/\[[ xX]\]/, '[ ]');

/* ═════════ document versions ═════════ */
function loadDoc(id) {
  const d = DATA.docs.find(x => x.id === id); S.doc = d;
  S.src = d.src; S.lines = splitLines(d.src); S.hunks = new Map(); S.tombs = []; S.pointer = null; S.seenLog = []; S.step = 0; S.seq = 0;
  S.now = Date.now(); S.waiters = [];
  S.lastLook = S.now - (d.live ? 8 : 60) * MIN; S.lastWrite = S.now - (d.live ? 3 : 180) * MIN;
  S.meta = S.lines.map(() => ({ h:null }));
  if (d.live) {
    // the agent wrote the doc section by section over the last ~50 minutes; you last looked 8m ago
    const heads = []; let fence = false;
    S.lines.forEach((l, i) => { if (/^\s*```/.test(l)) fence = !fence; if (!fence && /^## /.test(l)) heads.push(i); });
    heads[0] = 0; const K = heads.length;
    heads.forEach((start, k) => {
      const end = k + 1 < K ? heads[k + 1] : S.lines.length;
      const age = k === K - 1 ? 3 : k === K - 2 ? 5 : 52 - (38 * k) / Math.max(1, K - 3);
      const t = S.now - age * MIN;
      const h = { id:'c' + (++S.seq), kind:'add', t, seen:t <= S.lastLook, seenAt:t <= S.lastLook ? S.lastLook : null, how:'earlier', prev:[], dwell:0 };
      S.hunks.set(h.id, h);
      for (let i = start; i < end; i++) if (nb(S.lines[i])) S.meta[i] = { h:h.id };
    });
    S.lastWriteLine = heads[K - 1];
    S.nextAt = S.now + DATA.steps[0].delay * SEC; S.playing = true;
  } else {
    const h = { id:'c' + (++S.seq), kind:'add', t:S.lastWrite, seen:true, seenAt:S.lastLook, how:'earlier', prev:[], dwell:0 };
    S.hunks.set(h.id, h); S.lines.forEach((l, i) => { if (nb(l)) S.meta[i] = { h:h.id }; });
    S.nextAt = Infinity; S.playing = false;
  }
  docEl.innerHTML = ''; srcEl.innerHTML = '';
  renderCurrent(); scroller.scrollTop = 0; anchor = captureAnchor();
  afterRender(); syncChrome(); tickUI(); log(`<span class="pr">$ c11 markdown open ${esc(d.path)}</span>\n<span class="ok">opened tab:12 · live reload · writer ${esc(d.writer || 'none')}</span>`, true);
}

function applyStep() {
  if (!S.doc.live || S.step >= DATA.steps.length) return;
  const st = DATA.steps[S.step++];
  S.now = Math.max(S.now, S.nextAt === Infinity ? S.now : S.nextAt);
  let src = S.src;
  for (const op of st.ops) {
    if (op[0] === 'append') src += op[1];
    else { const k = src.indexOf(op[1]); if (k < 0) { console.warn('op miss'); continue; } src = src.slice(0, k) + op[2] + src.slice(k + op[1].length); }
  }
  commitVersion(src, S.now);
  S.nextAt = S.step < DATA.steps.length ? S.now + DATA.steps[S.step].delay * SEC : Infinity;
  syncChrome();
}

function commitVersion(newSrc, t) {
  const a = S.lines, b = splitLines(newSrc); const ops = lcsOps(a, b);
  const map = new Int32Array(a.length + 1); const meta = new Array(b.length); const fresh = [];
  let k = 0;
  while (k < ops.length) {
    const o = ops[k];
    if (o.op === 'eq') { map[o.i] = o.j; meta[o.j] = S.meta[o.i] || { h:null }; k++; continue; }
    const dels = [], ins = [];
    while (k < ops.length && ops[k].op !== 'eq') { const r = ops[k]; (r.op === 'del' ? dels.push(r.i) : ins.push(r.j)); k++; }
    const jNext = k < ops.length ? ops[k].j : b.length;

function rel(ms) { const s = Math.max(0, Math.round(ms / 1000)); if (s < 45) return 'just now'; const m = Math.round(s / 60); if (m < 60) return m + 'm ago'; const h = Math.round(m / 60); if (h < 24) return h + 'h ago'; return Math.round(h / 24) + 'd ago'; }

/* ═════════ pill, tab chip, writer strip ═════════ */
function updatePill() {

  const up = list.filter(g => g.bottom < vt + 4).length, down = list.filter(g => g.top > vb - 4).length;
  $('#pCount').textContent = n; $('#pLabel').innerHTML = (n === 1 ? 'change' : 'changes') + '<span class="long"> since you looked</span>';

function updateChip() {
  const n = unseenUnits().length + (S.pointer && !S.pointer.seen ? 1 : 0); const c = $('#tabChip');

}
function sectionOf(L) { let fence = false, best = null; for (let i = 0; i <= Math.min(L, S.lines.length - 1); i++) { const l = S.lines[i]; if (/^\s*```/.test(l)) fence = !fence; if (!fence) { const m = /^#{1,3}\s+(.*)/.exec(l); if (m) best = m[1]; } } return best || S.doc.tab; }

}

/* ═════════ find (⌘F) via CSS custom highlights: no DOM mutation ═════════ */

$('#findNext').onclick = () => setFindCur(FIND.cur + 1, true); $('#findPrev').onclick = () => setFindCur(FIND.cur - 1, true); $('#findClose').onclick = closeFind;

/* ═════════ view toggles ═════════ */
function setSource(on) {
  if (S.source === on) return; const a = captureAnchor(); const L = a ? a.line : 0; const off = a ? a.off : 0;
  S.source = on; renderCurrent();
  const n = topBlocks().find(x => +x.getAttribute('data-le') > L);
  if (n) scroller.scrollTop += (n.getBoundingClientRect().top - scroller.getBoundingClientRect().top) - off;

addEventListener('resize', layoutStage);

/* ═════════ events ═════════ */

$('#diffBtn').onclick = () => setDiff(!S.diff); $('#srcBtn').onclick = () => setSource(!S.source); $('#findBtn').onclick = () => FIND.open ? closeFind() : openFind();
$('#pNext').onclick = () => jump(1); $('#pPrev').onclick = () => jump(-1);
$('#pSeen').onclick = () => markSeen([...unseenUnits().map(u => u.h), S.pointer].filter(Boolean), 'all');

$('#themeSeg').onclick = e => e.target.dataset.v && setTheme(e.target.dataset.v);

$('#focusSeg').onclick = e => e.target.dataset.v && setFocus(e.target.dataset.v);
$('#dwellSeg').onclick = e => { if (e.target.dataset.v) { S.dwell = e.target.dataset.v === 'on'; syncChrome(); } };
$('#playBtn').onclick = () => { S.playing = !S.playing; syncChrome(); };
$('#stepBtn').onclick = () => applyStep();
$('#resetBtn').onclick = () => loadDoc(S.doc.id);
$('#docSel').onchange = e => loadDoc(e.target.value);

$('#drawerClose').onclick = () => { $('#drawer').hidden = true; };
$('#frame').addEventListener('mousedown', () => { if (S.focus !== 'here') setFocus('here'); });
marksEl.addEventListener('click', e => { const id = e.target.dataset.h; if (!id) return; const h = S.hunks.get(id) || (S.pointer && S.pointer.id === id ? S.pointer : null); if (h) markSeen([h], 'mark'); });
railEl.addEventListener('click', e => { const r = railEl.getBoundingClientRect(); const y = (e.clientY - r.top) / r.height * content.scrollHeight; scrollToY(y - scroller.clientHeight / 2, true); });
docEl.addEventListener('click', e => {
  const b = e.target.closest('.mini');
  if (b) {
    if (b.dataset.act === 'copy') { const blk = b.closest('.code,.mmd'); const txt = blk.classList.contains('mmd') ? blk.dataset.code : blk.querySelector('code').textContent; copyText(txt); b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1200); }
    if (b.dataset.act === 'fit') { const m = b.closest('.mmd'); holdAnchor(() => m.classList.toggle('natural')); b.textContent = m.classList.contains('natural') ? 'fit' : '1:1'; }

  }

});
function copyText(t) { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(() => {}); else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); } }

/* ═════════ agent CLI drawer ═════════ */
const CMDS = [
  { id:'open', cmd:'c11 markdown open plan.md --tab-title "c11-184 plan"', note:'opens a live surface; c11 records the opener as the writer, so the strip can say who is writing.' },
  { id:'point', run:true, cmd:() => `c11 markdown point --tab tab:12 \\\n  --heading "${pointTarget().heading}" \\\n  --note "${pointTarget().note}"`, note:'draws the operator\'s eye to a passage with a note. never scrolls the reader; it joins the change queue as the first stop.' },
  { id:'seen', run:true, cmd:'c11 markdown seen --tab tab:12 --json', note:'what the operator has and has not seen, per change, plus where they are reading.' },
  { id:'wait', run:true, cmd:'c11 markdown wait-seen --tab tab:12 --pointer --timeout 10m', note:'blocks until the operator has seen the pointed passage (dwell, got it, or mark seen). exit 0 on seen, 124 on timeout.' },
  { id:'scroll', run:true, cmd:'c11 markdown scroll --tab tab:12 --heading "Acceptance checklist"', note:'honored only while the operator is away from the pane. while they are here, it becomes a pointer instead of a yank.' },
  { id:'follow', run:true, cmd:() => `c11 markdown follow --tab tab:12 ${S.mode === 'follow' ? 'off' : 'on'}`, note:'switch hold / follow for the operator. same as the strip toggle.' },
  { id:'changes', cmd:'c11 markdown changes --tab tab:12 --since look --json', note:'the change ledger: id, kind, section, lines, written_at, seen_at.' },
  { id:'markseen', run:true, cmd:'c11 markdown mark-seen --tab tab:12 --all', note:'for when the operator says "got it" in chat instead of in the pane.' },
];
function pointTarget() {
  if (headingLine('Operator Phase 3 decision — resolved') >= 0) return { heading:'Operator Phase 3 decision — resolved', note:'this flips the suppression rule for flag raises. confirm before I amend the binding spec.' };
  if (headingLine('Tagged runtime, visual, and latency validation') >= 0) return { heading:'Tagged runtime, visual, and latency validation', note:'the visual gate is the riskiest part of this plan. is deferring it acceptable?' };
  const L = [...S.lines.keys()].reverse().find(i => /^## /.test(S.lines[i])); const hd = L != null ? S.lines[L].replace(/^##\s+/, '') : 'Goal';
  return { heading:hd, note:'start here: this section changed the most since you looked.' };
}
let drawerHTML = '';
function renderDrawer() {
  const fmt = s => esc(s).replace(/(--[a-z-]+)/g, '<span class="fl">$1</span>').replace(/(&quot;[^&]*?&quot;)/g, '<span class="st">$1</span>');
  const h = CMDS.map(c => `<div class="cmd"><div class="row"><code>${fmt(typeof c.cmd === 'function' ? c.cmd() : c.cmd)}</code>${c.run ? `<button class="run" data-run="${c.id}">run</button>` : ''}</div><p>${esc(c.note)}</p></div>`).join('');

}
$('#dlist').addEventListener('click', e => { const id = e.target.dataset.run; if (id) runCmd(id); });
function log(html, reset) { const o = $('#dout'); if (reset) o.innerHTML = ''; o.innerHTML += (o.innerHTML ? '\n\n' : '') + html; o.scrollTop = o.scrollHeight; }

function runCmd(id) {
  const c = CMDS.find(x => x.id === id); const line = typeof c.cmd === 'function' ? c.cmd() : c.cmd; const pr = `<span class="pr">$ ${esc(line)}</span>`;

    afterRender(); updatePointChip();
    log(pr + '\n' + esc(JSON.stringify({ ok:true, pointer:S.pointer.id, heading:t.heading, line:L + 1, scrolled:false, queued:'first' }, null, 2)));

      unseen:us.filter(u => !u.h.seen).map(unitJSON), seen_recent:us.filter(u => u.h.seen && u.h.how !== 'earlier').map(unitJSON).slice(-6),
      pointer:S.pointer ? { id:S.pointer.id, heading:S.pointer.heading, seen:S.pointer.seen, ...(S.pointer.seen ? { seen_at:iso(S.pointer.seenAt), how:S.pointer.how } : {}) } : null };
    log(pr + '\n' + esc(JSON.stringify(out, null, 2)));
  } else if (id === 'wait') {

    if (S.pointer.seen) { log(pr + '\n' + esc(JSON.stringify({ seen:true, pointer:S.pointer.id, how:S.pointer.how, at:iso(S.pointer.seenAt) })) + '\n<span class="ok">exit 0</span>'); return; }
    log(pr + `\nwaiting for operator to see ${S.pointer.id} (§ ${esc(S.pointer.heading)})…`);

  } else if (id === 'scroll') {

    } else {
      const el = docEl.querySelector(`[data-ls="${L}"]`); if (el) { scrollToY(el.getBoundingClientRect().top - content.getBoundingClientRect().top - 14, false); }

    }

  } else if (id === 'markseen') {
    const n = unseenUnits().length + (S.pointer && !S.pointer.seen ? 1 : 0); markSeen([...unseenUnits().map(u => u.h), S.pointer].filter(Boolean), 'agent'); log(pr + `\nmarked ${n} seen. done.`);
  }
  renderDrawer();
}
function checkWaiters() {
  S.waiters = S.waiters.filter(w => {
    if (w.p.seen) { log(esc(JSON.stringify({ seen:true, pointer:w.p.id, how:w.p.how, after_s:Math.round((w.p.seenAt - w.start) / 1000), at:iso(w.p.seenAt) })) + '\n<span class="ok">exit 0</span>'); return false; }
    if (S.now - w.start > 10 * MIN) { log(`<span class="er">timeout: ${w.p.id} not seen after 10m</span>\nexit 124`); return false; }
    return true;
  });
}

/* ═════════ clock ═════════ */
let lastTick = performance.now(), acc = 0;
setInterval(() => {
  const t = performance.now(), dt = t - lastTick; lastTick = t;
  S.now += dt * S.speed;
  if (S.playing && S.doc.live && S.now >= S.nextAt) applyStep();
  dwellCheck(dt);
  acc += dt; if (acc >= 1000) { acc = 0; tickUI(); checkWaiters(); renderDrawer(); }
}, 250);

/* ═════════ boot ═════════ */
$('#docSel').innerHTML = DATA.docs.map(d => `<option value="${d.id}">${esc(d.tab)}${d.live ? ' (live)' : ''}</option>`).join('');
initMermaid(); setWidth(820); renderDrawer(); loadDoc('plan');
document.fonts && document.fonts.ready.then(() => { restoreAnchor(anchor); afterRender(); });
window.__lt = { S, applyStep, jump, markSeen, runCmd, setSource, setDiff, setTheme, setWidth, setFocus, openFind, GEOM:() => GEOM, scroller };
</script>
