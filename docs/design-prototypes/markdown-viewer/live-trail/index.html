`_processing/` back to `_outbox/` on restart. Those envelopes are stranded until Stage 3 ships the recovery sweep. The steady-state at-least-once claim above holds; the crash-while-processing corner of at-least-once does not, and callers that care MUST rely on reply chains or application-level retries until Stage 3.\n- **Best-effort to handler.** Handler invocation (PTY write, watch stream, etc.) may fail independently without affecting inbox durability. Handler outcomes are recorded in `_dispatch.log`.\n- **Receivers dedupe by `id`.** Because at-most-once is not achievable (cleanup isn't atomic with dispatch), receivers MUST tolerate duplicates. Deduplication is trivial: maintain a short-lived seen-id set and skip already-processed IDs.\n\n**Ordering:**\n- **No total ordering across senders.** macOS FSEvents does not guarantee event ordering across multiple files. Agents that need ordered streams coordinate themselves via reply chains (`in_reply_to`) or in-body sequence numbers.\n- **Per-sender ordering is best-effort**, not guaranteed. Use ULIDs' time-embedded prefix as a weak tiebreaker.\n\n**TTL and expiry:**\n- `ttl_seconds` is advisory. Recipients MAY drop envelopes whose `ts + ttl_seconds < now` on read. c11 does not enforce TTL at the dispatcher in v1; expired envelopes that reach an inbox are the recipient's problem to drop.\n\n---\n\n## 6. Observability — `_dispatch.log`\n\nEvery dispatch event appends one NDJSON line to `$C11_STATE/mailboxes/_dispatch.log`:\n\n```json\n{\"ts\":\"2026-04-23T10:15:42.003Z\",\"event\":\"received\",\"id\":\"01K3A2B7X\",\"from\":\"builder\",\"to\":null,\"topic\":\"ci.status\"}\n{\"ts\":\"2026-04-23T10:15:42.004Z\",\"event\":\"resolved\",\"id\":\"01K3A2B7X\",\"recipients\":[\"watcher\",\"tester\"]}\n{\"ts\":\"2026-04-23T10:15:42.005Z\",\"event\":\"copied\",\"id\":\"01K3A2B7X\",\"recipient\":\"watcher\"}\n{\"ts\":\"2026-04-23T10:15:42.006Z\",\"event\":\"handler\",\"id\":\"01K3A2B7X\",\"recipient\":\"watcher\",\"handler\":\"stdin\",\"outcome\":\"ok\",\"bytes\":67}\n{\"ts\":\"2026-04-23T10:15:42.007Z\",\"event\":\"copied\",\"id\":\"01K3A2B7X\",\"recipient\":\"tester\"}\n{\"ts\":\"2026-04-23T10:15:42.008Z\",\"event\":\"handler\",\"id\":\"01K3A2B7X\",\"recipient\":\"tester\",\"handler\":\"stdin\",\"outcome\":\"timeout\",\"bytes\":0,\"elapsed_ms\":500}\n{\"ts\":\"2026-04-23T10:15:42.009Z\",\"event\":\"cleaned\",\"id\":\"01K3A2B7X\"}\n```\n\n**Event types in v1:** `received`, `resolved`, `copied`, `handler`, `rejected`, `cleaned`, `replayed` (from sweep).\n\n**CLI helper (v1 minimum):**\n```\nc11 mailbox trace <id>    # greps _dispatch.log for an id, pretty-prints\nc11 mailbox tail          # tails _dispatch.log as it happens\n```\n\n**Why this matters:** the operator's first real debugging question will be \"why didn't X arrive?\" Without the log, the answer requires filesystem spelunking with lucky timing. With the log, it's `c11 mailbox trace 01K3A2B7X` and the full dispatch story shows up. This is the cheapest high-leverage piece of the design.\n\nLog rotation: daily, retain 7 days by default (same as inbox retention).\n\n---\n\n## 7. Happy path — agent is idle\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor A as Agent A<br/>(builder)\n    participant FS as Filesystem\n    participant Core as c11 core\n    actor B as Agent B<br/>(watcher)\n\n    A->>FS: write _outbox/01K.tmp<br/>rename to 01K.msg\n    FS-->>Core: fsevent: new .msg\n    Core->>Core: dedupe check (_dispatch.log)\n    Core->>FS: atomic move _outbox/ → _processing/\n    Core->>FS: validate + read envelope\n    Core->>FS: copy to watcher/01K.msg\n    Core->>Core: load watcher manifest<br/>→ delivery: [stdin]\n    Core->>B: async PTY write with 500ms timeout:<br/>&lt;c11-msg from=\"builder\" ...&gt;<br/>build green sha=abc<br/>&lt;/c11-msg&gt;\n    B-->>Core: write ok\n    Core->>FS: append _dispatch.log (handler ok)\n    Core->>FS: remove _processing/01K.msg\n    Note over B,FS: envelope persists in watcher/01K.msg<br/>for self-retrieval or history\n    B->>B: on next input read,<br/>sees &lt;c11-msg&gt; tag,<br/>acts on body\n```\n\n---\n\n## 8. Multiple messages — the inbox is the queue, the PTY is the channel\n\nThree senders, one busy recipient. Each envelope is atomically moved to `_processing/`, copied to the inbox, and an **async** PTY write is attempted with a 500 ms timeout. If the recipient is genuinely stuck and the PTY buffer is full, the write fails fast and the envelope sits in the inbox for later `recv`.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor S1 as builder\n    actor S2 as tester\n    actor S3 as deployer\n    participant Core as c11 core\n    actor Busy as Busy Agent<br/>(mid-tool-call,<br/>stdin buffered)\n\n    S1->>Core: send msg #1 (file write)\n    Core->>Busy: async PTY write #1\n    Busy-->>Core: ok (buffered)\n    S2->>Core: send msg #2\n    Core->>Busy: async PTY write #2\n    Busy-->>Core: ok (buffered)\n    S3->>Core: send msg #3\n    Core->>Busy: async PTY write #3\n    Busy-->>Core: ok (buffered)\n    Note over Busy: tool call finishes.<br/>Next input read returns<br/>all 3 blocks concatenated<br/>from the PTY buffer.\n    Busy->>Busy: parse 3 blocks,<br/>dedupe by id,<br/>acknowledge all three\n```\n\n**The inbox is the queue, not the PTY.** Each envelope is durably stored in the recipient's inbox the moment it's written — before the PTY attempt. If the stdin handler's reporting deadline fires (`timeout`) or the surface is gone (`closed`), the envelope is still in the inbox, the recipient finds it on next `recv`, and the outcome is recorded in `_dispatch.log`. Propagating real PTY errno (EIO/EPIPE) from the Ghostty writer into the dispatch log is Stage 3 work alongside the async-cancellable writer — Stage 2 does not claim that contract.\n\n---\n\n## 9. Topic broadcast — subscribe + fan-out\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Pub as Agent X<br/>(publisher)\n    participant FS as Filesystem\n    participant Core as c11 core\n    actor SubA as Subscriber A<br/>subscribe: [build.*]\n    actor SubB as Subscriber B<br/>subscribe: [build.green]\n    actor NonSub as Agent Z<br/>(not subscribed)\n\n    Pub->>FS: write _outbox/01K.msg<br/>{topic: \"build.green\"}\n    FS-->>Core: fsevent\n    Core->>FS: move to _processing/\n    Core->>Core: match \"build.green\" against<br/>all manifests.subscribe<br/>→ [SubA, SubB]\n    par fan out\n        Core->>FS: copy into SubA/01K.msg\n        Core->>SubA: async PTY write\n    and\n        Core->>FS: copy into SubB/01K.msg\n        Core->>SubB: async PTY write\n    end\n    Note over NonSub: no subscription match,<br/>no inbox copy,<br/>no PTY write\n    Core->>FS: cleanup _processing/\n```\n\nDirect `to:` sends and topic publishes share the dispatcher; the only difference is the recipient-resolution query.\n\n---\n\n## 10. Non-stdin delivery: silent + watch\n\nFramed text in a vim buffer would be catastrophic. Silent-mode surfaces skip PTY injection; the mailbox file is the only channel, optionally augmented by a `watch` stream.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Sender as builder\n    participant FS as Filesystem\n    participant Core as c11 core\n    participant Side as Sidecar<br/>(user-owned)\n    actor Silent as Silent Agent<br/>(vim surface)\n\n    Note over Silent: manifest:<br/>delivery: [silent, watch]\n    Side->>Core: c11 mailbox watch --surface vim<br/>(NDJSON stream on socket)\n    Sender->>FS: write _outbox/01K.msg<br/>{to: vim}\n    FS-->>Core: fsevent\n    Core->>FS: move to _processing/\n    Core->>FS: copy into vim/01K.msg\n    Note over Core: delivery=[silent,watch]<br/>→ no PTY write\n    Core-->>Side: NDJSON line for watch handler\n    Note over Side,Silent: sidecar decides:<br/>append to file? ring bell?<br/>defer until vim exits?\n    Silent->>FS: on own schedule:<br/>read + unlink vim/*.msg\n```\n\n---\n\n## 11. End-to-end: three agents coordinating a build\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor Builder as builder\n    actor Tester as tester\n    actor Notifier as notifier\n    participant Core as c11 core\n\n    Note over Tester: subscribe: [build.ready]\n    Note over Notifier: subscribe: [tests.done]\n\n    Builder->>Core: send --topic build.ready<br/>--body \"sha=abc\"\n    Core->>Tester: async PTY write\n    Note over Tester: run test suite<br/>(long-running)\n\n    Tester->>Core: send --topic tests.done<br/>--body \"sha=abc pass=true\"\n    Core->>Notifier: async PTY write\n\n    Notifier->>Core: send --to builder<br/>--body \"ship it\"\n    Core->>Builder: async PTY write\n```\n\nNo orchestrator. Coordination emerges from the topic graph.\n\n---\n\n## 12. Skill-teaches-grammar (excerpt sketch)\n\n> ### Messages from other surfaces\n>\n> If you see a tag in your input that looks like this:\n>\n> ```xml\n> <c11-msg from=\"builder\" topic=\"ci.status\" id=\"01K3A2B7\" ts=\"2026-04-23T10:15:42Z\">\n> build green sha=abc\n> <\/c11-msg>\n> ```\n>\n> …this is **not** user input. It's a message sent from another c11 surface. The body (between the tags) is the full payload — no fetch command needed.\n>\n> **Default protocol:**\n> 1. Finish any tool call you were already running.\n> 2. Treat each `<c11-msg>` block as a system message from the sender.\n> 3. **Dedupe by `id`.** The same message may arrive twice (c11 is at-least-once). Maintain a short-lived seen-id set; skip duplicates.\n> 4. In your next response to the operator, acknowledge the message(s) inline.\n> 5. If a reply is expected (sender used `reply_to=\"<surface>\"`), send one.\n>\n> **Multiple tags?** They stack in input order. Handle each in turn.\n>\n> **Escaping.** Bodies containing `<`, `>`, or `&` arrive escaped (`&lt;`, `&gt;`, `&amp;`). Unescape before interpreting.\n>\n> **Urgency.** `urgent=\"true\"` means interrupt at the earliest safe point.\n>\n> **Oversized bodies.** If the tag has `body_ref=\"/path/...\"` and an empty body, the real payload is at that path. Read it from disk.\n>\n> ---\n>\n> ### Sending — two equivalent ways\n>\n> **CLI (easy):**\n> ```\n> c11 mailbox send --to <surface> [--topic <topic>] [--reply-to <me>] --body <text>\n> c11 mailbox send --to <surface> --body-ref /path/to/large.json   # for bodies >4KB\n> ```\n>\n> **Direct file write (if you need it):** resolve paths through the CLI helpers so the agent never depends on raw env vars. The outbox lives at `$(c11 mailbox outbox-dir)` and your surface name is `$(c11 mailbox surface-name)`. Drop a JSON envelope as `<outbox>/.<ulid>.tmp` (dot-prefix so the dispatcher ignores it until atomic rename) then `mv` it to `<outbox>/<ulid>.msg`. Required fields: `version`, `id`, `from`, `ts`, `body`, plus `to` (topic-only sends are not delivered in Stage 2). Mint a fresh id with `$(c11 mailbox new-id)`.\n>\n> ### Receiving — two equivalent ways\n>\n> **PTY (if `delivery` includes `stdin`):** messages arrive as `<c11-msg>` tags in your input. Handle inline. Dedupe by `id`.\n>\n> **File reads / CLI:**\n> ```\n> c11 mailbox recv --drain     # or: ls \"$(c11 mailbox inbox-dir)\"/*.msg\n> c11 mailbox watch            # live stream (blocks)\n> ```\n>\n> ### Configuring\n>\n> ```\n> c11 mailbox configure --delivery stdin,watch\n> c11 mailbox configure --subscribe \"build.*\"\n> ```\n>\n> ### Debugging\n>\n> ```\n> c11 mailbox trace <id>       # full dispatch story for a message\n> c11 mailbox tail             # live dispatch log\n> ```\n\n---\n\n## 13. What this buys us, what it costs\n\n**Buys:**\n- Filesystem contract is visible, auditable, usable from any process — not just c11-aware agents.\n- Send path has no socket dependency. Atomic file writes survive c11 restarts.\n- At-least-once with explicit dedupe gives a clear contract without a broker's complexity.\n- Handler registry lets new delivery modes land without touching existing surfaces.\n- Recipients own their attention (declared in manifest); senders can only hint.\n- `_dispatch.log` makes every \"why didn't X arrive?\" answerable by `grep`.\n- Parity test + dispatch validation make drift detectable and mostly preventable.\n- Async PTY writes with timeout prevent a single slow recipient from stalling the dispatcher.\n\n**Costs:**\n- Directory layout and envelope schema are load-bearing. Changing them breaks outside callers.\n- XML tag format is expensive to change once shipped.\n- Bodies appear in terminal scrollback for stdin-delivery recipients. Mitigation: 4 KB inline cap; `body_ref` for larger.\n- Two interfaces (CLI + file) must stay in sync. The CLI wrapper has to remain truly thin; the parity test is the lock.\n- fsevent watchers can miss events under edge conditions. Mitigation: 5-second periodic sweep.\n- At-least-once means receivers must handle duplicates. Skill teaches this explicitly.\n\n---\n\n## 14. Open questions\n\nLocked items removed. Remaining items are prototype-discoverable or deferred:\n\n### Prototype-discoverable (lock during Stage 2)\n\n- **Sweep cadence.** 5 s is the lean — validate during prototype under real load. May tune to 2 s if latency pain or 10 s if noise cost.\n- **Processing-directory cleanup on crash recovery.** On c11 start, sweep `_processing/` back into `_outbox/` for redelivery. Safe by construction because receivers dedupe by `id` — but validate the interaction with partial inbox copies during prototype.\n- **ANSI hinting.** Should the framed block include a faint color so humans spot it in scrollback? Stripped before agent parses. Decide during prototype based on terminal ergonomics.\n- **Log-based trace UI.** Should `c11 mailbox trace <id>` be a plain-text dump, structured table, or Mermaid sequence? Prototype a CLI output; keep it simple.\n- **Unnamed-surface fallback.** When a surface has no CMUX-11 name set, fall back to `surface:N` (process-local id) with a warning, so the surface can still participate but the operator sees a nudge to name it.\n- **Workspace teardown.** When a workspace is deleted, remove the mailbox tree synchronously or after a retention grace period? Lean: 7-day grace period (matches inbox retention default).\n\n### Deferred to future security pass\n\n- **Sender identity authentication.** `from` is sender-attested in v1. A misbehaving process within the same user's `$C11_STATE` could spoof. Acceptable for v1 — all parties are the same user. Meaningful attack surface only appears with remote-workspace or cross-user messaging, both out of scope.\n\n### Deferred to v1.1 — design placeholders\n\n- `exec` handler: security model first. Allowlists, env policy, timeout/kill, stdout capture, UI affordance.\n- `webhook` handler: auth, remote-workspace story.\n- Topic discovery: `_topics.json` generation triggers, `mailbox.advertises` field semantics, advertise-conflict policy, description storage.\n- TOON output: spec version pinning, per-command opt-in, skill documentation.\n- Manifest allow/deny lists (`mailbox.allow` / `mailbox.deny`): trust model, UI for operator review.\n- Manifest-level per-sender rate limits.\n\n### Aligned with CMUX-37 (Blueprints + Snapshots)\n\n- When `WorkspaceApplyPlan` lands, it absorbs mailbox config as part of `SurfaceSpec.metadata` with no schema change — the namespaced `mailbox.*` keys are already pane metadata.\n- Blueprint format should document mailbox fields as first-class surface properties.\n- Snapshot restore preserves mailbox config verbatim; in-flight envelopes in `_outbox/` are re-dispatched after restore (receivers dedupe by `id`).\n\n---\n\n## 15. What's next\n\n1. **Prototype Stage 2** — vertical slice of send + recv + stdin handler + inbox queue + dispatch log. No topics, no subscribe. Just prove the primitive. (See ticket C11-13 plan.)\n2. **Parity test first.** Before the CLI is written, stand up the integration test that sends the same payload via raw file write and CLI and asserts equivalent inbox state. This is the drift enforcement.\n3. **Schema + fixtures checked in.** JSON Schema file in the repo, golden valid/invalid envelope fixtures, test harness uses them.\n4. **Full Stage 3** once Stage 2 is battle-tested. Adds manifests, subscribe/fan-out, watch handler, silent handler, body_ref, observability CLI.\n5. **v1.1** adds what's deferred, in priority order based on real usage pain.\n"}, {"id": "mailbox", "live": false, "tab": "mailbox guide", "num": 15, "path": "docs/c11-mailbox-guide.md", "desc": "c11 mailbox guide", "src": "# c11 Mailbox: Agent-to-Agent Messaging Guide\n\nThe c11 mailbox is the in-workspace message board agents use to coordinate. One agent writes a small JSON envelope to a shared outbox; the dispatcher routes it by surface name, drops a copy into the recipient's inbox, and (when configured) injects a framed `<c11-msg>` block straight into the recipient's PTY.\n\nThis is the practical guide. For the agent-facing quick-reference see the \"Inter-agent messaging (mailbox)\" section of `skills/c11/SKILL.md`. For the architectural rationale and v1 design discussion see `docs/c11-messaging-primitive-design.md`. For the wire schema see `spec/mailbox-envelope.v1.schema.json`.\n\n> **Stage 2 status.** Everything in this document describes what ships today. Topic fan-out, the `watch` handler, `_processing/` crash recovery, and per-surface inbox caps are deferred to Stage 3 and called out explicitly where they would otherwise mislead you.\n\n---\n\n## What it is\n\nA per-workspace tree under `~/Library/Application Support/c11/workspaces/<workspace-uuid>/mailboxes/` that holds the outbox, per-recipient inboxes, an append-only dispatch log, and quarantine/processing scratch areas. The c11 process running the workspace owns one `MailboxDispatcher` that watches the outbox and routes whatever shows up.\n\nRecipients can live in **any** workspace, not just the sender's. `c11 mailbox send` resolves the recipient name across every live workspace in the instance and writes the envelope into the recipient workspace's own outbox, so that workspace's dispatcher delivers it locally (see [Cross-workspace routing](#cross-workspace-routing)).\n\n```mermaid\nflowchart LR\n    A[Surface A<br/>builder] -- writes envelope --> OB[(_outbox/)]\n    OB -- fsevent --> D{{Dispatcher}}\n    D -- atomic move --> P[(_processing/)]\n    D -- valid --> IB[(watcher/<br/>inbox)]\n    D -- malformed --> R[(_rejected/<br/>+ .err sidecar)]\n    IB -- stdin handler --> B[Surface B<br/>watcher PTY]\n    D -.appends.-> L[(_dispatch.log<br/>NDJSON)]\n```\n\nTwo facts to internalize:\n\n1. **The filesystem is the contract.** The CLI is convenience over file I/O. Any process that can write a JSON file to a directory can send a message; any process that can list a directory can receive one. The `tests_v2/test_mailbox_parity.py` test asserts CLI sends and raw file writes produce byte-identical envelopes.\n2. **A surface is addressed by a stable handle, falling back to its name.** The resolver matches `to` with precedence **address → role → title** (see [Addressing](#addressing-stable-handles-and-the-title-fallback) below). A surface is addressable as long as it has a `title` (set with `c11 set-title` / `c11 rename-tab`); the optional `mailbox.address` / `mailbox.role` keys give it a rename-proof handle on top.\n\n---\n\n## When to reach for it\n\nUse the mailbox when:\n\n- The operator asks you to coordinate with, hand off to, or notify another pane (\"tell the watcher pane the build is green\", \"ask the reviewer agent to look at PR 73\").\n- A sibling agent needs to act and you are not the right surface to do the work.\n- You want to leave a durable note for a pane that may not be reading right now. The envelope sits in the recipient's inbox until they drain it.\n- Two or more agents need to converge on a result and you want the exchange to be inspectable later (`_dispatch.log` is your audit trail).\n\nDo **not** reach for the mailbox when:\n\n- You and the recipient are the same surface. Just do the work.\n- You need a tight request/response loop measured in milliseconds. The dispatcher is at-least-once, not low-latency.\n- The payload is large. Inline `body` is capped at 4096 UTF-8 bytes; for anything bigger, use `body_ref` with an absolute path the recipient can read.\n- You need fan-out by topic. Stage 2 does not deliver topic-only envelopes.\n\n---\n\n## Quick start\n\n```bash\n# In surface \"builder\":\nc11 set-title \"builder\"\nc11 mailbox send --to watcher --body \"build green sha=abc\"\n\n# In surface \"watcher\":\nc11 set-title \"watcher\"\nc11 set-metadata mailbox.delivery stdin   # opt in to PTY injection\n# The framed block lands in the PTY the next time builder sends — at a shell\n# prompt it injects immediately; if watcher is mid-command it buffers and\n# flushes at the next prompt (see \"Prompt-gated delivery\" below).\nc11 mailbox recv --drain                   # robust floor: pull at turn boundaries\n```\n\nIf `mailbox.delivery` is not set on the recipient, the envelope still lands in `<surface-name>/` inbox; the recipient drains it explicitly with `c11 mailbox recv`. Even with `stdin` set, draining at turn boundaries is the reliable delivery path — push is prompt-gated and best-effort.\n\n---\n\n## Addressing: stable handles and the title fallback\n\nA `--to` value resolves against three per-surface keys, in precedence order:\n\n| Precedence | Key | Set by | Notes |\n|-----------|-----|--------|-------|\n| 1 | `mailbox.address` | the surface, once at orientation | Stable, rename-proof handle. Survives every later `set-title` / `rename-tab`. |\n| 2 | `mailbox.role` | the surface, opt-in | Reach a surface by function (`delegator`, `orchestrator`). Only `mailbox.role` is consulted — the canonical `role` key is not. |\n| 3 | `title` | `set-title` / `rename-tab` | Display name. The fallback, so a bare-name send keeps working for surfaces that declare no stable identity. |\n\n**Why this exists.** The title is mutable, and the c11 orientation convention has every agent rename its tab as its first action. If peers address each other by title, the bus silently re-partitions the moment anyone renames. Declaring a `mailbox.address` at orientation gives a surface an identity that does not move when its display name does.\n\n```bash\n# Recipient, once at orientation:\nc11 set-metadata --surface \"$C11_SURFACE_ID\" --key mailbox.address --value \"delegator-c11-143\" --type string\nc11 set-metadata --surface \"$C11_SURFACE_ID\" --key mailbox.role    --value \"delegator\"         --type string  # optional\n```\n\n**Bare name vs qualifier forms.** A bare `--to <x>` walks the precedence chain (address, then role, then title). To target a specific key unambiguously — never falling back to the title — use a qualifier form:\n\n```bash\nc11 mailbox send --to surface:delegator-c11-143 --body \"…\"   # matches mailbox.address ONLY\nc11 mailbox send --to role:delegator            --body \"…\"   # matches mailbox.role ONLY\nc11 mailbox send --to watcher                   --body \"…\"   # bare: address → role → title\n```\n\nThese `surface:` / `role:` forms select *which surfaces* match; the workspace `--to-workspace` qualifier (below) is an orthogonal axis selecting *which workspace*. The envelope's `to` field stays an opaque string — no schema change — so the framed block a recipient sees carries whatever handle the sender used.\n\n`surface:` and `role:` are **reserved leading tokens** in `--to`: a value beginning with either is always parsed as that qualifier, never as a title. So a surface whose title literally starts with `surface:` or `role:` is not reachable by a bare `--to` (address it by its `mailbox.address`/`mailbox.role` instead). Any other colon stays part of a bare name — `--to ci:status` is a plain name.\n\n**Back-compat.** A surface with only a `title` is addressable by that title exactly as before. `mailbox.address` / `mailbox.role` are additive; the inbox directory is still keyed on the recipient's title.\n\n---\n\n## Send flow\n\n```mermaid\nsequenceDiagram\n    participant A as Sender surface\n    participant FS as _outbox/ → inbox\n    participant B as Recipient surface\n\n    A->>FS: c11 mailbox send --to B\n    FS->>B: dispatcher routes by surface name\n    Note over B: framed <c11-msg> appears in PTY<br/>(or sits in inbox until drained)\n```\n\nUnder the hood the dispatcher validates the envelope against schema v1, resolves the recipient by the address → role → title precedence (see [Addressing](#addressing-stable-handles-and-the-title-fallback)), copies into the recipient's inbox, and runs each registered delivery handler. Every state transition appends to `_dispatch.log` (NDJSON). Malformed envelopes land in `_rejected/` with a `.err` sidecar describing what failed. See [Internals: full send sequence](#internals-full-send-sequence) at the bottom for the complete step-by-step.\n\n### Two equivalent send paths\n\nBoth must produce byte-identical JSON. The parity test enforces this.\n\n**CLI (recommended for agents):**\n\n```bash\nc11 mailbox send --to watcher --body \"build green sha=abc\"\nc11 mailbox send --to watcher --topic ci.status --urgent --body \"CI red\" \\\n  --reply-to builder --in-reply-to 01K3A2B7X8PQRTVWYZ0123456J\n```\n\nAuto-fills `version`, `id` (fresh ULID), `ts` (current UTC), and `from` (the caller's surface title resolved over the socket). Prints the new envelope id on stdout.\n\nSend flags accepted by the CLI:\n\n| Flag                  | Purpose                                                            |\n|-----------------------|--------------------------------------------------------------------|\n| `--to <surface>`      | Recipient handle, in any workspace. Bare name resolves address → role → title; `surface:<addr>` / `role:<name>` target one key. Required in Stage 2 (topic-only rejected). |\n| `--to-workspace <ref>`| Disambiguate a name that exists in more than one workspace. A workspace UUID or `workspace:*` ref. |\n| `--topic <token>`     | Dotted topic. Stored on the envelope; not used for routing yet.    |\n| `--body <text>`       | Inline body, ≤ 4096 bytes UTF-8.                                   |\n| `--body-ref <path>`   | Absolute path to an external body. `--body` must be empty.         |\n| `--reply-to <surface>`| Surface that should receive the reply.                             |\n| `--in-reply-to <id>`  | ULID of the envelope being answered.                               |\n| `--urgent`            | Sender hint. Handlers may honor or ignore.                         |\n| `--ttl-seconds <n>`   | Advisory expiry. Recipients may drop expired envelopes on read.    |\n| `--from <surface>`    | Override caller's resolved title.                                  |\n| `--id <ulid>`         | Pin envelope id (testing / replay).                                |\n| `--ts <rfc3339>`      | Pin timestamp (testing / replay).                                  |\n| `--content-type <m>`  | MIME hint for body or body_ref.                                    |\n\n**Raw file write (any process, any language):**\n\n```bash\nOUTBOX=$(c11 mailbox outbox-dir)\nMY_NAME=$(c11 mailbox surface-name)\nULID=$(c11 mailbox new-id)\ncat > \"$OUTBOX/.$ULID.tmp\" <<EOF\n{\"version\":1,\"id\":\"$ULID\",\"from\":\"$MY_NAME\",\"to\":\"watcher\",\"ts\":\"$(date -u +%FT%TZ)\",\"body\":\"build green sha=abc\"}\nEOF\nmv \"$OUTBOX/.$ULID.tmp\" \"$OUTBOX/$ULID.msg\"\n```\n\nThe dispatcher only sees files that match `*.msg` and do not start with `.`. Always write to a dot-prefixed `.tmp` sibling first and rename. A canonical reference lives at `Resources/bin/c11-mailbox-send-bash-example.sh`.\n\n> **Raw writers are workspace-local.** `outbox-dir` prints *your own* workspace's outbox, and a dispatcher only resolves names within its own workspace. So a raw file write reaches only recipients in your workspace. To deliver across workspaces, use `c11 mailbox send` (which resolves globally and routes for you) — or write into the recipient workspace's outbox directly. A raw envelope whose `to` matches nobody in that workspace is **rejected**, not silently dropped (see below).\n\n---\n\n## Cross-workspace routing\n\n`c11 mailbox send` resolves `--to` against every live surface in the running c11 instance, then writes the envelope into the **recipient's** workspace outbox. The recipient workspace's own dispatcher picks it up and delivers locally — same machinery as a same-workspace send, just a different outbox. The `from` field still names the sender; the dispatch trail lands in the recipient workspace's `_dispatch.log`.\n\nResolution precedence is deterministic:\n\n1. **Local-first.** If the name matches a surface in *your* workspace, it is delivered there — a same-workspace send never reaches into another workspace, even if a same-named surface exists elsewhere. Existing same-workspace behavior is unchanged.\n2. Otherwise, among the other workspaces: exactly one match → delivered there; **more than one workspace** has the name → the send fails with an *ambiguous* error listing the candidate workspaces; no match anywhere → the send fails *unresolved* with a non-zero exit (the message is not written).\n\n**Name collisions across workspaces** (two surfaces both named `Builder` in different workspaces) are resolved by qualifying with `--to-workspace <ref>`:\n\n```bash\nc11 mailbox send --to Builder --to-workspace workspace:4 --body \"go\"\n```\n\nMultiple same-named surfaces *within one* workspace still fan out to all of them (unchanged) — that case is unique, not ambiguous.\n\nIf the c11 socket is unreachable, `send` falls back to writing into your own workspace's outbox so same-workspace delivery still works offline; cross-workspace recipients then surface as a dispatcher *rejection* rather than a silent drop.\n\n---\n\n## Receive flow\n\nThere are two receive modes. Which one fires depends on the recipient's `mailbox.delivery` metadata.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant D as Dispatcher\n    participant Inbox as <surface-name>/<br/>inbox\n    participant SH as stdin handler\n    participant PTY as Recipient PTY\n    participant Agent as Recipient agent\n\n    D->>Inbox: atomic write ULID.msg\n    alt mailbox.delivery contains \"stdin\"\n        D->>SH: deliver(envelope, surfaceId)\n        SH->>SH: format <c11-msg> block (XML-escape attrs + body)\n        alt recipient shell at promptIdle\n            SH->>PTY: inject block now on @MainActor\n            PTY-->>Agent: \\n<c11-msg ...>body<\/c11-msg>\\n appears at the prompt\n            Agent->>Agent: dedupe by id, treat as system message\n        else commandRunning / unknown (busy)\n            SH->>SH: buffer block (log \"buffered\")\n            Note over PTY: shell later returns to promptIdle\n            SH->>PTY: flush fresh buffered blocks FIFO (log \"flushed\")\n        end\n    else delivery unset / silent\n        Note over Agent: Inbox file sits until drained\n    end\n    Note over Agent: pull at every turn boundary — the robust floor\n    Agent->>Inbox: c11 mailbox recv --drain\n    Inbox-->>Agent: prints + unlinks each .msg\n```\n\n### When the framed block arrives in your PTY\n\nIf your `mailbox.delivery` includes `stdin`, you will see this between prompts:\n\n```\n<c11-msg from=\"builder\" id=\"01K3A2B7X8PQRTVWYZ0123456J\" ts=\"2026-04-23T10:15:42Z\" to=\"watcher\">\nbuild green sha=abc\n<\/c11-msg>\n```\n\nReceive protocol:\n\n- Finish the tool call you are in. Do not interrupt yourself mid-thought.\n- Treat the block as a system message, not user input. The operator did not type it.\n- Dedupe by `id`. Dispatch is at-least-once, so receivers MUST tolerate duplicates.\n- If you reply, send to `reply_to` (fall back to `from`) with `in_reply_to` set to the original id.\n\n### Prompt-gated delivery (the stdin doorbell is safe, not eager)\n\nc11 never pastes a `<c11-msg>` block into a PTY that has a foreground command running — that would corrupt the command's input stream (a build's stdin, a `vim` buffer, a REPL, or another agent's raw-mode input). Delivery gates on the recipient surface's already-tracked shell activity state (the same `promptIdle / commandRunning / unknown` signal c11 uses for close-confirmation):\n\n| Recipient shell state | Push behavior |\n|-----------------------|---------------|\n| `promptIdle` (at a prompt) | inject the block immediately |\n| `commandRunning` (a foreground command owns the terminal) | **buffer**, flush at the next prompt |\n| `unknown` (no shell-integration signal) | **buffer** (conservative — never corrupt on a guess) |\n\nBuffered blocks flush in FIFO order the moment the surface transitions back to `promptIdle`. Each step is recorded in `_dispatch.log` (`buffered` → `flushed`), so `c11 mailbox trace <id>` shows the full path — a buffered message is delayed, never silently dropped.\n\n**Bounds.** Each surface buffers up to 64 blocks (oldest evicted past that, logged `evicted`). A buffered block older than a 10-minute freshness window at flush time is dropped (logged `expired`) rather than injected — this stops a long-lived agent TUI, whose shell stays `commandRunning` for its entire life, from dumping stale `<c11-msg>` blocks onto a bare shell hours later when it finally exits. Evicted/expired blocks remain in the filesystem inbox; `recv --drain` is their floor.\n\n**Why you still pull.** Because a live agent keeps its shell `commandRunning`, stdin push into a busy agent typically buffers and may never flush in time. The filesystem inbox copy is written *before* any push is attempted, so `c11 mailbox recv --drain` at every turn boundary is the delivery path that always works. Treat stdin push as a best-effort doorbell; treat the pull cadence as the contract.\n\n### Explicit inbox drain\n\n```bash\nc11 mailbox recv --drain    # default: list, print, unlink\nc11 mailbox recv --peek     # list + print only, leave files in place\nc11 mailbox recv --surface watcher --drain   # drain on someone else's behalf\n```\n\nFiles are sorted lexicographically by ULID, which gives you near-chronological order across a single sender.\n\n### Exact PTY frame shape\n\nThe stdin handler emits attributes in a fixed order so tests can pin the byte form. Order: `from`, `id`, `ts`, `to`, `topic`, `reply_to`, `in_reply_to`, `urgent`, `ttl_seconds`. Optional attributes are omitted when unset.\n\n| Layer            | Escaped characters    |\n|------------------|-----------------------|\n| Attribute values | `<`, `>`, `&`, `\"`    |\n| Body text        | `<`, `>`, `&`         |\n\nA literal `<\/c11-msg>` in the body cannot forge a closing tag because `<` is escaped on write.\n\n---\n\n## Envelope lifecycle\n\n```mermaid\nstateDiagram-v2\n    [*] --> Outbox: atomic write ULID.msg\n    Outbox --> Processing: dispatcher moveItem\n    Processing --> Rejected: validation fails\n    Processing --> Resolved: validate ok\n    Resolved --> Rejected: to matches no live surface\n    Resolved --> Copied: per recipient inbox\n    Copied --> HandlerRun: per delivery handler\n    HandlerRun --> Cleaned: remove from _processing/\n    Rejected --> [*]: .err sidecar written\n    Cleaned --> [*]\n    note right of Outbox\n        Dot-prefixed *.tmp files\n        older than 5 min are GC'd\n        every 60 s.\n    end note\n```\n\nThe `received → resolved → copied → handler → cleaned` sequence shows up as discrete NDJSON lines in `_dispatch.log`. The `rejected` branch is the alternate terminal state and writes a `<id>.err` sibling explaining what failed. A well-formed envelope whose `to` resolves to **no live surface** in the dispatching workspace takes the `rejected` branch too (reason: `no live surface named '<to>' …`) — an undeliverable message is quarantined with its sidecar, never silently cleaned.\n\n---\n\n## Multi-recipient fan-out\n\nStage 2 fan-out happens two ways. **Topic-driven fan-out is not one of them.**\n\n### 1. Multiple handlers per recipient\n\n`mailbox.delivery` is a comma-separated list. The dispatcher invokes each handler in order on the same envelope.\n\n```bash\nc11 set-metadata mailbox.delivery stdin,silent\n```\n\n`stdin` injects the framed block into the PTY; `silent` is a no-op that just records `ok` in the dispatch log. The handler set registered in production is exactly `{stdin, silent}`. Anything else logged as `eio` with reason \"unknown handler\".\n\n### 2. Multiple surfaces sharing the same name\n\nIf two live surfaces both have `title = \"watcher\"`, the resolver returns both. The dispatcher copies the envelope into each surface's inbox and runs each surface's handler chain.\n\n```mermaid\nflowchart TB\n    S[builder sends to:watcher] --> D{Dispatcher}\n    D --> R[Resolver]\n    R --> M{name == 'watcher'?}\n    M -- match --> W1[surface w1<br/>title=watcher<br/>delivery=stdin]\n    M -- match --> W2[surface w2<br/>title=watcher<br/>delivery=stdin,silent]\n    W1 --> I1[(w1 inbox)]\n    W2 --> I2[(w2 inbox)]\n    W1 --> H1[stdin handler]\n    W2 --> H2a[stdin handler]\n    W2 --> H2b[silent handler]\n```\n\nSame-name fan-out is tolerated rather than designed-for. The resolver's doc comment notes \"in practice 0 or 1; we tolerate duplicates by returning a list.\" Use it deliberately if you want broadcast to a named pool, and expect ordering across the recipients to be unspecified.\n\n### Topic fan-out (Stage 3)\n\n`c11 mailbox send --topic ci.status` without `--to` is **rejected at the CLI** with `topics_not_implemented`. A topic-only envelope written via raw file would be accepted by the validator but resolve to zero recipients (the `resolved` log line records an empty list). Always pair `--topic` with `--to <surface>` until Stage 3 wires `mailbox.subscribe` globs into the resolver.\n\n---\n\n## Envelope schema (v1, locked)\n\n| Field          | Type    | Required | Constraint                                                    |\n|----------------|---------|----------|---------------------------------------------------------------|\n| `version`      | integer | yes      | Must be `1` (literal integer, not string).                    |\n| `id`           | string  | yes      | Crockford base32 ULID, 26 chars (no I/L/O/U).                 |\n| `from`         | string  | yes      | Sender surface name. Non-empty, ≤ 256 bytes.                  |\n| `ts`           | string  | yes      | RFC3339 UTC with `Z` suffix. Sender-attested, NOT ordering.   |\n| `body`         | string  | yes      | UTF-8 ≤ 4096 bytes. Must be `\"\"` when `body_ref` is set.      |\n| `to`           | string  | one of   | Recipient surface name. ≤ 256 bytes.                          |\n| `topic`        | string  | one of   | Dotted token `^[A-Za-z0-9_][A-Za-z0-9_.\\-]*$`. ≤ 256 bytes.   |\n| `reply_to`     | string  | no       | Surface name to reply to. Non-empty, ≤ 256 bytes.             |\n| `in_reply_to`  | string  | no       | ULID of the envelope being replied to.                        |\n| `urgent`       | boolean | no       | Sender hint.                                                  |\n| `ttl_seconds`  | integer | no       | ≥ 1. Advisory; recipients may drop expired envelopes on read. |\n| `body_ref`     | string  | no       | Absolute path (must start with `/`).                          |\n| `content_type` | string  | no       | MIME hint, ≤ 128 bytes.                                       |\n| `ext`          | object  | no       | Forward-compat escape hatch. Any keys allowed under `ext`.    |\n\n`additionalProperties: false` at the top level. Any unknown key triggers `unknownTopLevelKey` rejection. Use `ext` for forward-compat experimentation.\n\n---\n\n## Dispatch log: `_dispatch.log`\n\nNewline-delimited JSON, one event per line, append-only. Every event carries an ISO8601 UTC `ts` (with fractional seconds) plus the fields listed below.\n\n| Event       | Fields                                                              |\n|-------------|---------------------------------------------------------------------|\n| `received`  | `id`, `from`, `to?`, `topic?`                                       |\n| `resolved`  | `id`, `recipients[]` (surface names; can be empty)                  |\n| `copied`    | `id`, `recipient`                                                   |\n| `handler`   | `id`, `recipient`, `handler`, `outcome`, `bytes?`, `elapsed_ms?`    |\n| `rejected`  | `id?`, `reason`                                                     |\n| `cleaned`   | `id`                                                                |\n| `gc`        | `temp_files_removed`                                                |\n| `replayed`  | `id` (declared in the event enum; not emitted in Stage 2)           |\n\nHandler outcomes: `ok`, `timeout`, `eio`, `closed`, plus the C11-144 stdin delivery-safety lifecycle `buffered`, `flushed`, `expired`, `evicted` (all emitted as `handler` events with `handler = \"stdin\"`, so a buffered message's full path is traceable). (`epipe` was declared in early drafts and removed in P0 #6 because nothing emits it.) `timeout` is a reporting bound, not a runtime cancellation: the dispatcher logs after 2 s and moves on, but the handler closure may still be running.\n\n| stdin outcome | Meaning |\n|---------------|---------|\n| `buffered`    | recipient shell was busy; block queued to flush at the next prompt |\n| `flushed`     | a previously-buffered block was injected once the shell went idle |\n| `expired`     | a buffered block aged past the freshness window; dropped (inbox floor holds it) |\n| `evicted`     | a buffered block dropped because the per-surface cap was exceeded (inbox floor holds it) |\n\n```bash\nc11 mailbox tail                              # follow log as it grows\nc11 mailbox trace 01K3A2B7X8PQRTVWYZ0123456J  # filter for one envelope id\n```\n\n---\n\n## Patterns\n\n### Request / reply\n\n```bash\n# builder\nREQ_ID=$(c11 mailbox send --to reviewer --body \"review sha=abc\")\n\n# reviewer (after work)\nc11 mailbox send --to builder --in-reply-to \"$REQ_ID\" --body \"lgtm\"\n```\n\nSetting `--reply-to` is only necessary when the reply should land somewhere other than the original sender's surface.\n\n### Durable handoff\n\nA surface that may not exist yet still gets its inbox created on first delivery. Send to `archivist`; when an archivist surface is later created with `title = archivist`, it can drain the queued envelopes:\n\n```bash\nc11 mailbox recv --drain\n```\n\nInboxes survive c11 restarts; envelopes sitting in the outbox at restart are picked up by the dispatcher's initial scan.\n\n### Fire-and-forget notification\n\nSet the recipient's `mailbox.delivery` to `silent` if you want a logged delivery without PTY noise. The envelope is copied to the inbox and the silent handler logs `ok`. Useful for status broadcasts where the recipient polls or analyzes asynchronously.\n\n### Larger payloads\n\nInline `body` is capped at 4096 bytes. For bigger content, write the bytes elsewhere and reference them:\n\n```bash\nc11 mailbox send --to reviewer --body-ref /tmp/diff.patch --body \"\"\n```\n\nThe dispatcher stores `body_ref` on the envelope and routes normally. Reading the external body is the recipient's responsibility in Stage 2; nothing dereferences it for you.\n\n---\n\n## Anti-patterns\n\n- **Tight loops over the mailbox.** It is at-least-once with fsevent latency and a 2 s outer handler timeout. Use it for coordination, not for hot RPC.\n- **Assuming order across senders.** `ts` is sender-attested, not an ordering field. Lexicographic ULID order roughly tracks per-sender wall clock, but two senders racing the outbox can interleave arbitrarily.\n- **Putting huge payloads inline.** Anything past 4096 UTF-8 bytes is rejected at the CLI (and would be rejected by the validator). Use `body_ref` and let the recipient open the file.\n- **Sending topic-only envelopes via raw file.** They will be accepted by the validator and silently resolve to zero recipients. The CLI rejects this for you; the raw path does not.\n- **Editing files in `_processing/` or `_rejected/`.** The dispatcher owns those directories. `_processing/` is mid-flight scratch; `_rejected/` is forensic state plus a `.err` sidecar.\n- **Treating absent `mailbox.delivery` as \"no message\".** If the recipient never set `mailbox.delivery`, envelopes still land in their inbox. They just do not get pushed into the PTY. Drain explicitly or set `mailbox.delivery=stdin`.\n\n---\n\n## Debug & introspect\n\n```bash\nc11 mailbox outbox-dir                         # absolute path of caller's outbox\nc11 mailbox inbox-dir                          # absolute path of caller's inbox\nc11 mailbox inbox-dir --surface watcher        # someone else's inbox\nc11 mailbox surface-name                       # caller's resolved title\nc11 mailbox new-id                             # fresh ULID for raw-file writers\nc11 mailbox tail                               # follow _dispatch.log\nc11 mailbox trace <id>                         # all log lines for <id>, across every workspace\nls \"$(c11 mailbox outbox-dir)/../_rejected\"    # what bounced and why\n```\n\nA rejected envelope leaves both `<id>.msg` and `<id>.err` in `_rejected/`. The `.err` file is the validator's error description (`unknown top-level key 'foo'`, `body too large`, etc.). Schema rules live in `Sources/Mailbox/MailboxEnvelope.swift` and the matching JSON Schema at `spec/mailbox-envelope.v1.schema.json`.\n\n---\n\n## Stage 2 limits and the Stage 3 roadmap\n\nWhat does not work yet (and how the system fails when you try):\n\n| Limitation                              | What you see today                                                       |\n|-----------------------------------------|--------------------------------------------------------------------------|\n| Topic subscribe / fan-out               | CLI rejects `--topic` without `--to`. Raw-file topic-only resolves to 0. |\n| `c11 mailbox watch` handler             | CLI throws \"watch not implemented in Stage 2; use tail.\"                 |\n| `_processing/` crash recovery           | Envelopes stranded mid-dispatch by a c11 crash stay in `_processing/`.   |\n| Per-surface inbox caps                  | None. A slow drainer can accumulate envelopes without limit.             |\n| `body_ref` read-through                 | Schema accepts it, dispatcher stores it; recipient must read the file.   |\n| Real PTY write-error propagation        | `stdin` handler returns `ok` whenever `sendText` returns. EIO not surfaced.|\n| `c11 mailbox configure` convenience     | Use `c11 set-metadata mailbox.delivery stdin` directly.                  |\n\nWhat is steady-state durable today:\n\n- Envelopes sitting in `_outbox/` when c11 restarts are picked up by the dispatcher's initial scan.\n- The atomic `.tmp → .msg` rename means a writer crash leaves a dot-prefixed temp file that the GC sweep deletes 5 minutes later.\n- Inbox copies are atomic writes; a dispatcher crash mid-copy leaves either nothing or the full file.\n\n---\n\n## Internals: full send sequence\n\nFor maintainers and people debugging a stuck envelope. Not needed to use the mailbox — the three-box diagram in [Send flow](#send-flow) is the user contract.\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant Sender as Sender agent\n    participant CLI as c11 mailbox send\n    participant FS as _outbox/\n    participant W as Outbox watcher\n    participant D as Dispatcher\n    participant Proc as _processing/\n    participant V as Envelope validator\n    participant Res as Surface resolver\n    participant Inbox as recipient inbox\n    participant H as Handlers (stdin/silent)\n    participant Log as _dispatch.log\n\n    Sender->>CLI: --to watcher --body \"...\"\n    CLI->>CLI: resolve caller via CMUX_SURFACE_ID + surface.get_metadata\n    CLI->>CLI: build + validate envelope (schema v1)\n    CLI->>FS: write .ULID.tmp, then rename to ULID.msg (atomic)\n    FS-->>W: fsevent (or initial scan on dispatcher start)\n    W->>D: new .msg URL\n    D->>Proc: atomic move .msg -> _processing/\n    D->>V: validate bytes\n    alt valid\n        V-->>D: envelope\n        D->>Log: received {id, from, to, topic}\n        D->>Res: surfacesWithMailboxMetadata()\n        Res-->>D: list of live surfaces filtered by name == to\n        D->>Log: resolved {id, recipients[]}\n        loop per recipient\n            D->>Inbox: atomic write envelope copy\n            D->>Log: copied {id, recipient}\n        end\n        loop per recipient, per handler in mailbox.delivery\n            D->>H: invoke (2 s outer timeout)\n            H-->>D: ok | timeout | closed | eio\n            D->>Log: handler {id, recipient, handler, outcome, bytes?, elapsed_ms?}\n        end\n        D->>Proc: remove .msg\n        D->>Log: cleaned {id}\n    else invalid\n        D->>FS: move to _rejected/<id>.msg + write .err sidecar\n        D->>Log: rejected {id?, reason}\n    end\n```\n\n`Envelope validator` and `Surface resolver` are methods on the dispatcher, drawn here as separate participants for clarity. `_dispatch.log` is a side effect of every state transition rather than a true peer. `_processing/` is the dispatcher's claim zone — file moves here while in flight, removed on success, currently leaks on c11 crash (Stage 3 ships the recovery sweep).\n\n---\n\n## Where the code lives\n\n| Concern                           | File                                            |\n|-----------------------------------|-------------------------------------------------|\n| Envelope schema (machine)         | `spec/mailbox-envelope.v1.schema.json`          |\n| Envelope build + validate         | `Sources/Mailbox/MailboxEnvelope.swift`         |\n| Filesystem layout + path helpers  | `Sources/Mailbox/MailboxLayout.swift`           |\n| Atomic write helper               | `Sources/Mailbox/MailboxIO.swift`               |\n| ULID generator                    | `Sources/Mailbox/MailboxULID.swift`             |\n| Outbox fsevent watcher            | `Sources/Mailbox/MailboxOutboxWatcher.swift`    |\n| Surface-name resolver             | `Sources/Mailbox/MailboxSurfaceResolver.swift`  |\n| Dispatcher (orchestrator)         | `Sources/Mailbox/MailboxDispatcher.swift`       |\n| Dispatch log NDJSON               | `Sources/Mailbox/MailboxDispatchLog.swift`      |\n| `stdin` handler (PTY injection)   | `Sources/Mailbox/StdinMailboxHandler.swift`     |\n| Production handler registration   | `Sources/Workspace.swift` `startMailboxDispatcher()` |\n| CLI subcommand                    | `CLI/c11.swift` `runMailboxCommand` (~17248)    |\n| Bash example                      | `Resources/bin/c11-mailbox-send-bash-example.sh`|\n| Parity test (CLI vs raw)          | `tests_v2/test_mailbox_parity.py`               |\n| Swift unit tests                  | `c11Tests/Mailbox*Tests.swift`                  |\n| Design doc (RFC)                  | `docs/c11-messaging-primitive-design.md`        |\n| CMUX-37 alignment                 | `docs/c11-13-cmux-37-alignment.md`              |\n"}, {"id": "browser", "live": false, "tab": "browser port spec", "num": 16, "path": "docs/agent-browser-port-spec.md", "desc": "agent-browser port spec", "src": "# Agent-Browser Port Spec\n\nLast updated: February 13, 2026  \nSource inventory snapshot: `vercel-labs/agent-browser` @ `03a8cb9`\n\nThis document tracks implemented behavior and remaining parity gaps for the cmux browser port.\n\n## Goals\n\n1. Provide an LLM-friendly browser automation API in cmux with stable handles.\n2. Keep v1 CLI/socket behavior working while v2 reaches full parity.\n3. Port `agent-browser` command surface (where meaningful for `WKWebView`).\n4. Ensure move/reorder operations preserve `surface_id` identity.\n5. Rebuild/port tests so both v1 and v2 suites pass before deprecating v1.\n\n## Validation Status\n\nAs of February 12, 2026:\n1. `./scripts/run-tests-v1.sh` passes on `cmux-vm`.\n2. `./scripts/run-tests-v2.sh` passes on `cmux-vm`.\n3. Browser parity suites passing in v2: `test_browser_api_comprehensive.py`, `test_browser_api_p0.py`, `test_browser_api_extended_families.py`, `test_browser_api_unsupported_matrix.py`, and `test_browser_cli_agent_port.py`.\n4. Visual suite note: `tests/test_visual_screenshots.py` and `tests_v2/test_visual_screenshots.py` both report D12 (`Nested: Close Top of T-shape`) as a known non-blocking VM failure when it reproduces (`VIEW_DETACHED`).\n\n## Concepts (Canonical Terms)\n\n1. `window`: native macOS window.\n2. `workspace`: sidebar entry within a window (often called \"tab\" in UI).\n3. `pane`: split region inside a workspace.\n4. `surface`: tab within a pane (terminal or browser). This is the primary automation target.\n5. `panel`: internal implementation term; CLI/API should prefer `surface`.\n\nTerminology decision:\n- Public v2 API and new CLI docs should standardize on `surface` and `pane`.\n- Keep `--panel` as compatibility alias in CLI until v1 is retired.\n\n## Self-Identify Requirement\n\n`system.identify` is the canonical \"where am I?\" call for agents and should remain first-class.\n\nRequired response fields for agent workflows:\n1. `focused.window_id`\n2. `focused.workspace_id`\n3. `focused.pane_id`\n4. `focused.surface_id`\n5. `caller` validation result when caller context is supplied\n\nRecommended extension for browser workflows:\n1. `focused.surface_type`\n2. `focused.browser.url`\n3. `focused.browser.title`\n4. `focused.browser.loading`\n\n## Agent-Browser Command Inventory\n\n### Top-Level CLI Verbs (from `cli/src/commands.rs`)\n\n1. `open|goto|navigate`\n2. `back`\n3. `forward`\n4. `reload`\n5. `click`\n6. `dblclick`\n7. `fill`\n8. `type`\n9. `hover`\n10. `focus`\n11. `check`\n12. `uncheck`\n13. `select`\n14. `drag`\n15. `upload`\n16. `download`\n17. `press|key`\n18. `keydown`\n19. `keyup`\n20. `scroll`\n21. `scrollintoview|scrollinto`\n22. `wait`\n23. `screenshot`\n24. `pdf`\n25. `snapshot`\n26. `eval`\n27. `close|quit|exit`\n28. `connect`\n29. `get`\n30. `is`\n31. `find`\n32. `mouse`\n33. `set`\n34. `network`\n35. `storage`\n36. `cookies`\n37. `tab`\n38. `window`\n39. `frame`\n40. `dialog`\n41. `trace`\n42. `record`\n43. `console`\n44. `errors`\n45. `highlight`\n46. `state`\n47. `tap`\n48. `swipe`\n49. `device`\n\n### CLI Subcommands\n\n1. `get`: `text|html|value|attr|url|title|count|box|styles`\n2. `is`: `visible|enabled|checked`\n3. `find`: `role|text|label|placeholder|alt|title|testid|first|last|nth`\n4. `mouse`: `move|down|up|wheel`\n5. `set`: `viewport|device|geo|geolocation|offline|headers|credentials|auth|media`\n6. `network`: `route|unroute|requests`\n7. `storage`: `local|session` + `get|set|clear`\n8. `cookies`: default get, plus `set|clear`\n9. `tab`: default list, plus `new|list|close|<index>`\n10. `window`: `new`\n11. `frame`: `<selector>|main`\n12. `dialog`: `accept|dismiss`\n13. `trace`: `start|stop`\n14. `record`: `start|stop|restart`\n15. `state`: `save|load`\n16. `device`: `list`\n\n### Global Flags\n\n1. `--json`\n2. `--full|-f`\n3. `--headed`\n4. `--debug`\n5. `--session`\n6. `--headers`\n7. `--executable-path`\n8. `--extension` (repeatable)\n9. `--cdp`\n10. `--profile`\n11. `--state`\n12. `--proxy`\n13. `--proxy-bypass`\n14. `--args`\n15. `--user-agent`\n16. `-p|--provider`\n17. `--ignore-https-errors`\n18. `--allow-file-access`\n19. `--device`\n\n### Protocol Actions in `src/protocol.ts`\n\nCounts:\n1. total actions: 125\n2. directly emitted by CLI parser: 93\n3. protocol-only (not directly emitted by CLI parser): 32\n\nProtocol-only action names:\n1. `addinitscript`\n2. `addscript`\n3. `addstyle`\n4. `bringtofront`\n5. `clear`\n6. `clipboard`\n7. `content`\n8. `dispatch`\n9. `evalhandle`\n10. `expose`\n11. `har_start`\n12. `har_stop`\n13. `innertext`\n14. `input_keyboard`\n15. `input_mouse`\n16. `input_touch`\n17. `inserttext`\n18. `keyboard`\n19. `locale`\n20. `multiselect`\n21. `pause`\n22. `permissions`\n23. `responsebody`\n24. `screencast_start`\n25. `screencast_stop`\n26. `selectall`\n27. `setcontent`\n28. `setvalue`\n29. `timezone`\n30. `useragent`\n31. `video_start`\n32. `video_stop`\n\n## cmux Target API (v2)\n\n### Already Present in cmux\n\n1. `system.ping`\n2. `system.capabilities`\n3. `system.identify`\n4. `window.list|current|focus|create|close`\n5. `workspace.list|create|select|current|close|move_to_window`\n6. `pane.list|focus|surfaces|create`\n7. `surface.list|focus|split|create|close|drag_to_split|refresh|health|send_text|send_key|trigger_flash`\n8. `browser.open_split|navigate|back|forward|reload|url.get|focus_webview|is_webview_focused`\n9. notification methods and debug/test methods\n\n### New Browser Parity Method Families (Proposed)\n\nP0 (core parity for daily automation):\n1. `browser.snapshot`\n2. `browser.eval`\n3. `browser.wait`\n4. `browser.click`\n5. `browser.dblclick`\n6. `browser.type`\n7. `browser.fill`\n8. `browser.press|keydown|keyup`\n9. `browser.hover|focus`\n10. `browser.check|uncheck`\n11. `browser.select`\n12. `browser.scroll|scroll_into_view`\n13. `browser.get.*` (`url|title|text|html|value|attr|count|box|styles`)\n14. `browser.is.*` (`visible|enabled|checked`)\n15. `browser.screenshot`\n16. `browser.focus_webview` and `browser.is_webview_focused` (already present, keep)\n\nP1 (important but not blocking initial parity):\n1. `browser.find.*` locators (`role|text|label|placeholder|alt|title|testid|nth|first|last`)\n2. `browser.frame.select`\n3. `browser.frame.main`\n4. `browser.dialog.respond`\n5. `browser.download.wait`\n6. `browser.tab.*` compatibility aliases mapped to cmux surfaces\n7. `browser.console.list`\n8. `browser.errors.list`\n9. `browser.highlight`\n10. `browser.state.save|load` (browser state in cmux context)\n\nP2 (advanced parity / optional):\n1. network interception/mocking equivalents (`route|unroute|requests|responsebody`)\n2. emulation/settings (`viewport|media|offline|geolocation|permissions|headers|credentials|useragent|locale|timezone|device`)\n3. trace/video/screencast/har equivalents\n4. script injection utilities (`addinitscript|addscript|addstyle|dispatch|expose|evalhandle`)\n5. raw input device injection (`input_mouse|input_keyboard|input_touch`)\n\n### Object/Handle Semantics\n\n1. stable handles: `window_id`, `workspace_id`, `pane_id`, `surface_id`\n2. browser refs (`@e1`) are session-local and ephemeral\n3. move/reorder must preserve `surface_id`\n4. responses may include `index` for debugging/order, but requests should accept IDs\n\n## CLI Spec (Proposed)\n\nPrimary form:\n```bash\ncmux browser --surface <surface-id> <agent-browser-style-command...>\n```\n\nShorthand:\n```bash\ncmux browser <surface-id> <agent-browser-style-command...>\n```\n\nAgent discovery:\n```bash\ncmux identify\ncmux capabilities\ncmux browser identify --surface <surface-id>   # wrapper over system.identify + browser fields\n```\n\nFlash:\n```bash\ncmux trigger-flash [--workspace <id>] [--surface <id>]\n```\n\nCompatibility:\n1. Keep v1 commands.\n2. Add v1->v2 shim for migrated browser/surface commands.\n3. Keep `--panel` as alias for `--surface` during migration.\n\n## Move/Reorder Spec (Required)\n\nRequired capabilities:\n1. reorder surfaces within a pane\n2. move surfaces between panes in same workspace\n3. move surfaces across workspaces\n4. move surfaces across windows\n5. reorder workspaces within window\n\nProposed methods:\n1. `surface.move` with `surface_id` + destination (`pane_id` or `workspace_id`/`window_id`) + placement (`before_surface_id|after_surface_id|start|end`)\n2. `surface.reorder` with `surface_id` + sibling anchor (`before_surface_id|after_surface_id`)\n3. `workspace.reorder` with `workspace_id` + anchor (`before_workspace_id|after_workspace_id`)\n\nHard invariant:\n1. `surface_id` must remain unchanged after all move/reorder operations.\n\n## Comprehensive TODO\n\n### Phase 0: Contract + Routing\n\n- [x] Lock method names/payload schemas for all new `browser.*` methods.\n- [x] Add schema validation for each new method with strict error codes (`invalid_params`, `not_found`, `invalid_state`).\n- [x] Add `browser` command group in `CLI/cmux.swift` that accepts agent-browser-style command grammar.\n- [x] Add `--surface` mandatory targeting (with fallback from `system.identify` when explicitly desired).\n- [x] Add consistent JSON output mode for all browser commands.\n- [x] Implement short-ref allocator and resolver for `window/pane/workspace/surface` (`window:N`, `workspace:N`, `pane:N`, `surface:N`).\n- [x] Add `--id-format refs|uuids|both` across relevant CLI commands (`--json` default refs, plain-text default refs).\n- [x] Ensure browser placement APIs always return decision-rich metadata (resolved target pane, created splits, resulting handles).\n\n### Phase 1: Core Browser Parity (P0)\n\n- [x] Implement `browser.snapshot` (with refs).\n- [x] Implement `browser.eval`.\n- [x] Implement `browser.wait` variants: selector, timeout, URL pattern, load state, function, text.\n- [x] Implement click family: `click`, `dblclick`, `hover`, `focus`.\n- [x] Implement input family: `type`, `fill`, `press`, `keydown`, `keyup`.\n- [x] Implement checkbox/select family: `check`, `uncheck`, `select`.\n- [x] Implement scrolling family: `scroll`, `scroll_into_view`.\n- [x] Implement getters: text/html/value/attr/url/title/count/box/styles.\n- [x] Implement state checks: visible/enabled/checked.\n- [x] Implement screenshots (surface/full-page where feasible).\n\n### Phase 2: Locator + Session Parity (P1)\n\n- [x] Implement `browser.find.role`.\n- [x] Implement `browser.find.text`.\n- [x] Implement `browser.find.label`.\n- [x] Implement `browser.find.placeholder`.\n- [x] Implement `browser.find.alt`.\n- [x] Implement `browser.find.title`.\n- [x] Implement `browser.find.testid`.\n- [x] Implement `browser.find.nth|first|last`.\n- [x] Implement frame context switching (`frame.select`, `frame.main`).\n- [x] Implement dialog handling (`accept`, `dismiss`, optional prompt text).\n- [x] Implement download waiting.\n- [x] Implement console/error buffers and retrieval.\n- [x] Implement highlight helper.\n- [x] Implement browser state save/load format.\n\n### Phase 3: Move/Reorder + Window/Workspace Integration\n\n- [x] Implement `surface.move` with handle-based destination rules.\n- [x] Implement `surface.reorder` within pane.\n- [x] Implement cross-workspace surface moves.\n- [x] Implement cross-window surface moves.\n- [x] Implement `workspace.reorder`.\n- [x] Add CLI commands for tab/surface reordering and moving (`move-surface`, `reorder-surface`, `reorder-workspace`).\n- [x] Add response payloads that confirm final `window_id/workspace_id/pane_id/surface_id`.\n- [x] Add explicit invariants tests for `surface_id` stability.\n\n### Phase 4: Advanced/Optional Parity (P2)\n\n- [ ] Evaluate feasibility of request interception/mocking in `WKWebView`; implement supported subset.\n- [ ] Add emulation settings that are feasible in `WKWebView`.\n- [ ] Add trace/recording equivalents where practical.\n- [x] Add script/style injection helpers.\n- [x] Document unsupported commands with explicit error `not_supported`.\n\n### Phase 5: Compatibility + Migration\n\n- [x] Add v1-to-v2 shim for migrated command families.\n- [x] Keep existing v1 behavior unchanged while shim is active.\n- [ ] Document v1/v2 mapping table for all browser/topology commands.\n- [ ] Add deprecation warnings only after parity + test completion.\n\n### Phase 6: Docs + Examples\n\n- [x] Update `docs/v2-api-migration.md` with browser parity status.\n- [ ] Add dedicated browser automation doc in `docs-site`.\n- [ ] Add examples for LLM workflow: identify -> choose surface -> snapshot -> act -> verify.\n- [ ] Add explicit \"surface vs pane vs workspace vs window\" section to CLI docs.\n\n## Test Port Plan (Comprehensive)\n\n### Port Targets from `agent-browser`\n\n1. `src/browser.test.ts` -> ported/adapted into:\n   - `tests_v2/test_browser_api_p0.py`\n   - `tests_v2/test_browser_api_comprehensive.py`\n   - `tests_v2/test_browser_api_unsupported_matrix.py`\n2. `src/actions.test.ts` -> adapted negative coverage in `tests_v2/test_browser_api_comprehensive.py` (`invalid_params`, `not_found`, `timeout`).\n3. `src/protocol.test.ts` -> adapted browser command/shape validation in `tests_v2/test_browser_api_unsupported_matrix.py` and existing `CLI/cmux.swift` command grammar checks.\n4. `test/file-access.test.ts` and `test/launch-options.test.ts` -> partially applicable to `WKWebView`; currently tracked as follow-up parity work (not blocking current browser method coverage).\n5. `src/daemon.test.ts`, `src/stream-server.test.ts`, `test/serverless.test.ts`, `src/ios-manager.test.ts` -> out-of-scope for cmux browser parity (different transport/runtime).\n\n### Implemented cmux Browser Suites\n\n1. `tests_v2/test_browser_api_p0.py`\n2. `tests_v2/test_browser_api_comprehensive.py`\n3. `tests_v2/test_browser_api_unsupported_matrix.py`\n4. `tests_v2/test_browser_goto_split.py`\n5. `tests_v2/test_browser_panel_stability.py`\n6. `tests_v2/test_browser_custom_keybinds.py`\n\n### Test Design Rules\n\n1. Prefer deterministic local fixtures (embedded HTML or local HTTP server), not public websites.\n2. Every command gets at least one positive and one negative test.\n3. Every handle-accepting API gets tests for UUID target and index-compat shim target.\n4. Every move/reorder test asserts `surface_id` stability pre/post operation.\n5. Browser tests must verify behavior from both focused and unfocused webview states.\n6. Self-identify tests must validate `focused` and `caller` fields.\n\n### Migration Gate Criteria\n\n1. New browser parity tests in `tests_v2/` pass.\n2. Existing v2 regression suites still pass.\n3. v1 suites still pass with shim active.\n4. No regressions in existing window/workspace/surface workflows.\n\nPlanned verification commands at implementation completion:\n1. `ssh cmux-vm 'cd /Users/cmux/GhosttyTabs && ./scripts/run-tests-v2.sh'`\n2. `ssh cmux-vm 'cd /Users/cmux/GhosttyTabs && ./scripts/run-tests-v1.sh'`\n\n## Decision Log (Locked - February 12, 2026)\n\n1. `cmux browser tab ...` maps to browser `surface` tabs only (no separate workspace-level tab meaning inside `browser` namespace).\n2. Default browser placement without explicit target is caller-relative: reuse the nearest right sibling pane; if none exists, split right from the caller pane.\n3. Deeply nested layouts use local split ancestry: choose the nearest right sibling leaf in the caller's subtree path and avoid reshuffling unrelated panes.\n4. Network parity target is full parity (not block-only phase).\n5. Output shape is cmux-native overall, but `browser.snapshot` and selector `not_found` diagnostics intentionally mirror agent-browser semantics for agent usability.\n6. ID model accepts UUIDs and short refs.\n7. Short ref format uses full words and colon: `surface:N`, `pane:N`, `workspace:N`, `window:N`.\n8. Short refs are global per daemon, monotonic, and never reused until daemon restart.\n9. Plain-text CLI output defaults to short refs.\n10. JSON output defaults to short refs (UUIDs available via `--id-format uuids|both`).\n11. CLI supports `--id-format refs|uuids|both` for output shaping.\n12. Browser create/move commands should expose enough placement/result metadata for agents to make deterministic follow-up decisions.\n13. Reuse behavior is implicit by default (caller-relative right-pane reuse); explicit handles can still force deterministic targeting.\n14. `browser fill` accepts empty text and treats it as a clear operation.\n15. Mutating browser actions can opt into post-action verification snapshots via `snapshot_after` (`--snapshot-after` in CLI), returning `post_action_snapshot` (+ refs/title/url).\n16. Legacy `new-pane`/`new-surface` plain output prefers short `surface:N` refs under default CLI ID formatting.\n\n## Remaining Open Decisions\n\n1. Unsupported command policy: strict `not_supported` errors vs best-effort fallback for commands that cannot be implemented on `WKWebView` with correct semantics.\n2. Whether to expose protocol-only agent-browser actions in first public release of `cmux browser` or gate them behind a second rollout phase.\n"}, {"id": "skill", "live": false, "tab": "c11-markdown skill", "num": 17, "path": "skills/c11-markdown/SKILL.md", "desc": "c11-markdown skill", "src": "---\nname: c11-markdown\nversion: 1\ndescription: Open markdown files in a c11 markdown surface with live reload. Use when you need to display plans, documentation, or notes alongside terminals and browser surfaces with rich rendering (headings, code blocks, tables, lists, Mermaid diagrams). Prefer this over external viewers when c11 is running.\n---\n\n# c11 Markdown Surfaces\n\nUse this skill to display markdown files in a c11 markdown surface — a first-class surface type that lives alongside terminal and browser surfaces in the same workspace, driven from the same `c11` CLI. The binary is `c11`.\n\nRich rendering (headings, code blocks, tables, lists, Mermaid) with live file watching — the panel auto-updates when the file changes on disk.\n\n## Core Workflow\n\n1. Write your plan or notes to a `.md` file.\n2. Open it in a markdown panel.\n3. The panel auto-updates when the file changes on disk.\n\n```bash\n# Open a markdown file as a split panel next to the current terminal\nc11 markdown open plan.md\n\n# Absolute path\nc11 markdown open /path/to/PLAN.md\n\n# Target a specific workspace\nc11 markdown open design.md --workspace workspace:2\n```\n\n## When to Use\n\n- Displaying an agent plan or task list alongside the terminal\n- Showing documentation, changelogs, or READMEs while working\n- Reviewing notes that update in real-time (e.g., a plan file being written by another process)\n\n## Producing artifacts the operator will return to\n\nWhen you are creating **more than one** markdown artifact across a session — a map, a proposal, an audit, a status report — present them as **one navigable surface**, not multiple disconnected top-level tabs. The hyperengineer is already running many agents in many tabs; your session should not become another navigation problem for them to solve when they come back from lunch.\n\nTwo patterns, in priority order:\n\n### Default: one consolidated file with sections\n\nWrite to a single `/tmp/<task>-trail.md` and append as the work progresses. The operator scrolls one document instead of switching tabs; the most current section sits on top so it is what they see first when they tab over.\n\n```bash\n# At the start of a multi-artifact piece of work, open the trail file once\nc11 new-pane --type markdown --file /tmp/voice-trail.md\n# → OK surface:35 pane:9 workspace:1\n\n# Then write to that file as the work evolves — live-reload renders it.\n# When new sections supersede earlier ones, put the new section at the top\n# so the operator's first read is current truth, not stale context.\n```\n\nThis is the right default unless the operator explicitly asks for separate files.\n\n### When you need multiple distinct files: tabs of the *same* pane\n\nIf the artifacts genuinely need to be separate files (different audiences, different lifetimes, downstream tooling reads them as units), add the second and subsequent ones as **tabs of the existing markdown pane**, not as new top-level panes:\n\n```bash\n# Capture the pane ref from the first open\nc11 new-pane --type markdown --file /tmp/voice-map.md\n# → OK surface:35 pane:9 workspace:1\n\n# Add subsequent files as tabs of pane:9 — NOT new top-level tabs\nc11 new-surface --type markdown --file /tmp/voice-wave-1.md --pane pane:9\nc11 new-surface --type markdown --file /tmp/voice-audit.md --pane pane:9\n```\n\nThe operator sees one markdown pane in the sidebar; the artifacts navigate as tabs of that pane. This is materially different from three `c11 new-pane` calls, which produce three sibling top-level tabs the operator has to context-switch between.\n\n### Always: title + description per surface\n\nWhether it is one consolidated file or a tabbed pane, set `c11 set-title` and `c11 set-description` on every markdown surface immediately after opening it. The operator should know what they are looking at without opening it. See the top-level c11 skill's \"Title and description\" section for the conventions.\n\n### Close stale artifacts at session-end\n\nIf an early-session map document is superseded by a final audit, close the early surface (`c11 close-surface --surface <ref>`) so the operator's primary view shows the current truth. Leaving five surfaces open across a session because they were once useful is unkind to the next look.\n\n## Live File Watching\n\nThe panel automatically re-renders when the file changes on disk. This works with:\n\n- Direct writes (`echo \"...\" >> plan.md`)\n- Editor saves (vim, nano, VS Code)\n- Atomic file replacement (write to temp, rename over original)\n- Agent-generated plan files that are updated progressively\n\nIf the file is deleted, the panel shows a \"file unavailable\" state. During atomic replace, the panel attempts automatic reconnection within its short retry window. If the file returns later, close and reopen the panel.\n\n## Agent Integration\n\n### Opening a plan file\n\nWrite your plan to a file, then open it:\n\n```bash\ncat > plan.md << 'EOF'\n# Task Plan\n\n## Steps\n1. Analyze the codebase\n2. Implement the feature\n3. Write tests\n4. Verify the build\nEOF\n\nc11 markdown open plan.md\n```\n\n### Updating a plan in real-time\n\nThe panel live-reloads, so simply overwrite the file as work progresses:\n\n```bash\n# The markdown panel updates automatically when the file changes\necho \"## Step 1: Complete\" >> plan.md\n```\n\n### Recommended AGENTS.md instruction\n\nAdd this to your project's `AGENTS.md` to instruct coding agents to use the markdown viewer:\n\n```markdown\n## Plan Display\n\nWhen creating a plan or task list, write it to a `.md` file and open it in c11:\n\n    c11 markdown open plan.md\n\nThe panel renders markdown with rich formatting and auto-updates when the file changes.\n```\n\n## Routing\n\n```bash\n# Open in the caller's workspace (default — uses C11_WORKSPACE_ID)\nc11 markdown open plan.md\n\n# Open in a specific workspace\nc11 markdown open plan.md --workspace workspace:2\n\n# Open splitting from a specific surface\nc11 markdown open plan.md --surface surface:5\n\n# Open in a specific window\nc11 markdown open plan.md --window window:1\n```\n\n## Deep-Dive References\n\n| Reference | When to Use |\n|-----------|-------------|\n| [references/commands.md](references/commands.md) | Full command syntax and options |\n| [references/live-reload.md](references/live-reload.md) | File watching behavior, atomic writes, edge cases |\n\n## Rendering Support\n\nThe markdown panel renders:\n\n- Headings (h1-h6) with dividers on h1/h2\n- Fenced code blocks with monospaced font\n- Inline code with highlighted background\n- Tables with alternating row colors\n- Ordered and unordered lists (nested)\n- Blockquotes with left border\n- Bold, italic, strikethrough\n- Links (clickable)\n- Horizontal rules\n- Images (inline)\n\nSupports both light and dark mode.\n"}], "steps": [{"delay": 50, "ops": [["sub", "- [ ] C11-183 ancestry present", "- [x] C11-183 ancestry present"], ["sub", "- [ ] Flag and suppression are separate canonical", "- [x] Flag and suppression are separate canonical"]]}, {"delay": 70, "ops": [["append", "\n## Plan-review cycle 1 resolutions (authoritative)\n\n- Removed every local test-action instruction; CI alone executes XCTest assertions.\n- Replaced write-then-publish with one serialized attention commit service and explicitly\n  closed generic metadata set/clear/replace, restore, launch, transfer, close, and prune\n  bypasses.\n- Defined active-to-active reason revision: preserve the original queue epoch, emit/update\n  once, and reset age only after explicit lower plus a new raise."]]}, {"delay": 55, "ops": [["append", "\n- Replaced the double tagged launch with one `C11_QA_LAUNCH=fresh reload.sh` launch and exact\n  bundle/PID/socket evidence.\n- Added the deta       holdAnchor(() => { removePointNote(); S.pointer = { id:'p' + (++S.seq), heading:hd, note:'agent asked to scroll you here; it waited for you instead.', t:S.now, seen:false, seenAt:null, how:null, dwell:0, kind:'point' }; S.hunks.set(S.pointer.id, S.pointer); placePointNote(); });
      afterRender(); updatePointChip();
      log(pr + '\n' + esc(JSON.stringify({ scrolled:false, reason:'operator focused on pane', queued_as:S.pointer.id }, null, 2)));
    } else {
      const el = docEl.querySelector(`[data-ls="${L}"]`); if (el) { scrollToY(el.getBoundingClientRect().top - content.getBoundingClientRect().top - 14, false); }
      log(pr + '\n' + esc(JSON.stringify({ scrolled:true, line:L + 1 }, null, 2)));

}

    if (S.now - w.start > 10 * MIN) { log(`<span class="er">timeout: ${w.p.id} not seen after 10m</span>\nexit 124`); return false; }
    return true;
  });
}

/* ═════════ clock ═════════ */
let lastTick = performance.now(), acc = 0;
setInterval(() => {
  const t = performance.now(), dt = t - lastTick; lastTick = t;
  S.now += dt * S.speed;
  if (S.playing && S.doc.live && S.now >= S.nextAt) applyStep();

document.fonts && document.fonts.ready.then(() => { restoreAnchor(anchor); afterRender(); });
