ERMINFO_OVERLAY\" ]; then\n  mkdir -p \"$TERMINFO_DEST\"\n  rsync -a \"$TERMINFO_OVERLAY/\" \"$TERMINFO_DEST/\"\nfi\nif [ -d \"$C11_SHELL_SRC\" ]; then\n  mkdir -p \"$C11_SHELL_DEST\"\n  # Use '/.' so dotfiles like .zshenv/.zprofile are copied too.\n  rsync -a \"$C11_SHELL_SRC/.\" \"$C11_SHELL_DEST/\"\nfi\nif [ -f \"$C11_GHOSTTY_ZSH_SRC\" ]; then\n  mkdir -p \"$C11_SHELL_DEST\"\n  rsync -a \"$C11_GHOSTTY_ZSH_SRC\" \"$C11_SHELL_DEST/ghostty-integration.zsh\"\nfi\nSKILLS_SRC=\"${SRCROOT}/skills\"\nSKILLS_DEST=\"${DEST}/skills\"\nif [ -d \"$SKILLS_SRC\" ]; then\n  mkdir -p \"$SKILLS_DEST\"\n  rsync -a --delete \"$SKILLS_SRC/\" \"$SKILLS_DEST/\"\nfi\nTHEMES_SRC=\"${SRCROOT}/Resources/c11-themes\"\nTHEMES_DEST=\"${DEST}/c11-themes\"\nif [ -d \"$THEMES_SRC\" ]; then\n  mkdir -p \"$THEMES_DEST\"\n  rsync -a --delete \"$THEMES_SRC/\" \"$THEMES_DEST/\"\nfi\nif [ ! -x \"$BUILD_GHOSTTY_HELPER\" ]; then\n  echo \"error: missing Ghostty CLI helper build script at $BUILD_GHOSTTY_HELPER\" >&2\n  exit 1\nfi\nARCHS_LIST=\" ${ARCHS:-} \"\nHAS_ARM64=0\nHAS_X86_64=0\nGHOSTTY_HELPER_TARGET=\"\"\ncase \"$ARCHS_LIST\" in\n  *\" arm64 \"*) HAS_ARM64=1 ;;\nesac\ncase \"$ARCHS_LIST\" in\n  *\" x86_64 \"*) HAS_X86_64=1 ;;\nesac\nif [ \"$HAS_ARM64\" -eq 1 ] && [ \"$HAS_X86_64\" -eq 1 ]; then\n  \"$BUILD_GHOSTTY_HELPER\" --universal --output \"$GHOSTTY_HELPER_DEST\"\nelif [ \"$HAS_ARM64\" -eq 1 ]; then\n  GHOSTTY_HELPER_TARGET=\"aarch64-macos\"\nelif [ \"$HAS_X86_64\" -eq 1 ]; then\n  GHOSTTY_HELPER_TARGET=\"x86_64-macos\"\nfi\nif [ -n \"$GHOSTTY_HELPER_TARGET\" ]; then\n  \"$BUILD_GHOSTTY_HELPER\" --target \"$GHOSTTY_HELPER_TARGET\" --output \"$GHOSTTY_HELPER_DEST\"\nelif [ \"$HAS_ARM64\" -eq 0 ] || [ \"$HAS_X86_64\" -eq 0 ]; then\n  \"$BUILD_GHOSTTY_HELPER\" --output \"$GHOSTTY_HELPER_DEST\"\nfi\nif [ ! -x \"$GHOSTTY_HELPER_DEST\" ]; then\n  echo \"error: Ghostty CLI helper was not created at $GHOSTTY_HELPER_DEST\" >&2\n  exit 1\nfi\n# The 11mux names (docs/11mux-rename-plan.md): relative symlinks to the c11 CLI.\nfor alias_name in 11mux elevenmux mux11 muxeleven; do\n  ln -sfn c11 \"$BIN_DEST/$alias_name\"\ndone\nINFO_PLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\nCOMMIT=\"$(git -C \"${SRCROOT}\" rev-parse --short=9 HEAD 2>/dev/null || true)\"\nif [ -n \"$COMMIT\" ] && [ -f \"$INFO_PLIST\" ]; then\n  /usr/libexec/PlistBuddy -c \"Set :C11Commit $COMMIT\" \"$INFO_PLIST\" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c \"Add :C11Commit string $COMMIT\" \"$INFO_PLIST\" >/dev/null 2>&1 || true\nfi\n";
