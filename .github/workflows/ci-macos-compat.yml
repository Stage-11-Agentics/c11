name: macOS Compatibility

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat-tests:
    # This workflow has no pull_request trigger. Keep the guard adjacent to the
    # paid runner so a future trigger cannot silently make fork PRs run on Atlas.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: atlas
            timeout: 30
            smoke: true
            skip_zig: false
    runs-on: [self-hosted, macOS, atlas]
    timeout-minutes: ${{ matrix.timeout }}
    env:
      C11_ATLAS_BUILD_SLUG: c11-ci-compat
      C11_ATLAS_SLOTS_DIR: /tmp/c11-atlas-build-slots
      C11_BUILD_LOCK_TIMEOUT: '5400'
      C11_COMPAT_DERIVED_DATA: ${{ runner.temp }}/c11-compat-derived
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Select a process-scoped developer directory. Never mutate Atlas's
          # global xcode-select state from a GitHub job.
          XCODE_APP="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          XCODE_DIR="$XCODE_APP/Contents/Developer"
          if [ ! -d "$XCODE_DIR" ]; then
            echo "No Xcode found under /Applications" >&2
            exit 1
          fi
          echo "Selected: $XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          XCODE_VER="${XCODE_VERSION_OUTPUT%%$'\n'*}"
          echo "XCODE_VER=$XCODE_VER" >> "$GITHUB_ENV"
          echo "$XCODE_VERSION_OUTPUT"
          xcrun --sdk macosx --show-sdk-path
          sw_vers

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-${{ hashFiles('.gitmodules', 'ghostty') }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Ensure process-scoped Zig
        if: ${{ !matrix.skip_zig }}
        run: |
          set -euo pipefail
          ZIG_DIR="$(./scripts/ensure-zig.sh)"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          export PATH="$ZIG_DIR:$PATH"
          zig version

      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ${{ runner.temp }}/c11-compat-derived
          key: deriveddata-${{ matrix.os }}-${{ env.XCODE_VER }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-${{ matrix.os }}-${{ env.XCODE_VER }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            deriveddata-${{ matrix.os }}-${{ env.XCODE_VER }}-

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: .ci-source-packages
          key: spm-${{ matrix.os }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ matrix.os }}-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if "$GITHUB_WORKSPACE/scripts/ci-atlas-run.sh" xcodebuild \
              -project GhosttyTabs.xcodeproj -scheme c11-unit -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Create virtual display
        if: matrix.smoke
        run: |
          set -euo pipefail
          echo "=== Display before ==="
          system_profiler SPDisplaysDataType 2>/dev/null || echo "(no display info)"
          echo ""
          clang -framework Foundation -framework CoreGraphics \
            -o /tmp/create-virtual-display scripts/create-virtual-display.m
          /tmp/create-virtual-display &
          VDISPLAY_PID=$!
          echo "VDISPLAY_PID=$VDISPLAY_PID" >> "$GITHUB_ENV"
          sleep 3
          echo "=== Display after ==="
          system_profiler SPDisplaysDataType 2>/dev/null || echo "(no display info)"

      - name: Build app for smoke test
        if: matrix.smoke
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          "$GITHUB_WORKSPACE/scripts/ci-atlas-run.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11 -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            -derivedDataPath "$C11_COMPAT_DERIVED_DATA" \
            build
          echo "C11_SMOKE_APP_PATH=$C11_COMPAT_DERIVED_DATA/Build/Products/Debug/c11 DEV.app" >> "$GITHUB_ENV"

      - name: Smoke test
        if: matrix.smoke
        run: |
          set -euo pipefail
          chmod +x scripts/smoke-test-ci.sh
          C11_SMOKE_SOCKET_PATH="/tmp/c11-smoke-${GITHUB_RUN_ID}.sock" \
            C11_SMOKE_LOG_PATH="$RUNNER_TEMP/c11-smoke-${GITHUB_RUN_ID}.log" \
            scripts/smoke-test-ci.sh
