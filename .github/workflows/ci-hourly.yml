name: CI main (macOS)

# Clean-machine native backstop, independent of Atlas's c11/main-atlas status.
# Hourly checks skip tips already green in this workflow's own status context.
# Dispatch can force a rebuild. One run stays active and newer requests replace
# the single pending run; each admitted run resolves its ref's current tip.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this commit already passed
        type: boolean
        default: false

concurrency:
  group: ci-main-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GREEN_STATUS_CONTEXT: CI main (macOS)

jobs:
  target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      tested: ${{ steps.select.outputs.tested }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-backstop-target.sh
          sparse-checkout-cone-mode: false

      - name: Resolve the ref's tip and its green record
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/ci-backstop-target.sh "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$GREEN_STATUS_CONTEXT" | tee -a "$GITHUB_OUTPUT"

  poller-tests:
    needs: target
    if: ${{ inputs.force || needs.target.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}

      - name: Validate c11 PR Swift poller
        run: python3 scripts/c11-pr-swift-poller-test.py

  # The viewer's Playwright suite on its pinned Chromium; needs no app build.
  markdown-viewer:
    needs: target
    if: ${{ inputs.force || needs.target.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout selected tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}

      - name: Markdown viewer suite
        working-directory: scripts/markdown-viewer
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install chromium-headless-shell
          C11_MD_EVIDENCE="$RUNNER_TEMP/markdown-viewer-evidence" node test.mjs

  build:
    needs: target
    if: ${{ inputs.force || needs.target.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          submodules: recursive

      - name: Prepare c11 macOS backstop runner
        id: runner-setup
        uses: ./.github/actions/c11-macos-backstop-setup

      - name: Restore the closest backstop DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*
          key: c11-backstop-deriveddata-${{ runner.os }}-${{ steps.runner-setup.outputs.xcode-version }}-${{ steps.runner-setup.outputs.dependency-key }}-${{ env.TARGET_SHA }}
          restore-keys: |
            c11-backstop-deriveddata-${{ runner.os }}-${{ steps.runner-setup.outputs.xcode-version }}-${{ steps.runner-setup.outputs.dependency-key }}-
            c11-backstop-deriveddata-${{ runner.os }}-${{ steps.runner-setup.outputs.xcode-version }}-

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11 -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Build logic test products
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11-logic -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 3 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing

      - name: Build host test products
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11-unit -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 60 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing

      - name: Save exact-head DerivedData for test jobs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*
          key: c11-backstop-deriveddata-${{ runner.os }}-${{ steps.runner-setup.outputs.xcode-version }}-${{ steps.runner-setup.outputs.dependency-key }}-${{ env.TARGET_SHA }}

  logic:
    needs: [target, build]
    if: ${{ inputs.force || needs.target.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          submodules: recursive

      - name: Prepare c11 macOS backstop runner
        id: runner-setup
        uses: ./.github/actions/c11-macos-backstop-setup
        with:
          use-build-cache: false

      - name: Restore exact-head prebuilt products
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*
          key: c11-backstop-deriveddata-${{ runner.os }}-${{ steps.runner-setup.outputs.xcode-version }}-${{ steps.runner-setup.outputs.dependency-key }}-${{ env.TARGET_SHA }}
          fail-on-cache-miss: true

      - name: Logic tests (gate)
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11-logic -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 60 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test-without-building

      - name: Upload logic xcresult on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c11-logic-xcresult
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  host-a:
    needs: [target, build]
    if: ${{ inputs.force || needs.target.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          submodules: recursive

      - name: Prepare c11 macOS backstop runner
        id: runner-setup
        uses: ./.github/actions/c11-macos-backstop-setup
        with:
          use-build-cache: false

      - name: Restore exact-head prebuilt products
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*
          key: c11-backstop-deriveddata-${{ runner.os }}-${{ steps.runner-setup.outputs.xcode-version }}-${{ steps.runner-setup.outputs.dependency-key }}-${{ env.TARGET_SHA }}
          fail-on-cache-miss: true

      - name: Host A unit tests (gate)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          QUARANTINE_ROWS="$RUNNER_TEMP/c11-host-test-quarantine.tsv"
          python3 "$GITHUB_WORKSPACE/scripts/host_test_quarantine.py" --ci-actions > "$QUARANTINE_ROWS"
          SKIP_ARGS=()
          while IFS=$'\t' read -r action test_id scope reason; do
            if [[ "$action" == "skip" ]]; then
              echo "Quarantined host test (scope=$scope): $test_id: $reason"
              SKIP_ARGS+=("-skip-testing:$test_id")
            elif [[ "$action" == "run" ]]; then
              echo "Atlas-only quarantine not applied; CI still runs (scope=$scope): $test_id: $reason"
            else
              echo "Unknown host quarantine action '$action' for $test_id" >&2
              exit 2
            fi
          done < "$QUARANTINE_ROWS"
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11-unit -configuration Debug \
            -only-testing:c11Tests \
            -skip-testing:c11Tests/CommandPaletteShortcutTests \
            -skip-testing:c11Tests/WindowRoutingShortcutTests \
            -skip-testing:c11Tests/WindowCloseShortcutTests \
            -skip-testing:c11Tests/ShortcutLayoutTests \
            "${SKIP_ARGS[@]}" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 60 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test-without-building

      - name: Upload host A xcresult on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c11-host-a-xcresult
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  host-b:
    needs: [target, build]
    if: ${{ inputs.force || needs.target.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          submodules: recursive

      - name: Prepare c11 macOS backstop runner
        id: runner-setup
        uses: ./.github/actions/c11-macos-backstop-setup
        with:
          use-build-cache: false

      - name: Restore exact-head prebuilt products
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*
          key: c11-backstop-deriveddata-${{ runner.os }}-${{ steps.runner-setup.outputs.xcode-version }}-${{ steps.runner-setup.outputs.dependency-key }}-${{ env.TARGET_SHA }}
          fail-on-cache-miss: true

      - name: Host B shortcut-routing tests (gate)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          QUARANTINE_ROWS="$RUNNER_TEMP/c11-host-test-quarantine.tsv"
          python3 "$GITHUB_WORKSPACE/scripts/host_test_quarantine.py" --ci-actions > "$QUARANTINE_ROWS"
          SKIP_ARGS=()
          while IFS=$'\t' read -r action test_id scope reason; do
            if [[ "$action" == "skip" ]]; then
              echo "Quarantined host test (scope=$scope): $test_id: $reason"
              SKIP_ARGS+=("-skip-testing:$test_id")
            elif [[ "$action" == "run" ]]; then
              echo "Atlas-only quarantine not applied; CI still runs (scope=$scope): $test_id: $reason"
            else
              echo "Unknown host quarantine action '$action' for $test_id" >&2
              exit 2
            fi
          done < "$QUARANTINE_ROWS"
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11-unit -configuration Debug \
            -only-testing:c11Tests/CommandPaletteShortcutTests \
            -only-testing:c11Tests/WindowRoutingShortcutTests \
            -only-testing:c11Tests/WindowCloseShortcutTests \
            -only-testing:c11Tests/ShortcutLayoutTests \
            "${SKIP_ARGS[@]}" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 60 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test-without-building

      - name: Upload host B xcresult on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c11-host-b-xcresult
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  python:
    needs: [target, build]
    if: ${{ inputs.force || needs.target.outputs.tested != 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          submodules: recursive

      - name: Prepare c11 macOS backstop runner
        id: runner-setup
        uses: ./.github/actions/c11-macos-backstop-setup
        with:
          use-build-cache: false

      - name: Restore exact-head prebuilt products
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*
          key: c11-backstop-deriveddata-${{ runner.os }}-${{ steps.runner-setup.outputs.xcode-version }}-${{ steps.runner-setup.outputs.dependency-key }}-${{ env.TARGET_SHA }}
          fail-on-cache-miss: true

      - name: Locate CLI binary from exact-head build
        shell: bash
        run: |
          set -euo pipefail
          CLI_CANDIDATES=( "$HOME"/Library/Developer/Xcode/DerivedData/GhosttyTabs-*/Build/Products/Debug/c11 )
          if [[ ${#CLI_CANDIDATES[@]} -ne 1 || ! -x "${CLI_CANDIDATES[0]}" ]]; then
            printf 'expected one built CLI binary, found %s candidates\n' "${#CLI_CANDIDATES[@]}" >&2
            exit 1
          fi
          printf 'CLI_BINARY=%s\n' "${CLI_CANDIDATES[0]}" >> "$GITHUB_ENV"

      - name: CLI tests against the built binary
        shell: bash
        env:
          C11_ACTIVITY_MEMORY_PROBE: "1"
        run: |
          set -euo pipefail
          test -x "$CLI_BINARY"
          LOG_DIR="$RUNNER_TEMP/c11-cli-tests"
          mkdir -p "$LOG_DIR"
          pids=()
          names=()
          logs=()
          statuses=()
          launch_cli_test() {
            local name="$1"
            shift
            local log="$LOG_DIR/$name.log"
            names+=("$name")
            logs+=("$log")
            "$@" > "$log" 2>&1 &
            pids+=("$!")
          }
          launch_cli_test ssh-shell env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_ssh_shell_bootstrap.py
          launch_cli_test focus-history env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_focus_history.py
          launch_cli_test window-scope env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_window_scope.py
          launch_cli_test stale-targets env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_stale_targets.py
          launch_cli_test activity-analysis env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_activity_analysis.py
          launch_cli_test shortcuts-columns env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_shortcuts_columns.py
          launch_cli_test mailbox-body env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_mailbox_body_cli.py "$CLI_BINARY"
          launch_cli_test moved-panel-caller env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_moved_panel_caller.py
          launch_cli_test read-selection env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_read_selection.py
          launch_cli_test response-framing env C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_response_framing.py
          launch_cli_test send-raw env C11_CLI="$CLI_BINARY" python3 tests_v2/test_send_raw_and_flags.py --offline
          launch_cli_test claude-mailbox-bridge env C11_TEST_CLI="$CLI_BINARY" python3 tests/test_claude_mailbox_bridge.py
          failures=0
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              statuses[$i]=0
            else
              statuses[$i]=$?
              failures=$((failures + 1))
            fi
          done
          for i in "${!pids[@]}"; do
            printf '\n===== %s (exit %s) =====\n' "${names[$i]}" "${statuses[$i]}"
            cat "${logs[$i]}"
          done
          if (( failures > 0 )); then
            printf '%s CLI test script(s) failed\n' "$failures" >&2
            exit 1
          fi

      - name: Shell helper lifetime and git reporting
        run: bash tests/test_shell_git_watchers.sh

      # PR CI runs --smoke. The sweep is too slow for the 2-minute PR budget.
      - name: Socket guard canary
        run: python3 tests/test_socket_guard_canary.py

  record-green:
    needs: [target, build, logic, host-a, host-b, python, poller-tests, markdown-viewer]
    if: ${{ inputs.force || needs.target.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      TARGET_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - name: Record green for the tested commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=success \
            -f context="$GREEN_STATUS_CONTEXT" \
            -f description="Native build, logic, host, CLI, poller and markdown viewer tests passed" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
