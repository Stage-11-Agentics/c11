<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>c11 markdown · live-trail (prototype)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@4.0.0/dist/markdown-it-footnote.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<style>
/* ════ tokens ═══════════════════════════════════════════════════════
   chrome = c11 void language (docs/design-prototypes/c11-reskin).
   prose  = IBM Plex Sans; chrome + code = JetBrains Mono.
   gold is the change signal: an unseen write. nothing else is gold
   inside the surface except the focused-pane ring and agent notes.  */
:root, :root[data-theme="dark"] {
  --void:#050505; --chrome:#0a0a0a; --chrome2:#1f1f22; --chrome3:#2d2d32;
  --rule:#333333; --rule-soft:rgba(232,232,232,.075); --tab-active:#232327;
  --ink:#e8e8e8; --ink-2:rgba(232,232,232,.78); --ink-3:rgba(232,232,232,.6); --ink-4:rgba(232,232,232,.4);
  --paper:#0e0f11; --prose:#d9d9d5; --prose-2:rgba(217,217,213,.68); --head:#f3f3f0;
  --code-bg:#131518; --code-rule:#25272c; --icode:#1a1c20;
  --gold:#c9a84c; --gold-ink:#d9bb63; --gold-faint:rgba(201,168,76,.24); --gold-ghost:rgba(201,168,76,.09);
  --add-bg:rgba(111,174,138,.10); --add-rule:#6fae8a; --del-bg:rgba(214,120,110,.10); --del-ink:#e0948b; --ins-bg:rgba(111,174,138,.24);
  --run:#79AEE8; --idle:#78B59E; --seen:#7a7e88;
  --thead:#15171a; --shadow:0 10px 30px rgba(0,0,0,.55);
  --k-key:#b9a7e6; --k-str:#a3cc9c; --k-num:#e3b67c; --k-com:rgba(232,232,232,.38); --k-fn:#8fbbea; --k-attr:#d8bb7e; --k-bi:#82c6c4; --k-meta:#8a93a3;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --void:#e4e2dc; --chrome:#f3f2ed; --chrome2:#e7e5de; --chrome3:#d9d6cd;
  --rule:#cfccc2; --rule-soft:rgba(20,20,20,.08); --tab-active:#fbfaf6;
  --ink:#16171a; --ink-2:rgba(22,23,26,.8); --ink-3:rgba(22,23,26,.62); --ink-4:rgba(22,23,26,.42);
  --paper:#fbfaf6; --prose:#24262b; --prose-2:rgba(36,38,43,.66); --head:#0f1013;
  --code-bg:#f2f0e9; --code-rule:#e0ddd3; --icode:#eeebe3;
  --gold:#9b7920; --gold-ink:#84661a; --gold-faint:rgba(155,121,32,.26); --gold-ghost:rgba(155,121,32,.085);
  --add-bg:rgba(46,125,82,.085); --add-rule:#3d8a5f; --del-bg:rgba(176,64,52,.075); --del-ink:#a4443a; --ins-bg:rgba(46,125,82,.17);
  --run:#2f6fb5; --idle:#3f8a6c; --seen:#a19f95;
  --thead:#f0eee7; --shadow:0 10px 26px rgba(50,42,20,.16);
  --k-key:#6a4cb3; --k-str:#3b7638; --k-num:#9a5a10; --k-com:rgba(22,23,26,.45); --k-fn:#2a5ca6; --k-attr:#86621a; --k-bi:#1d7473; --k-meta:#6b7280;
  color-scheme:light;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:var(--void); color:var(--ink); font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  font-size:12px; font-weight:400; display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.tnum { font-variant-numeric:tabular-nums; }

/* ════ prototype chrome (outside the c11 frame) ═════════════════════ */
#proto { flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:9px 16px;
  border-bottom:1px dashed var(--gold-faint); background:var(--void); font-size:11px; color:var(--ink-3); }
.badge { color:var(--gold); border:1px solid var(--gold-faint); border-radius:4px; padding:3px 9px;
  letter-spacing:.14em; font-size:10px; font-weight:500; }
.ptitle { color:var(--ink-2); letter-spacing:.02em; }
.pgroup { display:flex; align-items:center; gap:6px; }
.pgroup > label { color:var(--ink-4); }
.seg { display:inline-flex; border:1px solid var(--rule); border-radius:5px; overflow:hidden; }
.seg button { height:22px; padding:0 8px; white-space:nowrap; color:var(--ink-3); text-align:center; }
.seg button + button { border-left:1px solid var(--rule); }
.seg button:hover { color:var(--ink); background:var(--chrome2); }
.seg button.on { color:var(--ink); background:var(--chrome3); }
.pbtn { height:24px; padding:0 9px; white-space:nowrap; border:1px solid var(--rule); border-radius:5px; color:var(--ink-2); }
.pbtn:hover { background:var(--chrome2); color:var(--ink); }
.pbtn:active { background:var(--chrome3); }
select.psel { font:inherit; color:var(--ink-2); background:var(--chrome); border:1px solid var(--rule); border-radius:5px; height:24px; padding:0 6px; }
#simclock { color:var(--ink-4); width:21ch; }

#stage { flex:1; min-height:0; display:flex; justify-content:center; gap:16px; padding:16px; position:relative; }

/* ════ c11 frame ═══════════════════════════════════════════════════ */
.frame { --w:820px; width:var(--w); flex:none; height:100%; display:flex; flex-direction:column; background:var(--chrome);
  border:1px solid var(--rule); border-radius:8px; overflow:hidden; position:relative; transition:box-shadow .15s; }
.frame.focused { box-shadow:0 0 0 1.5px var(--gold); }
.tabbar { height:40px; flex:none; display:flex; align-items:stretch; border-bottom:1px solid var(--rule); user-select:none; }
.tab { display:flex; align-items:center; gap:8px; padding:0 6px 0 12px; border-right:1px solid rgba(51,51,51,.55);
  font-size:12.5px; color:var(--ink-3); flex:0 1 220px; min-width:0; white-space:nowrap; position:relative; cursor:default; }
.tab.active { flex:0 0 auto; max-width:62%; background:var(--tab-active); color:var(--ink); font-weight:600; }
.tab.active::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--gold); }
.tab .ttl { overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.tab .tx { width:20px; height:20px; display:flex; align-items:center; justify-content:center; color:var(--ink-4); font-size:13px; flex:none; font-weight:400; }
.tab .glyph { color:var(--ink-4); font-weight:400; flex:none; width:12px; text-align:center; }
.tchip { flex:none; min-width:22px; height:17px; padding:0 5px; border-radius:9px; background:var(--gold-faint); color:var(--gold-ink);
  font-size:10.5px; font-weight:500; display:inline-flex; align-items:center; justify-content:center; }
.tchip.zero { visibility:hidden; }
.pmark { flex:none; display:inline-block; }
.pmark.run { width:11px; height:11px; border-radius:50%; border:1.5px solid rgba(121,174,232,.35); border-top-color:var(--run); animation:spin 2.4s linear infinite; }
.pmark.idle { width:9px; height:9px; border-radius:2px; background:var(--idle); opacity:.85; }
@keyframes spin { to { transform:rotate(360deg); } }
.tabbar .spacer { flex:1 1 0; min-width:8px; }
.countcell { flex:none; display:flex; align-items:center; gap:6px; padding:0 12px; color:var(--ink-3); font-size:12px; border-left:1px solid var(--rule); }
.descbar { height:26px; flex:none; display:flex; align-items:center; gap:10px; padding:0 12px; border-bottom:1px solid var(--rule);
  font-size:11.5px; color:var(--ink-3); }
.descbar .desc { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.descbar .desc b { color:var(--ink-2); font-weight:500; }
.descbar .looked { flex:none; width:17ch; text-align:right; color:var(--ink-4); }

.surface { flex:1; min-height:0; display:flex; flex-direction:column; background:var(--paper); container-type:inline-size; }
.strip { height:32px; flex:none; display:flex; align-items:center; gap:10px; padding:0 8px 0 12px; border-bottom:1px solid var(--rule);
  background:var(--chrome); font-size:11px; }
.writer { flex:1; min-width:0; display:flex; align-items:center; gap:8px; color:var(--ink-3); white-space:nowrap; }
.writer .wtext { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.writer .wtext b { color:var(--ink-2); font-weight:500; }
.wdot { flex:none; width:6px; height:6px; border-radius:50%; background:var(--seen); opacity:.6; }
.wdot.writing { background:var(--run); opacity:1; animation:breathe 1.6s ease-in-out infinite; }
.wdot.settled { background:transparent; box-shadow:inset 0 0 0 1px var(--ink-4); }
@keyframes breathe { 50% { opacity:.3; } }
.tools { flex:none; display:flex; align-items:center; gap:6px; }
.tbtn { height:22px; border:1px solid var(--rule); border-radius:5px; color:var(--ink-3); text-align:center; }
.tbtn:hover { color:var(--ink); background:var(--chrome2); }
.tbtn.on { color:var(--ink); background:var(--chrome3); border-color:var(--ink-4); }
#diffBtn { width:44px; } #srcBtn { width:58px; } #findBtn { width:44px; }
#modeSeg button { width:50px; padding:0; }

.viewport { flex:1; min-height:0; position:relative; }
.scroller { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; overflow-anchor:none; scrollbar-width:none; }
.scroller::-webkit-scrollbar { display:none; }
.content { position:relative; padding:0 34px 0 46px; min-height:100%; }
.marks { position:absolute; inset:0; pointer-events:none; z-index:2; }

/* ════ prose ═══════════════════════════════════════════════════════ */
.doc { max-width:74ch; margin:0 auto; padding:26px 0 140px; font-family:"IBM Plex Sans",-apple-system,system-ui,sans-serif;
  font-size:15.5px; line-height:1.62; color:var(--prose); }
.doc > * + * { margin-top:.85em; }
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6 { color:var(--head); font-weight:600; display:flex; align-items:baseline; gap:10px; line-height:1.3; scroll-margin-top:16px; }
.doc h1 { font-size:25px; letter-spacing:-.012em; margin-bottom:.4em; }
.doc h2 { font-size:19.5px; letter-spacing:-.006em; margin-top:2.1em; padding-top:.9em; border-top:1px solid var(--rule-soft); }
.doc h3 { font-size:16.5px; margin-top:1.7em; }
.doc h4 { font-size:15px; margin-top:1.4em; }
.doc h5,.doc h6 { font-size:13px; text-transform:lowercase; letter-spacing:.04em; color:var(--prose-2); }
.htext { flex:1; min-width:0; }
.hanchor { flex:none; font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:400; color:var(--ink-4); text-decoration:none; opacity:0; width:1ch; }
.doc :is(h1,h2,h3,h4,h5,h6):hover .hanchor { opacity:1; }
.fresh { flex:none; width:9ch; text-align:right; font-family:"JetBrains Mono",monospace; font-size:10.5px; font-weight:400;
  color:var(--ink-4); letter-spacing:0; font-variant-numeric:tabular-nums; opacity:.55; transition:opacity .4s, color .4s; }
.fresh.recent { opacity:.95; }
.fresh.hot { color:var(--gold-ink); opacity:1; }
.fresh.calm { opacity:0; }
.doc :is(h2,h3):hover .fresh.calm { opacity:.6; }
.doc p { overflow-wrap:break-word; }
.doc a { color:var(--head); text-decoration:underline; text-decoration-color:var(--ink-4); text-underline-offset:2px; }
.doc a:hover { text-decoration-color:var(--head); }
.doc strong { color:var(--head); font-weight:600; }
.doc code { font-family:"JetBrains Mono",monospace; font-size:.84em; background:var(--icode); border:1px solid var(--rule-soft);
  padding:.08em .38em; border-radius:4px; overflow-wrap:anywhere; }
.doc ul,.doc ol { padding-left:1.45em; }
.doc li + li { margin-top:.3em; }
.doc li > ul,.doc li > ol { margin-top:.3em; }
.doc li::marker { color:var(--ink-4); }
.doc li.task { list-style:none; position:relative; }
.doc li.task > .cb { position:absolute; left:-1.45em; top:.36em; }
.cb { width:13px; height:13px; border-radius:3px; border:1.5px solid var(--ink-4); display:inline-block; transition:background .3s, border-color .3s; }
.cb.done { background:var(--ink-3); border-color:var(--ink-3); background-image:linear-gradient(transparent,transparent);
  -webkit-mask:none; position:relative; }
.cb.done::after { content:""; position:absolute; left:3.2px; top:.6px; width:3.5px; height:7px; border:solid var(--paper); border-width:0 1.8px 1.8px 0; transform:rotate(45deg); }
.doc li.task.done { color:var(--prose-2); }
.doc blockquote { border-left:2px solid var(--rule); padding:.1em 0 .1em 14px; color:var(--prose-2); }
.doc blockquote.callout { border-left-color:var(--ink-3); background:var(--rule-soft); padding:10px 14px; border-radius:0 6px 6px 0; }
.callout-title { display:block; font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.06em; color:var(--ink-2); margin-bottom:4px; }
.doc hr { border:0; border-top:1px solid var(--rule); margin:2em 0; }
.tbl { overflow-x:auto; border:1px solid var(--rule); border-radius:6px; scrollbar-width:thin; }
.tbl table { border-collapse:collapse; font-size:13px; line-height:1.45; min-width:100%; }
.tbl th { background:var(--thead); text-align:left; font-weight:600; color:var(--head); font-size:12.5px; }
.tbl th,.tbl td { padding:7px 11px; vertical-align:top; min-width:10ch; max-width:44ch; border-top:1px solid var(--rule-soft); }
.tbl tr:first-child th { border-top:0; }
.tbl td + td,.tbl th + th { border-left:1px solid var(--rule-soft); }
.code,.mmd,.fm { border:1px solid var(--code-rule); border-radius:6px; background:var(--code-bg); overflow:hidden; }
.blk-head { display:flex; align-items:center; justify-content:space-between; gap:8px; height:26px; padding:0 6px 0 11px;
  border-bottom:1px solid var(--code-rule); font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-4); letter-spacing:.04em; }
.blk-tools { display:flex; gap:4px; }
.mini { width:56px; height:19px; border-radius:4px; color:var(--ink-3); font-size:10.5px; border:1px solid transparent; }
.mini:hover { border-color:var(--rule); color:var(--ink); background:var(--chrome2); }
.code pre { margin:0; padding:11px 14px 12px; overflow-x:auto; font-family:"JetBrains Mono",monospace; font-size:12.5px; line-height:1.58; color:var(--prose); scrollbar-width:thin; }
.code pre code { background:none; border:0; padding:0; font-size:inherit; overflow-wrap:normal; }
.mmd-body { padding:16px 12px; overflow-x:auto; text-align:center; min-height:64px; scrollbar-width:thin; }
.mmd-body svg { max-width:100%; height:auto; }
.mmd.natural .mmd-body svg { max-width:none; }
.mmd.stale .mmd-body { opacity:.42; }
.mmd-wait { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-4); padding:18px 0; }
.mmd-src { text-align:left; margin-top:8px; font-family:"JetBrains Mono",monospace; font-size:12px; line-height:1.55; color:var(--prose-2); white-space:pre; overflow-x:auto; }
.mmd-err { font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--del-ink); text-align:left; }
.fm dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; padding:10px 14px; font-family:"JetBrains Mono",monospace; font-size:12px; }
.fm dt { color:var(--ink-4); } .fm dd { color:var(--prose-2); overflow-wrap:anywhere; }
.footnotes { font-size:13.5px; color:var(--prose-2); }

/* highlight.js → theme tokens */
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-doctag { color:var(--k-key); }
.hljs-string,.hljs-regexp,.hljs-addition { color:var(--k-str); }
.hljs-number,.hljs-symbol,.hljs-bullet { color:var(--k-num); }
.hljs-comment,.hljs-quote { color:var(--k-com); font-style:italic; }
.hljs-title,.hljs-section,.hljs-function .hljs-title,.hljs-title.function_ { color:var(--k-fn); }
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable,.hljs-property { color:var(--k-attr); }
.hljs-built_in,.hljs-type,.hljs-title.class_ { color:var(--k-bi); }
.hljs-meta,.hljs-params,.hljs-subst { color:var(--k-meta); }
.hljs-deletion { color:var(--del-ink); }

/* ════ change marks ════════════════════════════════════════════════ */
.mk { position:absolute; width:3px; border-radius:1.5px; pointer-events:auto; cursor:pointer; transition:opacity .6s, background-color .6s, width .3s; }
.mk::after { content:""; position:absolute; inset:-3px -7px; }
.mk.unseen { background:var(--gold); }
.mk.unseen.mod { background:repeating-linear-gradient(to bottom, var(--gold) 0 6px, transparent 6px 8px); }
.mk.seen { background:var(--seen); width:2px; }
.mk.tomb { width:0; height:0 !important; border-radius:0; background:none !important; border-left:7px solid var(--gold); border-top:5px solid transparent; border-bottom:5px solid transparent; }
.mk.tomb.seen { border-left-color:var(--seen); border-left-width:5px; }
.mk.point { width:9px; height:9px !important; transform:rotate(45deg); border-radius:1px; background:var(--gold); margin-left:-3px; }
.mk:hover { filter:brightness(1.25); }
.mk.flash { animation:mkflash 1.2s ease-out; }
@keyframes mkflash { 0%,40% { box-shadow:0 0 0 3px var(--gold-faint); } 100% { box-shadow:0 0 0 0 transparent; } }
.jumpflash { animation:jf 1.6s ease-out; }
@keyframes jf { 0% { background-color:var(--gold-ghost); } 100% { background-color:transparent; } }
/* inline diff */
.d-add,.d-mod,.d-check { background:var(--add-bg); border-radius:3px; box-shadow:-8px 0 0 var(--add-bg), 8px 0 0 var(--add-bg); }
tr.d-add,tr.d-mod { box-shadow:none; }
.doc ins { background:var(--ins-bg); text-decoration:none; border-radius:2px; padding:0 1px; }
.doc del + ins, .doc ins + del { margin-left:3px; }
.doc del { background:var(--del-bg); color:var(--del-ink); text-decoration:line-through; text-decoration-color:var(--del-ink); border-radius:2px; padding:0 1px; }
.diffx { font-family:"JetBrains Mono",monospace; font-size:12px; line-height:1.55; color:var(--del-ink); background:var(--del-bg);
  border-radius:4px; padding:7px 11px 8px; list-style:none; white-space:pre-wrap; overflow-wrap:anywhere; }
.diffx .wh { display:block; color:var(--ink-4); font-size:10.5px; letter-spacing:.05em; margin-bottom:3px; }
.diffx .dl { display:block; text-decoration:line-through; text-decoration-color:rgba(214,120,110,.55); }
li.diffx { margin-left:-1.45em; }
tr.diffx td { background:var(--del-bg); border-radius:0; }
/* agent note (c11 markdown point) */
.pnote { border-left:2px solid var(--gold); background:var(--gold-ghost); border-radius:0 6px 6px 0; padding:9px 12px 10px; }
.pn-h { display:flex; align-items:center; gap:10px; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--gold-ink); letter-spacing:.04em; }
.pn-h .pn-who { color:var(--ink-4); flex:1; }
.pn-b { margin-top:4px; font-size:14.5px; color:var(--head); }
.pn-ack { height:21px; width:62px; border:1px solid var(--gold-faint); border-radius:5px; color:var(--gold-ink); font-family:"JetBrains Mono",monospace; font-size:10.5px; }
.pn-ack:hover { background:var(--gold-faint); }
.pnote.seen { border-left-color:var(--seen); background:var(--rule-soft); }
.pnote.seen .pn-h { color:var(--ink-3); }

/* ════ source view ═════════════════════════════════════════════════ */
.src { font-family:"JetBrains Mono",monospace; font-size:12.5px; line-height:1.62; padding:16px 0 140px; color:var(--prose); }
.sl { display:flex; min-height:1.62em; }
.sl .ln { flex:none; width:4.5ch; text-align:right; padding-right:14px; color:var(--ink-4); user-select:none; font-variant-numeric:tabular-nums; }
.sl .tx { flex:1; min-width:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.sl.d-add,.sl.d-mod,.sl.d-check { box-shadow:none; border-radius:0; }
.sl.del { background:var(--del-bg); color:var(--del-ink); }
.sl.del .tx { text-decoration:line-through; text-decoration-color:rgba(214,120,110,.5); }
.sx-h { color:var(--head); font-weight:600; } .sx-m { color:var(--ink-4); } .sx-c { color:var(--k-str); } .sx-f { color:var(--k-meta); } .sx-b { color:var(--head); font-weight:500; }

/* ════ overlays: rail, pill, find, point chip ═══════════════════════ */
.rail { position:absolute; top:6px; bottom:6px; right:3px; width:9px; z-index:4; cursor:pointer; }
.rail .rv { position:absolute; left:0; right:0; border:1px solid var(--ink-4); border-radius:2px; background:var(--rule-soft); min-height:8px; }

<script id="data" type="application/json">{"docs": [{"id": "plan", "live": true, "tab": "c11-184 plan", "num": 12, "path": ".lattice/plans/task_01KYMTXQVWCXCF0TGN5ZWG341E.md", "desc": "C11-184 flagged + suppressed agents: executable plan", "writer": "codex · c11-184 delegator", "src": "# C11-184 — Flagged and suppressed agents: executable implementation plan\n\n## Goal and binding inputs\n\nShip two orthogonal, persisted modifiers over the existing four-state agent lifecycle:\n\n- `flag`: a required one-line reason declaring that human action is needed.\n- `suppressed`: an operator/agent choice that removes routine attention signalling while preserving notification history.\n\nThe implementation is governed by:\n\n1. `docs/c11-flagged-agent-plan.md` (binding feature spec).\n2. `docs/c11-attention-model-skill-section.md` (exact staged skill copy).\n3. `docs/c11-mark-vocabulary.md` and shipped dependency C11-183 at `29102376f`.\n4. The repository `AGENTS.md` threading, localization, testing, tagged-build, skill-sync, and submodule rules.\n\nBase gate: implementation must start from `09782511b` (or a descendant containing `29102376f`). Do not rebuild or redesign the C11-183 lifecycle vocabulary.\n\n## Decisions from the seam audit\n\nThe spec wins where the current base is only forward scaffolding:\n\n- C11-183 already added `flagged` / `suppressed` fields and a `presentedState` projection to `WorkspacePulseAgent`, plus partial flagged drawing in the sidebar renderer. Those fields are not wired to metadata.\n- The shipped sidebar mark currently animates flagged working with the normal stepped fill and leaves flagged idle/cold static. The binding spec instead requires **breathe for every flagged non-waiting state** and the core-only 0.4 s violet/white square wave for flagged waiting. Replace the scaffolding behavior.\n- The shipped Bonsplit mark supports host-injected color/motion internally, but a tab carries only `activityState`; c11 cannot yet send a per-surface modifier, violet tint, alarm alternate color, or explicit flag motion to the surface-tab renderer. Extend the generic Bonsplit host-presentation seam rather than adding c11-specific `flagged` semantics to Bonsplit.\n- `WorkspaceContentView` currently folds Static marks, Reduce Motion, app/workspace activity into one Bonsplit animation permission. That cannot express “Static marks disables base motion, but flag motion still runs; Reduce Motion disables both.” Split the generic host policy into base-motion and explicit/attention-motion eligibility.\n- `TerminalNotificationStore` has only raw unread indexes, emits `waiting.entered` from raw per-tab counts, and decides external delivery without consulting attention metadata. It needs distinct raw-history and signal-eligible indexes.\n- `SurfaceMetadataStore` has no typed attention snapshot or enumeration by flag age. Oldest-first `flag.list` and the flag phase of Option-V need a bounded typed index/query using the metadata source timestamp as the raise time.\n- The spec’s “true state” wording means the raw derived lifecycle remains available internally, while every human-facing projection for an unflagged suppressed surface presents waiting as idle. A suppressed+flagged surface exposes the true lifecycle and the flag wins.\n- The current Waiting Agent footer is app/window-global through the shared notification store. The Flagged Agents row follows that existing scope; this does not add the explicitly out-of-scope cross-workspace dashboard/aggregation surface.\n\n## Architecture and data flow\n\n### Canonical truth and typed projection\n\nAdd canonical metadata keys:\n\n- `MetadataKey.flag = \"flag\"`: non-empty, trimmed, single-line string; cap at 256 characters.\n- `MetadataKey.suppressed = \"suppressed\"`: strict JSON Boolean.\n\nBoth are written at `.explicit`, survive the existing session snapshot/autosave path, and remain visible through `get-metadata`. `flag` absence means lowered. `suppressed == true` means suppressed; absent/false means ordinary.\n\nBuild one typed attention seam (new `Sources/AttentionModel.swift`, or an equivalently isolated file if review finds a better existing home):\n\n- `SurfaceAttentionSnapshot`: workspace id, surface id, optional flag reason, flag raise timestamp, suppressed Boolean.\n- Pure presentation reducer:\n  - raw `waiting` + suppressed + not flagged -> presented `idle`;\n  - otherwise raw lifecycle is unchanged;\n  - flag color/motion overrides suppression;\n  - suppression never deletes raw notification history.\n- A main-actor observable index/coordinator that mirrors the canonical store for active surfaces, provides `flaggedCount`, oldest-first active flags, signal eligibility, and per-surface snapshots.\n- One serialized `SurfaceAttentionService` (name may vary, responsibility may not) owns the complete commit boundary: canonical metadata write/clear, original active-epoch timestamp, typed projection/index refresh, signal-index refresh, event emission, and optional direct system delivery. A mutating socket response is sent only after that whole commit is observable. Do not make `TabItemView` or a keystroke path query the metadata store.\n- The generic `surface.set_metadata` / `surface.clear_metadata` routes may not bypass that boundary. Route writes, keyed clears, replace/clear-all operations touching `flag` or `suppressed` through the service (or reject those keys there with a precise protocol error and require the flag family). Snapshot restore, launch stamping, detach/transfer, close, and prune also enter through explicit service hooks. Add adversarial coverage for every bypass.\n- Metadata remains authoritative; the observable index is a bounded render/query cache, not a second persistence system.\n\nMutation semantics:\n\n1. `raise(reason)` validates before mutation, writes the canonical reason, records/reuses the original active-epoch timestamp, publishes the active flag, emits `flag.raised {reason}`, refreshes render/signal projections, then delivers the separate direct flag system notification even when the surface is suppressed. This one direct-delivery branch is the operator's Phase 3 decision; routine waiting-derived delivery remains suppressed independently. An active-to-active reason revision preserves that original timestamp, emits one new `flag.raised` event and one updated direct notification, but never creates a second queue entry. Only an explicit lower followed by a new raise starts a new epoch and moves the flag to the back.\n2. `lower(by)` clears `flag`, publishes the transition, emits `flag.lowered {by}`, and never marks notification history read.\n3. `suppress(by)` writes `true`, refreshes signal eligibility immediately (including an already-unread notification), emits `flag.suppressed {by}`, and cancels/removes any pending routine external notification for that surface without deleting its in-app record.\n4. `unsuppress(by)` clears or writes false consistently, refreshes signal eligibility immediately, and emits `flag.unsuppressed {by}`. An existing unread record becomes signal-eligible again and may create the correct 0->1 waiting edge; it does not manufacture a second record.\n5. Repeating an identical mutation is idempotent: no duplicate event, system notification, queue-age reset, or revision churn. Relaunch/restore preserves the active epoch for both identical and revised reasons.\n\nThe `by` vocabulary is exactly `operator | agent`. Banner dismissal is always `operator`; agent CLI lower/suppress/unsuppress defaults to `agent`, with an explicit socket field for trusted operator-originated actions. Launch-time modifiers are operator-originated.\n\n### Attention signalling versus notification history\n\nRefactor `TerminalNotificationStore.NotificationIndexes` to retain both views:\n\n- Raw unread/history indexes: every unread record, including suppressed surfaces.\n- Signal-eligible unread indexes: surface-less notifications plus surface notifications for which `!(suppressed && !flagged)`.\n\nUse signal-eligible indexes for:\n\n- Waiting Agent badge/count and lit state.\n- Workspace waiting demand and exact-surface waiting projection.\n- `waiting.entered` / `waiting.left` 0<->1 edges.\n- Option-V waiting fallback.\n- menu-bar/unread affordances that would otherwise leak a suppressed completion as a signal.\n\nKeep raw indexes for the notifications list/history and explicit reads. The list must still show the suppressed notification record and permit marking/removing it.\n\nAt `addNotification`:\n\n- Always create/update the in-app record.\n- Always settle liveness to idle as today.\n- Do not deliver the normal system notification when the target surface is suppressed, regardless of flag state; the feature spec explicitly says suppressed surfaces deliver no system notification.\n- A raised flag’s system notification is a separate direct delivery path and never inserts a `TerminalNotification`.\n\nWhen attention metadata changes while notifications already exist, rebuild only signal eligibility and emit the real edge transition. Avoid rewriting `notifications` merely to force `didSet`.\n\n### Lifecycle and rendering\n\nExtend `SurfaceTabActivityResolver` (or introduce a sibling pure reducer) to consume the typed attention snapshot:\n\n- Agent, no exact unread: `working` / `idle` / `cold` as today.\n- Exact unread, ordinary: `waiting`.\n- Exact unread, suppressed and unflagged: `idle`.\n- Exact unread, suppressed and flagged: `waiting`.\n\nPopulate `WorkspacePulseAgent.flagged` and `.suppressed` from the precomputed attention snapshot in the parent sidebar census. Add `WorkspacePulseSummary.flaggedCount`; dominant attention precedence is flagged > waiting > working > idle > cold without adding a `WorkspacePulseState` case. Counts and row ordering use `presentedState`.\n\nFor the two mark renderers:\n\n- Lifecycle stays encoded by the C11-183 shape.\n- Flag applies flat violet (`#9D8AD9` starting value, dialled in the tagged build).\n- Suppression has no tint, dim, badge, or label.\n- Unflagged suppressed working is a static full grid.\n- Flagged waiting: steady violet frame; 4 pt core alternates violet/white on a hard 0.4 s square wave; no base dip or breathe.\n- Flagged working/idle/cold: whole-mark slow opacity breathe; no stepped fill/dip concurrently.\n- Reduce Motion renders every combination statically.\n- Static marks disables only base stepped fill/dip. It does not disable flag breathe/flash.\n- All motion is leaf-isolated, opacity/color only, uses the one shared clock and stable surface-id phase offset, and unsubscribes off-screen, in collapsed/unselected workspaces, or while the app is inactive.\n\nKeep Bonsplit generic:\n\n- Add a public, optional per-tab activity-presentation value (color override, explicit motion channel, alternate core color), or equivalent generic host-injection fields.\n- Add a generic `breathe` motion sampler/channel.\n- Separate generic base-motion permission from explicit-motion permission so c11 can apply Static marks and Reduce Motion correctly.\n- Carry the optional presentation through `Tab`, `TabItem`, controller create/update, transfer, and decode-with-default paths.\n- Do not name flag/suppression in Bonsplit public types. This extension is a reasonable upstream candidate because it is generic host-controlled mark presentation; flag it in the PR rather than opening an upstream PR during this task.\n\n### Flag navigation\n\nExtract a pure attention-jump selector:\n\n1. Active flags ordered by original raise timestamp ascending (oldest first), stable tie-break by workspace/surface UUID.\n2. Skip stale/unopenable surfaces and try the next flag.\n3. If no flag opens, choose the latest signal-eligible unread notification (existing newest-first stack behavior).\n\n`jumpToLatestUnread()` may be renamed internally to reflect the broader semantics, but all existing call sites and the Option-V binding stay one action. The Flagged Agents row invokes this exact selector. Opening a flagged surface passes no notification id and does not lower the flag. The banner X/agent command is the only lower path.\n\n### In-surface banner and system notification\n\nMount a distinct `NSHostingView<SurfaceFlagBanner>` from `GhosttySurfaceScrollView`, following the existing `SurfaceSearchOverlay` ownership and z-order pattern:\n\n- top edge, below the surface title bar, floating over terminal pixels;\n- no layout participation and therefore no PTY resize;\n- flag glyph, single-line/truncated reason, localized accessibility label/help, localized dismiss control;\n- X calls `lower(by: .operator)` and restores terminal focus without synthesizing terminal input;\n- update/remove the host only on attention transitions; do not touch `TerminalSurface.forceRefresh()` or `WindowTerminalHostView.hitTest()`.\n\nDefine z-order explicitly against find, pane-interaction, keyboard-copy, notification-ring, and flash overlays so both the banner and find field remain operable.\n\nUse the existing notification authorization/sound/custom-command machinery for direct flag delivery:\n\n- title = current surface title/fallback;\n- body = flag reason;\n- `userInfo` contains workspace/surface ids so click focuses the surface;\n- no `TerminalNotificationStore` record and no waiting count;\n- one explicit direct-delivery branch where flag raise pierces suppression; routine\n  notification-store delivery remains suppressed independently;\n- repeated identical raise is not redelivered.\n\n## Owned files and seams\n\nExpected primary files:\n\n- `Sources/AttentionModel.swift` (new typed reducer/index/coordinator; add target membership deliberately).\n- `Sources/SurfaceMetadataStore.swift` (canonical keys, strict validation, timestamped typed snapshot support).\n- `Sources/Sidebar/SidebarActivityProjector.swift` (flagged count and precedence; retain four lifecycle cases).\n- `Sources/SurfaceLivenessDeriver.swift` (suppression-aware surface-tab projection).\n- `Sources/TerminalNotificationStore.swift` (raw versus signal indexes, edge/delivery filtering, direct flag notification seam).\n- `Sources/Workspace.swift` (attention mirror, lifecycle/presentation sync, launch-time atomic stamp, restore/close handling).\n- `Sources/ContentView.swift` (precomputed modifiers, flagged row, correct sidebar mark motion/accessibility).\n- `Sources/WorkspaceContentView.swift` (base versus explicit motion environment policy).\n- `Sources/GhosttyTerminalView.swift` (portal-hosted flag banner only; no hot-path changes).\n- `Sources/AppDelegate.swift` (priority jump selector use and flag-notification response focus).\n- `Sources/Events/EventEnvelope.swift` and `Sources/Events/EventEmitter.swift` (four event types/helpers).\n- `Sources/SocketHandlers/SocketDispatch.swift`, a focused attention handler file if added, and `Sources/SocketHandlers/SystemHandlers.swift` (flag domain routing and method listing).\n- `Sources/SocketHandlers/SurfaceHandlers.swift` (generic metadata bypass prevention and attention commit-before-response ordering).\n- `CLI/c11.swift` (commands, launch flags, help, global usage).\n- `Sources/DefaultAgentResolver.swift` only if the launch request needs to carry validated attention intent; do not contaminate command composition if handler-owned fields suffice.\n- `Resources/Localizable.xcstrings`.\n- `skills/c11/SKILL.md` (exact staged section).\n- `GhosttyTabs.xcodeproj/project.pbxproj` only for real target membership. If the Ruby xcodeproj tool is used, review semantic membership/build evidence rather than hand-fighting normalization.\n\nBonsplit submodule files likely required:\n\n- `vendor/bonsplit/Sources/Bonsplit/Public/BonsplitActivityAnimationClock.swift`.\n- `vendor/bonsplit/Sources/Bonsplit/Public/BonsplitEnvironment.swift`.\n- `vendor/bonsplit/Sources/Bonsplit/Public/Types/Tab.swift`.\n- `vendor/bonsplit/Sources/Bonsplit/Public/BonsplitController.swift`.\n- `vendor/bonsplit/Sources/Bonsplit/Internal/Models/TabItem.swift`.\n- `vendor/bonsplit/Sources/Bonsplit/Internal/Views/TabItemView.swift` and any alternate/compact tab-bar mark call sites.\n\nBecause Bonsplit is a submodule: check out local `main`, fast-forward it to `origin/main`, then commit and push to remote `main` before committing the parent pointer. Verify the submodule is not detached and `git merge-base --is-ancestor HEAD origin/main`. Keep the change generic and offer it upstream in the handoff.\n\nExpected behavior tests and target ownership:\n\n| Coverage | File(s) | Target/executor |\n|---|---|---|\n| Pure reducer/index/jump, summary precedence, liveness projection, metadata validation/restore, event envelopes, notification index builder | `c11Tests/AttentionModelTests.swift`, `SidebarActivityProjectorTests.swift`, `SurfaceLivenessDeriverTests.swift`, `SurfaceMetadataStoreValidationTests.swift`, `EventLogTests.swift`, `NotificationAndMenuBarTests.swift` | `c11LogicTests`, executed only by PR CI |\n| AppKit/portal ownership, notification delivery, live socket mutation response ordering | focused files under `c11Tests/` | host-bound `c11Tests`, executed only by PR CI |\n| Tagged runtime CLI/socket behavior | focused `tests_v2` cases | tagged debug socket during validation and PR CI as applicable |\n| Generic mark presentation/animation | Bonsplit’s existing test files | Bonsplit test target, executed only by PR CI |\n\nValidate target membership for `AttentionModel.swift` and every new/changed test file with `xcodebuild -list`, `build-for-testing`, and project membership inspection; do not run a local test action.\n\nDo not add source-text, plist-text, AST, or grep tests.\n\n## Implementation phases\n\n### Phase 0 — ancestry and baseline\n\n1. Confirm worktree HEAD descends from `09782511b` and contains `29102376f`.\n2. Provision submodules and the `GhosttyKit.xcframework` symlink if the implementation worktree is fresh.\n3. Record clean scoped status and the passing baseline Debug compile. Do not run any local test action; assertion baselines and all XCTest evidence come from PR CI.\n4. Before touching Bonsplit, enter the submodule, check out local `main`, fetch `origin`, and fast-forward local `main` to `origin/main`. Confirm `git symbolic-ref --short HEAD` is `main`. Commit and push only that branch; before the parent pointer commit, verify the submodule HEAD is on `main`, equals or is an ancestor of `origin/main`, and is reachable from the pushed remote.\n\n### Phase 1 — canonical model and pure logic\n\n1. Add/validate canonical keys and typed snapshots.\n2. Implement the pure attention presentation reducer and oldest-first selector.\n3. Add flagged summary precedence/count without changing lifecycle enum cases.\n4. Add all four event taxonomy cases and emission helpers.\n5. Land adversarial logic tests before wiring UI.\n\nGate: canonical state round-trips through snapshot restore; invalid/blank/multiline/oversize reasons and non-Boolean suppression fail before mutation.\n\n### Phase 2 — primitives and launch\n\n1. Add socket routing/methods `flag.raise`, `flag.lower`, `flag.list`, `flag.suppress`, `flag.unsuppress`.\n2. Add CLI commands:\n   - `c11 raise-flag --surface <s> \"<reason>\"`\n   - `c11 lower-flag --surface <s>`\n   - `c11 suppress --surface <s>`\n   - `c11 unsuppress --surface <s>`\n3. Require an explicit non-empty surface ref for mutations; preserve the C11-165 no-focused-fallback write policy.\n4. Add `launch-agent --flag \"<reason>\"` and `--suppressed`; permit both simultaneously.\n5. Validate launch modifiers before creating a surface and stamp them before typing the agent launch line, so a fast completion cannot escape suppression.\n6. Return attention fields in machine-readable launch/list results without changing plain ref summaries.\n\nSocket execution contract: parse and validate on the socket worker, then apply the mutation on the main actor and respond. The handlers must not activate c11, raise windows, select workspaces, or mutate in-app focus.\n\nGate: idempotency, attribution, error codes, persistence, cross-workspace explicit targeting, no focus steal for mutation commands, and correct launch ordering are behavior-tested.\n\n### Phase 3 — notification signal layer and navigation\n\n1. Split raw and signal-eligible indexes.\n2. Rebase waiting edges, counts, exact-surface demand, and external delivery on signal eligibility.\n3. Refresh eligibility when flag/suppression changes without mutating notification history.\n4. Add direct flag system notification delivery.\n5. Wire oldest-flag-first then latest-waiting navigation.\n\nGate: the headline matrix works in logic/integration tests:\n\n| Flag | Suppressed | Unread/stop result | Waiting signal | External notification |\n|---|---:|---|---|---|\n| no | no | waiting | yes | existing behavior |\n| no | yes | idle, record retained | no | no |\n| yes | no | true lifecycle, violet | flag priority | flag raise direct delivery |\n| yes | yes | true lifecycle, violet | flag priority | none (suppressed) |\n\n### Phase 4 — both renderers and sidebar row\n\n1. Complete the generic Bonsplit presentation seam and breathe sampler.\n2. Feed computed state/modifiers into surface tabs and workspace-card marks.\n3. Split base/explicit motion policy and audit off-screen/background unsubscribe.\n4. Add `Flagged Agents` above `Waiting Agent`, on demand only, violet fill/void text/hairline/no motion, count badge, same jump action.\n5. Update accessibility values so flag reason/flag state are announced without claiming suppression visually.\n\nGate: no `@EnvironmentObject`, `@ObservedObject`, or store read enters Bonsplit `TabItemView`/the equatable c11 sidebar row body; all modifier data is immutable/precomputed.\n\n### Phase 5 — portal banner\n\n1. Add the AppKit-owned banner host and attention-transition updates.\n2. Implement operator dismissal and focus restoration.\n3. Exercise coexistence/z-order with find, pane interaction, copy badge, notification ring, flash, split churn, and surface close.\n\nGate: raising/lowering never changes PTY rows/columns or terminal geometry, and no stale overlay survives close/detach/restore.\n\n### Phase 6 — localization and skill contract\n\n1. Stabilize English `String(localized:defaultValue:)` keys first.\n2. Launch a fresh translator stage in a new c11 surface to fill Japanese, Ukrainian, Korean, Simplified Chinese, Traditional Chinese, and Russian in `Resources/Localizable.xcstrings`.\n3. Validate placeholders/plurals and inspect changed locale entries; do not hand-author translations in product code.\n4. Copy the staged section from `docs/c11-attention-model-skill-section.md` into `skills/c11/SKILL.md` exactly, adjusting only if a shipped command contract necessarily changed and updating the staged source at the same time.\n5. After the skill-source commit, run `scripts/sync-installed-skills.sh c11`, then diff/verify the live installed copy while preserving `.c11-skill.json`.\n\nGate: no new bare user-facing strings; source and installed skill describe commands that actually exist.\n\n## Behavior-level test checklist\n\n- Metadata:\n  - valid reason/Boolean accepted at explicit tier;\n  - blank, whitespace-only, multiline, non-string, over-cap reason rejected atomically;\n  - non-Boolean suppression rejected;\n  - restore preserves reason, suppression, source, and original raise timestamp;\n  - repeated identical raise preserves queue age/revision.\n- Modifier reducer:\n  - every lifecycle × flag × suppression combination;\n  - suppression maps only unflagged waiting to idle;\n  - flag overrides suppression;\n  - lifecycle enum remains four cases.\n- Events:\n  - exact type/payload for raised/lowered/suppressed/unsuppressed;\n  - `by` limited to operator/agent;\n  - idempotent calls produce no duplicate event.\n- Notifications:\n  - suppressed unread remains in raw list and can be read/removed;\n  - it contributes zero signal count and no waiting edge/external delivery;\n  - suppressing an already-unread surface emits the correct waiting-left edge;\n  - unsuppressing an unread surface emits the correct waiting-entered edge;\n  - flag overrides suppression for lifecycle/signal projection and the separate direct flag\n    system-delivery path; routine waiting-derived delivery remains suppressed;\n  - flag raise direct delivery does not add a notification-store record or waiting count.\n- Navigation:\n  - oldest flag wins over newer flag and every unread;\n  - stale/unopenable flag is skipped;\n  - no flag falls back to latest signal-eligible unread;\n  - suppressed unread is skipped;\n  - opening a flag neither lowers it nor marks unrelated history read.\n- Launch/socket/CLI:\n  - missing reason -> `invalid_params`;\n  - missing/empty surface ref rejected;\n  - `--flag` + `--suppressed` accepted together and stamped before command delivery;\n  - `flag.list` is deterministic oldest-first and contains refs/reason/timestamp/suppression;\n  - mutators do not focus/raise the app.\n- Rendering policy:\n  - flagged working/idle/cold select breathe;\n  - flagged waiting selects binary flash only;\n  - Static marks disables base motion only;\n  - Reduce Motion disables all;\n  - suppressed unflagged working is static;\n  - hidden/background marks unsubscribe from the single clock.\n\n## Compile and CI gates\n\nIterate locally on the safe `c11-logic` scheme for pure-model work; leave host-bound\n`c11Tests` to PR CI, which remains the gate for every assertion.\n\n1. Build the app with `xcodebuild ... build` in Debug and Release.\n2. Compile both test targets with `build-for-testing` only, using an isolated tagged\n   DerivedData path for this worktree. Treat this strictly as a link/membership check, never\n   as proof that an assertion passed.\n3. Run relevant Python socket tests only against the tagged build socket, never production\n   state and never an untagged DEV app.\n4. Run `git diff --check`; validate `xcodebuild -list`, target file membership, and Release\n   compilation (especially any DEBUG-only `dlog`).\n5. Push and require the repository PR checks, including their real test actions. CI is the\n   sole test executor for this ticket.\n6. Trigger the GitHub E2E workflow; do not run UI/E2E tests locally.\n\n## Tagged runtime, visual, and latency validation\n\nBefore computer-use automation, obtain explicit operator\napproval and record it in a Lattice comment: approved tool/surface, the local tagged c11 app,\nthe exact flag/suppression/Option-V/banner/mark flows and interactions, and the\ndata/credential boundary (no credentials, external domains, production state, or\nconsequential external actions). Use only one tagged launch and suppress startup dialogs;\nbecause `reload.sh` both builds and launches, do not launch the same tag a second time:\n\n```bash\nC11_QA_LAUNCH=fresh ./scripts/reload.sh --tag c11-184-attention\n```\n\nRecord the tagged bundle path, PID, and exact debug socket before exercising it. All\nDebug/build-for-testing compilation uses the isolated DerivedData path assigned to this\ntag/worktree.\n\nCapture screenshots and a short validation record for:\n\n1. Ordinary working/waiting/idle/cold marks in both renderers.\n2. A flag raised mid-working: both marks snap violet; reason banner appears without geometry change.\n3. Flagged waiting: steady violet frame and core-only violet/white flash.\n4. Flagged idle/cold breathe.\n5. Static marks on: base motion stops, flag motion continues.\n6. Reduce Motion on: all motion stops while violet/shape/row/banner signals remain.\n7. Suppressed completion: idle mark, no Flagged/Waiting count, no Option-V destination, no system notification, record visible in notifications list.\n8. Suppressed+flagged: violet true lifecycle and flag priority/banner; direct flag raise system\n   notification delivers while routine waiting-derived delivery stays barred.\n9. Two flags with controlled timestamps: Option-V and row click visit oldest first; opening does not clear; X clears and next press advances.\n10. Find overlay/banner coexistence, split churn, close/detach, background workspace, collapsed pane, and scrolled-out tab behavior.\n\nBefore declaring the visual run successful, inspect `c11 tree --no-layout`; rebalance unreadable panes and retain screenshots of the final legible layout.\n\nFleet-scale latency protocol:\n\n1. Use the same tagged build/machine, fixed window geometry, terminal workload, and at least 20 active agent surfaces so 40+ marks exist across surface tabs and sidebar cards.\n2. Capture p50/p95 keystroke-to-paint timing for:\n   - static marks baseline;\n   - full default base motion;\n   - dip-only candidate;\n   - flag motion with several representative flags;\n   - background/unselected workspaces (subscriber count must drop).\n3. Hard pass criterion: feature-on p95 delta versus the static baseline is **<= 1 ms**, with no subjective typing degradation and no unexpected body churn in `TabItemView`.\n4. Inspect the shared-clock subscriber count: one timer only; visible eligible leaf count, not total fleet count; no subscriptions for background/off-screen/collapsed marks.\n5. If the gate fails, apply the pre-registered ladder and rerun:\n   - disable stepped fill by default, retain dip if it passes;\n   - if dip fails, ship base marks static;\n   - independently, if flag motion fails, ship flags static violet.\n6. Record raw numbers, configuration, screenshots, and the chosen rung in the validation artifact and PR.\n\n## Acceptance checklist\n\n- [ ] C11-183 ancestry present; lifecycle vocabulary/9 pt geometry unchanged.\n- [ ] Flag and suppression are separate canonical explicit metadata fields and survive relaunch.\n- [ ] Required reason is validated as one non-empty line.\n- [ ] Flags are sticky and clear only by explicit operator/agent lower.\n- [ ] Suppressed unflagged surfaces never present waiting.\n- [ ] Suppressed notification history survives while every routine signal channel is filtered.\n- [ ] Flag overrides suppression for lifecycle, violet treatment, banner, queue priority, and flag motion.\n- [ ] Suppressed+flagged direct delivery pierces suppression at one isolated flag-delivery\n      branch; routine suppressed notification-store delivery remains barred.\n- [ ] `flag.list` and Option-V use oldest-first flags; waiting remains latest-first.\n- [ ] No second shortcut is added.\n- [ ] Flagged Agents row is above Waiting Agent and has zero footprint at count zero.\n- [ ] Portal banner does not resize/garble the PTY.\n- [ ] Flag raise does not write `TerminalNotificationStore`.\n- [ ] All four attention events carry the specified payload.\n- [ ] `launch-agent --flag` / `--suppressed` work independently and together, before process command delivery.\n- [ ] Both mark renderers agree for every modifier/lifecycle combination.\n- [ ] Static marks and Reduce Motion precedence match the spec.\n- [ ] PR CI test actions are green at the final head SHA.\n- [ ] The ten tagged-build visual scenarios are captured with screenshots and a validation record.\n- [ ] The 20-agent <=1 ms p95 fleet-latency gate passes, or the chosen fallback rung is recorded.\n- [ ] Six locale translations are complete and validated.\n- [ ] Staged skill text lands, installed c11 skill is synced and verified.\n- [ ] Bonsplit submodule commit is pushed/reachable before parent pointer commit.\n- [ ] Fresh independent code review has no unresolved correctness, threading, focus, accessibility, persistence, localization, or performance findings.\n\n## Review and PR gates\n\n1. Commit in coherent units: model/tests; primitives/launch; signal/navigation; renderer/submodule; banner/UI; localization/skill.\n2. After architecture is accepted, use a bounded review budget: one fresh correctness/threading review, one focused fix pass, one terminal re-review.\n3. Reviewer must inspect:\n   - no raw/signal count leakage;\n   - no main-thread sync on telemetry paths;\n   - no focus steal from socket mutations;\n   - no store reads/observation added to typing-hot views;\n   - restore/close/detach cleanup;\n   - event idempotency and attribution;\n   - notification versus flag double-count prevention;\n   - submodule reachability and generic API naming;\n   - exact skill/runtime command agreement.\n4. Attach review and running-system validation evidence before `pr_open`.\n5. Open a draft PR only after local scoped checks and submodule push. Do not merge, tag, release, notarize, publish, or update production as part of C11-184.\n\n## Risks and mitigations\n\n- **Raw/signal index drift:** one pure index builder with explicit eligibility input; transition tests for suppress/unsuppress over existing unread records.\n- **Metadata cache divergence:** metadata is canonical; cache hydrates from it on restore and is pruned with surfaces; revisions/tests cover idempotency.\n- **Race at launch:** validate and stamp modifiers before typing the launch line.\n- **Flag duplicated as waiting:** direct flag notification bypasses `TerminalNotificationStore`; tests assert zero record/count.\n- **Spec precedence implemented differently in two renderers:** one shared pure presentation value/sampler, matrix tests, screenshot pairs.\n- **Static/Reduce Motion conflation:** separate base and explicit motion gates; Reduce Motion is the final hard override.\n- **Broad SwiftUI invalidation/typing lag:** immutable precomputation, leaf subscriptions only, one timer, 20-agent numeric gate and fallback ladder.\n- **Banner focus/z-order regressions:** AppKit portal owner, explicit z-order matrix, focus-restoration and split-churn runtime tests.\n- **Flag queue age reset:** preserve source timestamp on identical raise; deterministic tie-break.\n- **Notification click ambiguity:** flag notification carries workspace/surface refs but no store id; response focuses without read/lower side effects.\n- **Bonsplit fork divergence:** generic host presentation only, push reachable main before pointer, offer upstream.\n- **pbxproj normalization noise:** prefer existing project tooling and verify semantic membership/build settings.\n- **Local test flakiness:** iterate on `c11-logic` locally and push only once green.\n- **Localization/skill drift:** translator stage after English freeze; source-to-installed skill sync is a release gate.\n"}, {"id": "messaging", "live": false, "tab": "messaging design", "num": 14, "path": "docs/c11-messaging-primitive-design.md", "desc": "c11 messaging primitive: design", "src": "# c11 Inter-Agent Messaging — Design\n\n**Status:** v1 scope locked after merged Claude + Codex review (2026-04-23). Ready for vertical-slice prototype.\n**Goal:** the smallest primitive that lets agents running in separate c11 surfaces coordinate, without c11 imposing a protocol.\n**Ticket:** [C11-13](../.lattice/notes/task_01KPYFX4PV4QQQYHCPE0R02GEZ.md)\n\n## v1 scope at a glance\n\n**Ship in v1:**\n- Filesystem contract per workspace: `$C11_STATE/workspaces/<workspace-id>/mailboxes/` with shared `_outbox/`, per-surface inboxes\n- Surface addressing via **surface names** (from CMUX-11 nameable-panes metadata); no separate mailbox-alias layer\n- Messaging config stored as **namespaced keys in the existing pane metadata** (`mailbox.delivery`, `mailbox.subscribe`, `mailbox.retention_days`); no parallel `manifest.json` file\n- Handlers: `stdin`, `silent`, `watch`\n- Topic subscribe globs in pane metadata + dispatch-time fan-out\n- Envelope schema locked as public API (JSON Schema + golden fixtures)\n- CLI + file-write parity test as drift enforcement\n- `--via-ref` / `body_ref` safety valve for oversized bodies (hard cap on inline body ~4 KB; allowlisted to per-workspace `blobs/` dir)\n- At-least-once delivery; receivers dedupe by `id`\n- Observability: append-only `_dispatch.log` NDJSON\n- Reliability: periodic `_outbox/` sweep, atomic `_processing/` dispatch marker, stale `.tmp` GC, async PTY writes with timeout\n- Per-surface inbox cap of 1000 pending envelopes; over-limit → `_rejected/` with reason `recipient_inbox_full`\n\n**Deferred to v1.1+:**\n- `exec`, `webhook`, `file-tail`, `signal` handlers (require security model first)\n- Topic discovery registry (`_topics.json`, `advertises`, `mailbox topics describe`)\n- TOON output format\n- Manifest-level auth allow/deny lists\n- Full dispatch state machine beyond the log\n\n**Out of scope:**\n- Remote workspace mailbox sync\n- Cross-user messaging\n- Ack/receipt protocol (agents build on top)\n\n---\n\n## Principles at a glance\n\n- **The filesystem is the contract for content.** Message envelopes live on disk as plain JSON files under `$C11_STATE/workspaces/<workspace-id>/mailboxes/`. Any process that can write a file can send or receive — no SDK required.\n- **Config lives in pane metadata, not a parallel file.** Delivery modes and subscriptions are stored as namespaced keys (`mailbox.delivery`, `mailbox.subscribe`, …) in the existing CMUX-11 pane metadata layer. Single source of truth; composes cleanly with CMUX-37 Blueprints/Snapshots.\n- **Surface names are mailbox aliases.** The name you set with `c11 set-title` / nameable-panes IS the messaging address. No second identity layer.\n- **Two interfaces for content, one interface for config.** Send/recv: direct file I/O **or** `c11 mailbox …` CLI, equivalent and parity-tested. Configure: `c11 mailbox configure` (wraps the same metadata commands the rest of c11 uses).\n- **Socket is for live streams, not storage.** `c11 mailbox watch` uses the socket (long-lived connection). Send / recv go through files.\n- **Delivery is framed text into the PTY** for stdin-delivery agents; for others, delivery runs through handlers declared in pane metadata. PTY writes are **asynchronous with a 500 ms timeout** — they are not the queue, the inbox is.\n- **At-least-once delivery (steady-state).** Envelopes survive dispatcher restarts for files already in `_outbox/`; the on-start scan picks them up. **Stage 2 caveat:** full at-least-once under dispatcher-crash-while-processing requires the `_processing/` recovery sweep shipping in Stage 3. **Receivers dedupe by `id`.** This is the contract.\n- **Receiver-declared, sender-hints.** Recipients declare how they want messages delivered via their own pane metadata. Senders can add attributes (`urgent: true`, …) that handlers may or may not honor.\n- **Per-workspace scoping.** Mailbox trees are sealed per workspace. Cross-workspace messaging is out of scope for v1.\n- **Grammar is the skill.** The `c11` skill teaches the XML-tag format, default protocol, file layout, and CLI shortcuts.\n\nc11 stays out of the body. Schemas, RPC, workflows, acks — all that lives in developer-land on top of this primitive.\n\n---\n\n## Proposed wire format (the PTY-framed block)\n\nXML-style tag with attributes. LLM-native (Claude, Codex, Kimi parse `<tag attr=\"value\">…<\/tag>` instantly). One line of metadata, plain-text body, one closing tag.\n\n```\n\n<c11-msg from=\"builder\" topic=\"ci-status\" id=\"01K3A2B7X\" ts=\"2026-04-23T10:15:42Z\">\nbuild green sha=abc\n<\/c11-msg>\n\n```\n\n- One leading blank line separates the block from prior output.\n- Metadata lives in attributes on the opening tag. Extensible: `urgent=\"true\"`, `reply_to=\"watcher\"`, `in_reply_to=\"01K3ABC\"`, `body_ref=\"/path/to/body\"`.\n- Body is opaque plain text between the tags.\n- One trailing blank line lets multiple blocks stack cleanly.\n\n**Escaping and injection defense.** If the body contains `<`, `>`, or `&`, c11 applies standard XML escaping on write (`&lt;`, `&gt;`, `&amp;`). This is a deliberate **security property**: a literal `<\/c11-msg>` inside a message body cannot forge a closing tag. Attribute values receive the same escaping. Skill tells the agent to unescape on read. Well-understood convention; no new invention.\n\n---\n\n## 1. Architecture at a glance\n\nThe core loop: senders write envelopes to a per-workspace shared outbox directory; c11 watches it via fsevents; on each new envelope, c11 atomically moves it into `_processing/`, resolves recipients by looking at pane metadata (delivery modes + subscribe globs), copies the envelope into recipient inboxes, runs the configured delivery handlers, and removes the envelope from `_processing/` only when all handlers have succeeded or durably failed. A periodic sweep re-scans `_outbox/` for missed events.\n\n```mermaid\ngraph TD\n    subgraph Workspace[\"c11 workspace\"]\n        A[\"Agent A<br/>name: builder\"]\n        B[\"Agent B<br/>name: watcher<br/>(pane metadata:<br/>mailbox.delivery=stdin)\"]\n        C[\"Agent C<br/>name: vim<br/>(pane metadata:<br/>mailbox.delivery=silent,watch)\"]\n    end\n\n    subgraph fs[\"$C11_STATE/workspaces/&lt;ws&gt;/mailboxes/\"]\n        OUT[\"_outbox/<br/>(shared drop zone)\"]\n        PROC[\"_processing/<br/>(dispatch in-flight)\"]\n        REJ[\"_rejected/<br/>(malformed, oversized)\"]\n        BLOBS[\"blobs/<br/>(large bodies via body_ref)\"]\n        INB_B[\"watcher/<br/>*.msg\"]\n        INB_C[\"vim/<br/>*.msg\"]\n        LOG[\"_dispatch.log<br/>(append-only NDJSON)\"]\n    end\n\n    subgraph c11_core[\"c11 core\"]\n        META[\"Pane metadata<br/>(CMUX-11 layer)<br/>mailbox.delivery<br/>mailbox.subscribe\"]\n        WATCH[\"fsevent watcher<br/>+ 5s periodic sweep\"]\n        DISP[\"Delivery Dispatcher<br/>(owns transport state)\"]\n        REG[\"Handler Registry<br/>stdin · silent · watch\"]\n        SOCK[\"socket<br/>(watch streams only)\"]\n        BADGE[\"Sidebar badge\"]\n    end\n\n    A -->|\"write envelope<br/>file\"| OUT\n    OUT -.->|fsevent or sweep| WATCH\n    WATCH --> DISP\n    DISP -->|\"atomic move\"| PROC\n    DISP -->|\"reject\"| REJ\n    DISP -->|\"resolve recipients\"| META\n    PROC -->|\"copy into<br/>recipient inbox\"| INB_B\n    PROC -->|\"copy into<br/>recipient inbox\"| INB_C\n    DISP --> REG\n    DISP --> BADGE\n    DISP --> LOG\n    REG -->|\"async PTY write<br/>500 ms timeout\"| B\n    INB_B -->|\"read + unlink<br/>(recv)\"| B\n    C -->|\"c11 mailbox watch<br/>NDJSON stream\"| SOCK\n    BLOBS -.->|\"body_ref read\"| B\n```\n\n**What each piece does**\n\n| Piece | Role |\n|---|---|\n| `_outbox/` | Shared drop zone. Any process writes envelope files here. `$C11_STATE` is mode 700. |\n| `_processing/` | Atomic move target when the dispatcher starts handling an envelope. Prevents duplicate dispatch under fsevent replay. |\n| `_rejected/` | Malformed, oversized, or otherwise invalid envelopes land here with a sibling `.err` file explaining why. |\n| `blobs/` | Allowlisted location for `body_ref` payloads. Senders use this for bodies >4 KB. Recipients read directly. |\n| Per-surface inboxes | `$C11_STATE/workspaces/<ws>/mailboxes/<surface-name>/` contains pending `.msg` envelopes. Recv = list, read, unlink. Directory named after the surface (from CMUX-11 nameable-panes metadata). |\n| `_dispatch.log` | Append-only NDJSON dispatch record, one line per dispatch event. Cheapest high-leverage observability. |\n| **Pane metadata (CMUX-11)** | Source of truth for per-surface config: `mailbox.delivery`, `mailbox.subscribe`, `mailbox.retention_days`. Dispatcher reads via c11's existing metadata APIs, not via filesystem. |\n| fsevent watcher + sweep | Watches `_outbox/` for new `.msg` files, plus a periodic 5-second sweep as belt-and-suspenders. |\n| Delivery Dispatcher | **Owns transport state** (not stateless): fsevent dedupe, quarantine, stale-tmp GC, handler invocation, dispatch log writes. Does **not** own business protocol state (acks, workflows). |\n| Handler Registry | v1: `stdin`, `silent`, `watch`. Registry shape designed so `exec`, `webhook`, `file-tail` can land later without dispatcher changes. |\n| Socket | Used only for long-lived operations: `c11 mailbox watch`. Send / recv do **not** touch the socket. Configure goes through socket metadata commands (same path as `c11 set-metadata`). |\n| Sidebar badge | Visual salience for the operator. Fires regardless of delivery mode. |\n| CLI | `c11 mailbox send / recv / watch / configure` — thin wrappers over file operations and existing metadata commands. |\n\n---\n\n## 2. Delivery mechanisms — pluggable by design\n\n**Receiver-declared, not sender-imposed.** Each surface's own pane metadata says how it wants messages delivered. Senders hand c11 an envelope; they do not pick the delivery mode.\n\n### Config keys (in pane metadata)\n\nMessaging config lives in the existing CMUX-11 pane metadata layer as namespaced keys:\n\n| Key | Value | Meaning |\n|---|---|---|\n| `mailbox.delivery` | comma-separated list | e.g. `\"stdin,watch\"`, `\"silent\"`. Selects handlers. |\n| `mailbox.subscribe` | comma-separated globs | e.g. `\"build.*,deploy.green\"`. Topic subscription patterns. |\n| `mailbox.retention_days` | integer string | e.g. `\"7\"`. Inbox envelope retention. Defaults to 7. |\n| `mailbox.advertises` | v1.1 — deferred | Topic discovery metadata. |\n\nc11 reads these via the same path it already uses for pane metadata (socket `get-metadata`), not by parsing a file in the mailbox directory. **Pane metadata is the single source of truth.** This composes cleanly with CMUX-37's Blueprints and Snapshots: mailbox config rides along in `SurfaceSpec.metadata` when the workspace is serialized or restored.\n\n### Configure — three equivalent ways\n\n**CLI (ergonomic):**\n```\nc11 mailbox configure --delivery stdin,watch\nc11 mailbox configure --subscribe \"build.*,deploy.green\"\nc11 mailbox configure --retention-days 14\n```\n\n**Generic metadata command (existing):**\n```\nc11 set-metadata --key mailbox.delivery --value stdin,watch\nc11 set-metadata --key mailbox.subscribe --value \"build.*,deploy.green\"\n```\n\n**Blueprint frontmatter (when CMUX-37 lands):**\n```yaml\nsurfaces:\n  - name: watcher\n    metadata:\n      mailbox.delivery: stdin,watch\n      mailbox.subscribe: \"build.*,deploy.green\"\n```\n\nAll three write to the same pane metadata. No drift — the CLI wrapper calls the same API the generic metadata command calls.\n\n### Inspecting\n\n```\nc11 mailbox show-config [--surface <name>]    # prints mailbox.* keys for this or a named surface\nc11 get-metadata --key mailbox.delivery        # one-key read\n```\n\n### Handlers in v1\n\n| Handler | What it does | Who it's for |\n|---|---|---|\n| `stdin` | Writes the `<c11-msg>` framed block to the recipient's PTY on the main actor, with a 500 ms **reporting** bound (dispatcher moves on and logs `timeout`; the underlying writer may still be running — see §Stage 2 scope). Logs `closed` when the surface lookup fails, `timeout` when the deadline fires. Envelope is already in the recipient's inbox before the handler runs, so a dropped write still leaves the message available via `recv`. Real PTY write errno propagation (EIO/EPIPE) is Stage 3 scope alongside async-cancellable writes. | Default for agent surfaces (Claude Code, Codex, Kimi, plain REPLs). Not auto-selected for unknown surface types — must be declared in manifest. |\n| `silent` | No-op beyond the mailbox write. Recipient fetches via `recv` or `watch`. | Full-screen raw-mode TUIs (vim, lazygit). Agents that want zero side effects. |\n| `watch` | Pushes an NDJSON line to active `c11 mailbox watch` subscribers on the socket. | Sidecar processes. Silent surfaces paired with an external watcher. Tooling that wants a stream. |\n\n**v1 does not auto-default `stdin` for unknown surface types.** Only agent profiles c11 recognizes (Claude Code, Codex, Kimi) auto-receive `delivery: [\"stdin\"]` at surface creation. Everything else defaults to `[\"silent\"]` until the operator or agent explicitly declares otherwise. This is a deliberate safety property — PTY injection into `vim`, `less`, a shell child process, or a raw-mode TUI produces garbage or accidental command execution.\n\n### Handlers deferred to v1.1+\n\n| Handler | What it would do | Why not v1 |\n|---|---|---|\n| `exec` | Spawns a user-specified command with the envelope on stdin. | **Privilege boundary disguised as convenience.** Needs allowlists, env policy, timeout/kill behavior, stdout/stderr capture, retry semantics, UI affordances. Ship with a proper security model or not at all. |\n| `webhook` | `POST`s the envelope as JSON to a URL. | Network dependency + auth complexity. Primary value is remote-workspace bridging, which isn't v1. |\n| `file-tail` | Appends the framed block to a designated log file. | Equivalent to `exec` + `tee`; re-evaluate when `exec` ships. |\n| `signal` | Sends a POSIX signal to the surface's process. | Advanced; narrow use case. |\n\n### Dispatch flow\n\n```mermaid\nflowchart TD\n    fsev[\"fsevent OR periodic sweep:<br/>new .msg in _outbox/\"] --> dedupe{\"Seen this id<br/>in _dispatch.log?\"}\n    dedupe -->|yes| skip[Skip — already dispatched]\n    dedupe -->|no| move[\"Atomic move:<br/>_outbox/ → _processing/\"]\n    move --> validate{\"Validate envelope<br/>(schema + size)\"}\n    validate -->|fail| reject[\"Move to _rejected/<br/>+ write .err\"]\n    validate -->|pass| route{\"to / topic / both?\"}\n    route -->|to: surface| direct[Resolve single recipient]\n    route -->|topic: X| topic[Match X against<br/>all manifests' subscribe globs]\n    direct --> recipients[Recipient list]\n    topic --> recipients\n    recipients --> copy[Copy envelope into<br/>each recipient inbox]\n    copy --> badge[Bump sidebar badges]\n    badge --> foreach{For each recipient,<br/>each handler in manifest.delivery}\n    foreach -->|stdin| h1[\"async PTY write<br/>(500 ms timeout)\"]\n    foreach -->|silent| h2[no-op]\n    foreach -->|watch| h3[NDJSON → subscribers]\n    h1 --> log[Append to _dispatch.log]\n    h2 --> log\n    h3 --> log\n    log --> cleanup[Remove from _processing/]\n    cleanup --> done([done])\n    skip --> done\n    reject --> done\n```\n\nHandlers run independently. Failures are logged, never block other handlers or the dispatch loop. The envelope persists in the recipient inbox regardless of handler outcome — if `stdin` failed, the message is still durable and the recipient will see it on next `recv`.\n\n### Sender-hints, receiver-decides\n\nThe sender's only lever is envelope attributes (`urgent: true`, …). Each handler interprets or ignores them. **No sender can force delivery via a channel the recipient didn't opt into.**\n\n---\n\n## 3. Two interfaces — filesystem is the contract, CLI is convenience\n\nAgents have two equivalent ways to send and receive. **The filesystem is authoritative.** The CLI does nothing a shell script and a JSON encoder couldn't.\n\n### Directory layout\n\nPer-workspace. `<ws>` is the workspace ULID.\n\n```\n$C11_STATE/workspaces/<ws>/mailboxes/\n  _outbox/                        # shared drop zone (everyone writes here)\n    01K3A2B7X.tmp                 # in flight\n    01K3A2B8Y.msg                 # ready for dispatch\n  _processing/                    # dispatcher's in-flight work (atomic move target)\n    01K3A2B9Z.msg\n  _rejected/                      # malformed, oversized, or invalid envelopes\n    01K3A2B10.msg\n    01K3A2B10.err                 # why it was rejected\n  blobs/                          # allowlisted body_ref payloads (>4 KB bodies)\n    01K3A2B11.body\n  _dispatch.log                   # append-only NDJSON, one line per dispatch event\n  <surface-name>/                 # per-surface inbox; directory named after CMUX-11 pane name\n    01K3A2B12.msg                 # pending message\n```\n\n**No `manifest.json` file.** Config lives in pane metadata (see §2). The filesystem contract covers content only — envelopes in `_outbox/`, inbox dirs, blobs, the dispatch log. This keeps the filesystem-as-contract principle for content while avoiding drift between on-disk config and c11-managed pane metadata.\n\n### Envelope schema (v1, LOCKED)\n\n```json\n{\n  \"version\": 1,                             // required, integer\n  \"id\": \"01K3A2B7X\",                        // required, ULID string\n  \"from\": \"builder\",                        // required, surface handle\n  \"ts\": \"2026-04-23T10:15:42Z\",             // required, RFC3339 UTC (sender-attested; NOT an ordering field)\n  \"body\": \"build green sha=abc\",            // required, UTF-8 string (may be empty only if body_ref is set)\n\n  \"to\": \"watcher\",                          // optional; at least one of to/topic required\n  \"topic\": \"ci.status\",                     // optional; dotted token (no globs on publish)\n\n  \"reply_to\": \"watcher\",                    // optional, surface handle\n  \"in_reply_to\": \"01K3ABC\",                 // optional, ULID\n  \"urgent\": true,                           // optional, JSON boolean\n  \"ttl_seconds\": 3600,                      // optional, integer; auto-expire after N seconds\n  \"body_ref\": \"/path/to/large/payload\",     // optional, absolute path; body MUST be empty string when this is set\n  \"content_type\": \"application/json\",       // optional, MIME hint\n\n  \"ext\": { \"any\": \"k/v map\" }               // optional; forward-compat escape hatch\n}\n```\n\n**Rules:**\n- Unknown top-level keys are rejected unless nested under `ext`. Deliberate evolution; no silent conflicts.\n- `version` is an integer, not a string. Bumps are breaking; additive fields within v1 are allowed.\n- Inline `body` capped at 4096 bytes UTF-8. Above that, sender MUST use `body_ref` pointing to an absolute file path; c11 delivers the envelope with `body_ref` and empty `body`. Recipient reads the file itself.\n- `to` and `topic` are independent: a message may route to both. Topic glob matching applies only to subscription patterns, not to published topic names.\n- `ts` is sender-declared metadata for humans and debugging. **It is not authoritative for ordering.** Dispatcher assigns `received_at` in `_dispatch.log` for actual ordering.\n\n### Sending — two equivalent ways\n\n**As a file write** (any process, any language, no c11 SDK). The raw writer pulls its own outbox directory and surface title via three helper subcommands — no c11-specific env vars required.\n\n```bash\nOUTBOX=$(c11 mailbox outbox-dir)\nMY_NAME=$(c11 mailbox surface-name)\nULID=$(c11 mailbox new-id)\ncat > \"$OUTBOX/.$ULID.tmp\" <<EOF\n{\n  \"version\": 1,\n  \"id\": \"$ULID\",\n  \"from\": \"$MY_NAME\",\n  \"to\": \"watcher\",\n  \"topic\": \"ci.status\",\n  \"ts\": \"$(date -u +%FT%TZ)\",\n  \"body\": \"build green sha=abc\"\n}\nEOF\nmv \"$OUTBOX/.$ULID.tmp\" \"$OUTBOX/$ULID.msg\"\n```\n\nThe `.tmp → .msg` rename is atomic within a filesystem. c11's fsevent watcher only sees the final `.msg` state. Stale `.tmp` files are GC'd after 5 minutes (writer crash protection). The dot-prefix on the temp file keeps it hidden from shell globs and the watcher's filename filter.\n\n**As a CLI call:**\n\n```\nc11 mailbox send --to watcher --topic ci.status --body \"build green sha=abc\"\n```\n\nEquivalent to the above; auto-fills `version`, `from`, `ts`, `id`. Prints the envelope id on success.\n\n### Receiving — two equivalent ways\n\n**As file reads:**\n\n```bash\nINBOX=$(c11 mailbox inbox-dir)\nfor msg in \"$INBOX\"/*.msg; do\n  cat \"$msg\"\n  rm  \"$msg\"\ndone\n```\n\n**As a CLI call:**\n\n```\nc11 mailbox recv --drain       # prints all pending as NDJSON, unlinks them\nc11 mailbox recv --peek        # prints without unlinking\nc11 mailbox watch              # streams arrivals on stdout as NDJSON (socket)\n```\n\n`watch` is the one operation that requires the socket — a live stream. Everything else is file I/O.\n\n### Configuring\n\nSee §2. Config lives in pane metadata, set via `c11 mailbox configure`, `c11 set-metadata`, or Blueprint frontmatter — all three write to the same place.\n\n### Drift prevention — rules that keep the two interfaces honest\n\nAny system with two ways to do the same thing is at risk of silent divergence. Policy rules + enforcement:\n\n**1. One envelope-builder library — CLI has no private code path.**\nThe CLI calls the same `build_envelope()` function any SDK or tool would use. Defaults (auto-`id`, auto-`ts`, auto-`from`) live in exactly one place.\n\n**2. Validation at dispatch, not at send.**\nWhether an envelope arrives via CLI or a raw `cat > _outbox/...`, it goes through the **same** validator inside the dispatcher. Malformed envelopes are quarantined to `_rejected/`. The CLI does not pre-validate and silently succeed where the dispatcher would later fail.\n\n**3. No CLI-only features.**\nAny capability must be reachable from a raw file write. If you find yourself adding something CLI-only, that's a design smell — model it as an envelope field instead.\n\n**4. Envelope schema carries a `version` field.**\nSchema evolution is explicit. Additive changes are forward-compatible; breaking changes bump the major.\n\n**5. Skill teaches both paths side-by-side, not CLI-first.**\nPrevents CLI becoming load-bearing while file layout becomes folklore.\n\n**6. Test parity — THIS IS THE ACTUAL ENFORCEMENT.**\nIntegration test parameterized over both send paths asserts **byte-equivalent inbox state**. The rules above are policy; this test is the lock. Without it, drift is invisible until production. Write this test **before the CLI is implemented**.\n\n**7. CLI `send` implementation counted in lines — smoke alarm.**\nIf the CLI's send path exceeds ~30 lines, we've absorbed logic that belongs in the library or the dispatcher.\n\n**What drift looks like if we get it wrong:**\n- CLI auto-subscribes to a topic on first publish; file writers don't. Silent divergence in who's a subscriber.\n- CLI rate-limits; file writers are unthrottled.\n- Dispatcher starts requiring a field the CLI auto-fills; file-written envelopes start getting rejected.\n\nAll three are preventable by the rules above. All three are the kind of thing that creeps in quietly if the rules aren't enforced by test #6.\n\n---\n\n## 4. Topic subscribe + fan-out\n\nSubscribers set `mailbox.subscribe` in their pane metadata (comma-separated glob patterns). Publishers write one envelope to `_outbox/`; c11 reads every surface's pane metadata in the workspace, matches the published topic against each `mailbox.subscribe` pattern, and fans out at dispatch.\n\n```\n# Set on the watcher surface\nc11 mailbox configure --surface watcher --subscribe \"build.*,deploy.green\"\n```\n\n**Subscription semantics:**\n- `mailbox.subscribe` is a comma-separated list of glob patterns matched against a published message's `topic` field.\n- Standard glob: `*` matches one segment, `**` matches multiple. `build.*` matches `build.ready` and `build.failed` but not `build.ci.ready` (use `build.**` for that).\n- Direct `to:` sends bypass subscription — always delivered to the named surface regardless of topics.\n- Fan-out is scoped to the workspace. A subscriber in workspace A does not receive messages published in workspace B.\n\n**What is NOT in v1:**\n- No topic discovery registry. `_topics.json`, `mailbox.advertises`, and `c11 mailbox topics describe <topic>` are all deferred to v1.1.\n- No published-topic globs (publishers name a concrete topic; only subscribers use globs).\n- No schema hints for topic bodies.\n\nAgents discover topics in v1 by reading each other's pane metadata (`c11 get-metadata --surface <name> --key mailbox.advertises` — even though `advertises` is v1.1, nothing stops an agent from writing that key today and reading it later) or by out-of-band agreement (the skill, operator docs). Registry CLI lands in v1.1.\n\n---\n\n## 5. Delivery semantics — at-least-once, dedupe by id\n\n**The contract:**\n- **Durable to inbox at-least-once (steady-state).** Once an envelope lands in `_outbox/` while the dispatcher is running, it reaches every resolved recipient's inbox at least once. Restarts pick up pre-existing `_outbox/*.msg` files on start (see `MailboxOutboxWatcher.start`).\n- **Stage-2 caveat: crash-recovery for `_processing/` is Stage 3.** If the dispatcher is killed mid-dispatch after an envelope has moved to `_processing/` but before the inbox copy finishes, Stage 2 does not sweep
