name: CI

# Every PR runs this workflow, so the required check always reports. A
# docs-only PR skips the cheap checks through the scope job instead of a
# paths filter (a skipped workflow would leave the required check pending).
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # code=false only when every file the PR touches is documentation
  # (**/*.md, docs/**, notes/**, Resources/Localizable.xcstrings).
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Checkout scope script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-pr-scope.sh
          sparse-checkout-cone-mode: false

      - name: Classify the PR's files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/ci-pr-scope.sh scope

  workflow-guards:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Atlas admission helpers
        run: ./tests/test_ci_atlas_tools.sh

      - name: Validate create-dmg version pinning
        run: ./tests/test_ci_create_dmg_pinned.sh

      - name: Validate c11 scheme test configuration
        run: ./tests/test_ci_scheme_testaction_debug.sh

      - name: Validate the native backstop's target and skip selection
        run: ./tests/test_ci_backstop_target.sh

      - name: Validate PR scope and the required-check verdict
        run: ./tests/test_ci_pr_scope.sh

      - name: Validate the backstop CLI test step
        run: ruby tests/test_ci_python_cli_step.rb

      - name: Validate completed-attempt timing
        run: python3 tests/test_ci_workflow_timing.py

      - name: Validate Atlas performance lane
        run: python3 scripts/c11-perf-lane-test.py

      - name: Validate Atlas main backstop
        timeout-minutes: 2
        run: python3 scripts/c11-main-backstop-test.py

      - name: Validate parallel logic and backstop fan-out
        run: |
          set -euo pipefail
          ruby tests/test_ci_logic_parallelism.rb
          ruby tests/test_ci_backstop_split.rb

      - name: Validate remote build test routing
        run: python3 tests/test_remote_build_routing.py

      - name: Validate GhosttyKit checksum verification
        run: ./tests/test_ci_ghosttykit_checksum_verification.sh

      - name: Validate local GhosttyKit SHA guard
        run: ./tests/test_ghosttykit_guard.sh

      - name: Validate release asset guard
        run: node scripts/release_asset_guard.test.js

      - name: Validate unpublished signing producer with synthetic tools
        run: python3 tests/test_sign_artifact.py

      - name: Validate the build lock serializes builds
        run: ./tests/test_with_build_lock.sh

      - name: Validate current GhosttyKit checksum pin
        run: ./tests/test_ci_ghosttykit_checksum_present.sh

      - name: Run drawbridge gate tests
        run: python3 tests/drawbridge/test_gates.py

      # Offline, no token: exercises the alarm paths of the Sentry recurrence
      # detector, which are otherwise only reachable by actually exhausting a
      # quota or silencing a real client.
      - name: Validate Sentry recurrence checks
        run: ./scripts/telemetry/sentry-position.py --self-test

  agent-runtime-tests:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Synthetic binaries and temporary sockets only; runs for fork PRs too.
      - name: Validate agent wrapper lifecycle and resume
        run: |
          set -euo pipefail
          python3 tests/test_codex_wrapper_resume.py
          python3 tests/test_codex_wrapper_hooks.py
          python3 tests/test_claude_wrapper_hooks.py
          python3 tests/test_opencode_wrapper_hooks.py
          python3 tests/test_pi_wrapper_hooks.py
          python3 tests/test_omp_wrapper_hooks.py
          python3 tests/test_agent_wrapper_interactive_marker.py
          python3 tests/test_socket_guard.py
          # Full sweep is the hourly python job. This is the incident pair only.
          python3 tests/test_socket_guard_canary.py --smoke

      # The OpenCode plugin, and the Pi and omp extensions (TypeScript, which
      # Bun runs as is), driven through fake hosts: no harness, no network.
      - name: Setup Bun for runtime plugin tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Validate runtime plugin lifecycle and prompt cache reports
        run: |
          set -euo pipefail
          node tests/test_opencode_plugin_lifecycle.mjs
          node --test tests/test_mailbox_native.mjs
          bun tests/test_pi_omp_prompt_cache_extensions.mjs
          bun tests/test_omp_native_mail.mjs
          bash tests/test_statusline_prompt_cache_snippet.sh

  # The required check on main. It always runs, so docs-only PRs report it too.
  # Every job in needs is judged: success on code PRs, skipped on docs-only.
  workflow-guard-tests:
    needs: [scope, workflow-guards, agent-runtime-tests, remote-daemon-tests, web-typecheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout verdict script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-pr-scope.sh
          sparse-checkout-cone-mode: false

      - name: Require every cheap check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: ./scripts/ci-pr-scope.sh verdict

  remote-daemon-tests:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/remote/go.mod

      - name: Run remote daemon tests
        working-directory: daemon/remote
        run: go test ./...

      - name: Validate remote daemon release assets
        run: ./tests/test_remote_daemon_release_assets.sh

  web-typecheck:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc --noEmit
