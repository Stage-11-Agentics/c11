name: Mailbox parity

# Syntax check for the c11 mailbox hook-drain CLI test (C11-13 Stage 2).
# Push and PR events stay cheap: this workflow only compiles that Python
# test. Native Mailbox* and StdinHandler* coverage runs in the main
# backstop's `c11-logic` lane in `ci-hourly.yml`. No CLI-vs-raw envelope
# byte-parity check runs anywhere now; the old live-socket parity script was removed in
# C11-345 because its setup switched the operator's workspace.

on:
  push:
    paths:
      - "tests/test_mailbox_hook_drain_cli.py"
      - "Resources/bin/codex"
      - "Sources/Mailbox/**"
      - "CLI/c11.swift"
      - "spec/**"
      - "c11Tests/Mailbox*.swift"
      - "c11Tests/StdinHandler*.swift"
      - ".github/workflows/mailbox-parity.yml"
  pull_request:
    paths:
      - "tests/test_mailbox_hook_drain_cli.py"
      - "Resources/bin/codex"
      - "Sources/Mailbox/**"
      - "CLI/c11.swift"
      - "spec/**"
      - "c11Tests/Mailbox*.swift"
      - "c11Tests/StdinHandler*.swift"
      - ".github/workflows/mailbox-parity.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile mailbox CLI test (syntax check)
        run: python3 -m py_compile tests/test_mailbox_hook_drain_cli.py
