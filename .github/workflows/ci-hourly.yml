name: CI main (macOS)

# Native backstop for main: the app build, logic tests and host tests. It runs
# when main changes, not on a clock. The concurrency group never cancels a
# running build and holds at most one pending run, which each newer push
# replaces. GitHub can admit an older push's run after a newer one, so a run
# does not test its trigger: once admitted, it resolves the ref's tip once and
# tests that commit. Every push is therefore followed by a run that starts after
# it and tests a main that contains it. A pass posts a "CI main (macOS)" success
# status on the tested commit; a run whose tip already has one skips the build.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this commit already passed
        type: boolean
        default: false

concurrency:
  group: ci-main-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GREEN_STATUS_CONTEXT: CI main (macOS)

jobs:
  target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      tested: ${{ steps.select.outputs.tested }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-backstop-target.sh
          sparse-checkout-cone-mode: false

      - name: Resolve the ref's tip and its green record
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/ci-backstop-target.sh "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$GREEN_STATUS_CONTEXT" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: target
    if: ${{ inputs.force || needs.target.outputs.tested != 'true' }}
    # Free standard runner (3 cores); the XLarge build took about 10 minutes.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      statuses: write
    env:
      TARGET_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_DIR="/Applications/Xcode.app/Contents/Developer"
          if [ ! -d "$XCODE_DIR" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
            [ -n "$XCODE_APP" ] || { echo "No Xcode.app found under /Applications" >&2; exit 1; }
            XCODE_DIR="$XCODE_APP/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          XCODE_VER="${XCODE_VERSION_OUTPUT%%$'\n'*}"
          echo "XCODE_VER=$XCODE_VER" >> "$GITHUB_ENV"
          echo "$XCODE_VERSION_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-${{ hashFiles('.gitmodules', 'ghostty') }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Ensure process-scoped Zig
        run: |
          set -euo pipefail
          ZIG_DIR="$(./scripts/ensure-zig.sh)"
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          export PATH="$ZIG_DIR:$PATH"
          zig version

      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*
          key: deriveddata-build-${{ runner.os }}-${{ env.XCODE_VER }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-build-${{ runner.os }}-${{ env.XCODE_VER }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            deriveddata-build-${{ runner.os }}-${{ env.XCODE_VER }}-
            deriveddata-build-${{ runner.os }}-

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: .ci-source-packages
          key: spm-${{ runner.os }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11 -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resolvePackageDependencies

      - name: Build app
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11 -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: SSH shell command availability
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11 -configuration Debug \
            -clonedSourcePackagesDirPath "$PWD/.ci-source-packages" \
            -disableAutomaticPackageResolution -destination "platform=macOS" \
            -showBuildSettings -json > "$RUNNER_TEMP/c11-build-settings.json"
          CLI_BINARY="$(python3 -c 'import json,sys; rows=json.load(open(sys.argv[1])); settings=next(row["buildSettings"] for row in rows if row["target"] == "c11"); print(settings["BUILT_PRODUCTS_DIR"] + "/c11")' "$RUNNER_TEMP/c11-build-settings.json")"
          test -x "$CLI_BINARY"
          C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_ssh_shell_bootstrap.py
          C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_focus_history.py
          C11_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_window_scope.py

      - name: Shell helper lifetime and git reporting
        run: bash tests/test_shell_git_watchers.sh

      - name: Logic tests (gate)
        # Hard-fail gate: pure-logic suite (parsers, snapshots, persistence,
        # mailbox, theme). The password-store class stays excluded because its
        # SSH execution path requires Keychain access on the runner.
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
            -project GhosttyTabs.xcodeproj -scheme c11-logic -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            -skip-testing:c11LogicTests/SocketControlPasswordStoreTests \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test

      - name: Host-bound unit tests (gate)
        # C11-253 / C11-332: all retained tests gate, and every exclusion is a
        # single method with a one-line reason. No class-level exclusions.
        # Inventory: notes/c11-253-host-test-triage.md.
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          HOST_TEST_QUARANTINE=(
            # C11-253: synthetic views lack a live Ghostty surface/responder; guest QA proves Shift+backquote.
            c11Tests/GhosttyBackquoteRegressionTests/testShiftBackquoteEscFallbackSendsLiteralTilde
            # C11-253: synthetic views lack a live Ghostty surface/responder; guest QA proves Option+Delete.
            c11Tests/GhosttyOptionDeleteRegressionTests/testOptionDeletePreservesAltAsModifierForWordDelete
            # C11-253: synthetic views lack a live Ghostty surface/responder; guest QA proves Korean commit + Return.
            c11Tests/KoreanIMEReturnCommitRegressionTests/testReturnAfterKoreanCommitAlsoSendsReturnToSurface
            # C11-253: standalone split panels have no portal-bound window; guest QA proves split-focus recovery.
            c11Tests/WorkspaceTerminalFocusRecoveryTests/testTerminalClickRecoversSplitActiveStateWhenFocusCallbackIsSuppressed
            # C11-253: standalone split panels have no portal-bound window; guest QA proves split-focus recovery.
            c11Tests/WorkspaceTerminalFocusRecoveryTests/testTerminalFirstResponderConvergesSplitActiveStateWhenSelectionAlreadyMatches
            # C11-253: ttyname(stdin) can name a pty that is not the host's controlling tty, so PROC_TTY_ONLY finds nothing.
            c11Tests/PanelLifecycleTests/testTerminalPIDResolverResolvesOwnControllingTTY
            # C11-253: the standalone host remaps posted pointer coordinates; guest scenario 9 proves divider reopening.
            c11Tests/WindowBrowserHostViewTests/testHostViewPassesThroughDividerWhenAdjacentPaneIsCollapsed
            # C11-253: the standalone host remaps posted pointer coordinates; guest scenario 10 proves divider reopening.
            c11Tests/WindowTerminalHostViewTests/testHostViewPassesThroughDividerWhenAdjacentPaneIsCollapsed
            # C11-332 product bug: workspace creation never prunes an orphaned window context (selection skips it, so discard is unreachable).
            c11Tests/AppDelegateShortcutRoutingTests/testAddWorkspaceInPreferredMainWindowPrunesOrphanedContextWithoutLiveWindow
            # C11-332 product bug: same unpruned orphaned window context, reached through a remapped New Workspace shortcut.
            c11Tests/AppDelegateShortcutRoutingTests/testCustomCmdTNewWorkspacePrunesOrphanedContextWithoutLiveWindow
            # C11-335: wall-clock budget, not correctness; shared 3-core macos-15 measures 1.8x it. Time it on a quiet host.
            c11Tests/ThemeResolverBenchmarks/testResolverP95PerformanceBudget
          )
          SKIP_ARGS=()
          for test_id in "${HOST_TEST_QUARANTINE[@]}"; do
            echo "Quarantined host test: $test_id"
            SKIP_ARGS+=("-skip-testing:$test_id")
          done
          host_tests() {
            "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
              -project GhosttyTabs.xcodeproj -scheme c11-unit -configuration Debug \
              "$@" \
              "${SKIP_ARGS[@]}" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              test
          }
          # C11-332: AppDelegateShortcutRoutingTests runs in its own host process.
          # Its closed main windows stay alive in this host, and the backlog they
          # leave on the main queue starves later classes' deferred-mount waits.
          host_tests -only-testing:c11Tests -skip-testing:c11Tests/AppDelegateShortcutRoutingTests
          host_tests -only-testing:c11Tests/AppDelegateShortcutRoutingTests

      - name: Record green for the tested commit
        # Best effort: without the status the next run rebuilds this commit.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=success \
            -f context="$GREEN_STATUS_CONTEXT" \
            -f description="Native build, logic and host tests passed" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
