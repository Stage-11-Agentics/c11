# Drawbridge nightly sweep — re-triages anything the event handlers missed
# (no drawbridge:* label) and posts a digest to the maintainer channel.
# See TRIAGE_POLICY.md.

name: Drawbridge Sweep

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  drawbridge-sweep:
    name: drawbridge-sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write # dispatch drawbridge.yml for missed items
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Find and re-dispatch untriaged items
        id: sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAX_DISPATCH=10

          # search/issues carries GitHub's secondary rate limit, which a sweep can
          # trip on a busy morning. Retry with backoff before giving up.
          gh_search() {
            local attempt
            for attempt in 1 2 3; do
              if gh api -X GET search/issues "$@"; then
                return 0
              fi
              echo "search/issues attempt $attempt failed; retrying" >&2
              sleep $((attempt * 10))
            done
            return 1
          }

          # A count is decoration on the digest, so degrade it rather than losing
          # the whole digest to a throttled call.
          count_open() {
            local n
            if n="$(gh_search -f q="$1" -f per_page=1 --jq '.total_count')"; then
              printf '%s' "$n"
            else
              echo "::warning::could not count '$1'; reporting as unknown" >&2
              printf '?'
            fi
          }

          q="repo:$GITHUB_REPOSITORY is:open -label:\"drawbridge:autonomous\" -label:\"drawbridge:review\" -label:\"drawbridge:close-suggest\""
          gh_search -f q="$q" -f per_page=50 \
            --jq '.items | map({number, title, is_pr: (has("pull_request")), html_url})' > /tmp/untriaged.json

          total="$(jq 'length' /tmp/untriaged.json)"
          echo "untriaged open items: $total"

          dispatched=0
          while read -r row; do
            [[ "$dispatched" -ge "$MAX_DISPATCH" ]] && break
            num="$(jq -r '.number' <<<"$row")"
            if [[ "$(jq -r '.is_pr' <<<"$row")" == "true" ]]; then type=pr; else type=issue; fi
            echo "dispatching drawbridge for $type #$num"
            gh workflow run drawbridge.yml -f item_type="$type" -f item_number="$num"
            dispatched=$((dispatched + 1))
          done < <(jq -c '.[]' /tmp/untriaged.json)

          open_prs="$(count_open "repo:$GITHUB_REPOSITORY is:open is:pr")"
          open_issues="$(count_open "repo:$GITHUB_REPOSITORY is:open is:issue")"

          {
            echo "🌉 **Nightly sweep** — $open_prs open PRs, $open_issues open issues, $total untriaged."
            if [[ "$total" -gt 0 ]]; then
              echo
              echo "Re-dispatched $dispatched for triage:"
              jq -r '.[] | "- [\(if .is_pr then "PR" else "issue" end) #\(.number): \(.title)](\(.html_url))"' /tmp/untriaged.json | head -n "$MAX_DISPATCH"
              if [[ "$total" -gt "$MAX_DISPATCH" ]]; then
                echo "- …and $((total - MAX_DISPATCH)) more (next sweep)"
              fi
            fi
          } > /tmp/digest.md

      # Zulip is tailnet-only; ephemeral ACL-scoped join (see drawbridge.yml).
      - name: Join tailnet (ephemeral, scoped to Zulip)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Post digest
        env:
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
        run: scripts/drawbridge/notify.sh TRIAGE_POLICY.md /tmp/digest.md
