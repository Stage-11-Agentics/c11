name: CI timing

# Runs after completion so setup, post steps and inter-job waits are all measured.
# The reporter executes only the trusted default branch, never the measured head.
on:
  workflow_run:
    workflows: [CI, "CI main (macOS)", Drawbridge]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Record completed attempt and step times
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" > "$RUNNER_TEMP/run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 scripts/ci-workflow-timing.py --run "$RUNNER_TEMP/run.json" \
            --jobs "$RUNNER_TEMP/jobs.json" --output "$RUNNER_TEMP/timing.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain timing record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/timing.json
          retention-days: 30
