name: Mailbox parity

# Syntax check for the c11 mailbox hook-drain CLI test (C11-13 Stage 2).
# Push and PR events stay cheap: this workflow only compiles that Python
# test. Native Mailbox* and StdinHandler* coverage runs in the main
# backstop's `c11-logic` lane in `ci-hourly.yml`, including the CLI-vs-raw
# envelope byte-parity lock
# (MailboxEnvelopeValidationTests.testCLIAndRawFileSendersProduceIdenticalInboxBytes).

on:
  push:
    paths:
      - "tests/test_mailbox_hook_drain_cli.py"
      - "Resources/bin/codex"
      - "Sources/Mailbox/**"
      - "CLI/**"
      - "spec/**"
      - "c11Tests/Mailbox*.swift"
      - "c11Tests/StdinHandler*.swift"
      - ".github/workflows/mailbox-parity.yml"
  pull_request:
    paths:
      - "tests/test_mailbox_hook_drain_cli.py"
      - "Resources/bin/codex"
      - "Sources/Mailbox/**"
      - "CLI/**"
      - "spec/**"
      - "c11Tests/Mailbox*.swift"
      - "c11Tests/StdinHandler*.swift"
      - ".github/workflows/mailbox-parity.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compile mailbox CLI test (syntax check)
        run: python3 -m py_compile tests/test_mailbox_hook_drain_cli.py
