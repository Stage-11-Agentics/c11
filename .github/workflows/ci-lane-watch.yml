name: CI lane watch

# Outside the lane workflows. An invalid workflow file runs zero jobs, so a
# reporter inside the lane cannot see it. This reads main's completed runs.
# A dispatch from another branch still judges main, and cannot close the
# main-lane issue on the strength of a fix branch.
on:
  schedule:
    # Offset from the compat lane's :00 start.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-lane-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report lane results
        env:
          GH_TOKEN: ${{ github.token }}
          CI_LANE_OWNER: ${{ vars.CI_LANE_OWNER || 'BenevolentFutures' }}
        run: ./scripts/ci-scheduled-lane-owner.sh
