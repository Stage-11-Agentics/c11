name: Prepare c11 macOS backstop runner
description: Select Xcode and restore the native build caches used by each backstop job.
inputs:
  use-build-cache:
    description: Restore GhosttyKit, Zig, and the general DerivedData cache for a build job.
    required: false
    default: "true"
outputs:
  xcode-version:
    description: The selected Xcode version used to scope the DerivedData cache.
    value: ${{ steps.select-xcode.outputs.version }}
  dependency-key:
    description: Dependency and project inputs used to scope the DerivedData cache.
    value: ${{ steps.select-xcode.outputs.dependency-key }}
runs:
  using: composite
  steps:
    - name: Select Xcode
      id: select-xcode
      shell: bash
      run: |
        set -euo pipefail
        XCODE_DIR="/Applications/Xcode.app/Contents/Developer"
        if [ ! -d "$XCODE_DIR" ]; then
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          [ -n "$XCODE_APP" ] || { echo "No Xcode.app found under /Applications" >&2; exit 1; }
          XCODE_DIR="$XCODE_APP/Contents/Developer"
        fi
        echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
        export DEVELOPER_DIR="$XCODE_DIR"
        XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
        XCODE_VER="${XCODE_VERSION_OUTPUT%%$'\n'*}"
        echo "XCODE_VER=$XCODE_VER" >> "$GITHUB_ENV"
        echo "version=$XCODE_VER" >> "$GITHUB_OUTPUT"
        DEPENDENCY_KEY="$("$GITHUB_WORKSPACE/scripts/ci-deriveddata-dependency-key.sh" "$GITHUB_WORKSPACE")"
        echo "dependency-key=$DEPENDENCY_KEY" >> "$GITHUB_OUTPUT"
        echo "$XCODE_VERSION_OUTPUT"

    - name: Cache GhosttyKit.xcframework
      id: cache-ghosttykit
      if: ${{ inputs.use-build-cache != 'false' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: GhosttyKit.xcframework
        key: ghosttykit-${{ hashFiles('.gitmodules', 'ghostty') }}

    - name: Download pre-built GhosttyKit.xcframework
      if: ${{ inputs.use-build-cache != 'false' && steps.cache-ghosttykit.outputs.cache-hit != 'true' }}
      shell: bash
      run: ./scripts/download-prebuilt-ghosttykit.sh

    - name: Cache process-scoped Zig
      if: ${{ inputs.use-build-cache != 'false' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: ~/.cache/c11/zig/0.15.2
        key: zig-${{ runner.os }}-0.15.2

    - name: Ensure process-scoped Zig
      if: ${{ inputs.use-build-cache != 'false' }}
      shell: bash
      run: |
        set -euo pipefail
        ZIG_DIR="$(./scripts/ensure-zig.sh)"
        echo "$ZIG_DIR" >> "$GITHUB_PATH"
        export PATH="$ZIG_DIR:$PATH"
        zig version

    - name: Cache DerivedData
      if: ${{ inputs.use-build-cache != 'false' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData/GhosttyTabs-*
        key: deriveddata-build-${{ runner.os }}-${{ env.XCODE_VER }}-${{ steps.select-xcode.outputs.dependency-key }}-${{ github.sha }}
        restore-keys: |
          deriveddata-build-${{ runner.os }}-${{ env.XCODE_VER }}-${{ steps.select-xcode.outputs.dependency-key }}-

    - name: Cache Swift packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: .ci-source-packages
        key: spm-${{ runner.os }}-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: spm-${{ runner.os }}-

    - name: Resolve Swift packages
      shell: bash
      run: |
        set -euo pipefail
        SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
        mkdir -p "$SOURCE_PACKAGES_DIR"
        "$GITHUB_WORKSPACE/scripts/with-build-lock.sh" xcodebuild \
          -project GhosttyTabs.xcodeproj -scheme c11 -configuration Debug \
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
          -resolvePackageDependencies
