# C11H-130: keep c11's main shareable with a friend (Atin, 2026-11-03): the scan, the guards'
# tests, the localization catalog and the c11 card's size, on Linux. Budget: push 30 s, PR 2 min.
name: c11 shareable

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: c11-shareable-${{ github.ref }}
  # A newer PR head replaces an older run; every push to main reports.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shareable:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      # The tests ran on the PR; on main the scan alone keeps the push inside 30 s.
      - name: Test the guard
        if: github.event_name == 'pull_request'
        timeout-minutes: 1
        run: |
          python3 tests/test_check_shareable.py
          python3 tests/test_check_public_tree.py
          python3 tests/test_check_localization_catalog.py

      - name: Scan what a friend receives
        timeout-minutes: 1
        run: python3 scripts/check-shareable.py

      # C11H-385: every String(localized:) key in Sources/ and CLI/ has its catalog entry with
      # English and all six locales, and no locale drops an interpolation token. About a second.
      - name: Every localized key has its six translations
        timeout-minutes: 1
        run: python3 scripts/check-localization-catalog.py

      # Every agent reads the c11 card at launch; depth goes to `c11 guide <page>`.
      - name: The c11 card stays a card
        timeout-minutes: 1
        run: python3 scripts/check-skill-card-size.py
